<!DOCTYPE html>
<html>
<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover'>
    <meta charset='utf-8'>
    <title>IRVE Roadbook Live</title>
    
    <!-- Balises PWA -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0B0B0E" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="./manifest.json">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #FFFFFF; --text: #111114; --muted: #6B6B72; --border: #EBEBEE; --card-bg: #FAFAFB; --input-bg: #FAFAFB; --input-border: #EBEBEE; --pdc-bg: #F3F5F8; --btn-bg: #FAFAFB; --btn-text: #111114;
        --panel-2: #E9EAED; --line-strong: #C3C4CB;
        --accent: #0B72E7; --on-accent: #FFFFFF; --op-color: #0B72E7; --dispo-ok: #16a34a; --dispo-warn: #d97706; --dispo-alert: #dc2626;
        --dispo-ok-bg: #dcfce7; --dispo-warn-bg: #fef3c7; --dispo-alert-bg: #fee2e2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0B0B0E; --text: #F2F2F5; --muted: #8B8B93; --border: #232329; --card-bg: #141418; --input-bg: #141418; --input-border: #232329; --pdc-bg: #182130; --btn-bg: #182130; --btn-text: #F2F2F5;
          --panel-2: #232329; --line-strong: #4A4A54;
          --accent: #4FA3FF; --on-accent: #0B0B0E; --op-color: #4FA3FF; --dispo-ok: #4ade80; --dispo-warn: #fbbf24; --dispo-alert: #f87171;
          --dispo-ok-bg: #052e1a; --dispo-warn-bg: #451a03; --dispo-alert-bg: #450a0a;
        }
      }
      body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
      button, input { -webkit-appearance: none; appearance: none; font-family: inherit; }

      #map {
          position: relative;
          width: 100%;
          flex: 0 0 auto;
          box-sizing: border-box;
          min-height: 40px; /* filet de sécurité avant que le JS ne fixe la hauteur exacte */
      }

      /* --- Panneau de logs : surcouche plein écran indépendante (même
         principe que GeoRouter), ne partage plus l'espace de la carte --- */
      #terminal-logs {
          display: none;
          position: fixed; inset: 0; z-index: 2000;
          background: #0d1117; color: #8ee08e;
          flex-direction: column;
          font-family: 'JetBrains Mono', monospace;
      }
      #terminal-logs.show { display: flex; }
      .log-panel-header {
          display: flex; align-items: center; justify-content: space-between;
          padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top));
          background: #161b22; color: #e6edf3; font-size: 0.82rem; font-weight: 600;
          flex-shrink: 0;
      }
      .log-panel-btn {
          background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px;
          padding: 5px 10px; font-size: 0.72rem; cursor: pointer; font-family: inherit;
      }
      #log-content {
          flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
          padding: 10px 14px 30px; font-size: 0.72rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
          user-select: text; -webkit-user-select: text;
      }
      .log-line { border-bottom: 1px dashed #21262d; padding: 3px 0; }
      .log-line .log-time { color: #6e7681; }
      .log-line .log-cat { color: #58a6ff; font-weight: 700; }
      .log-line.log-err .log-cat { color: #f85149; }
      .log-line.log-err { color: #ffa198; }

      .brouter-ctrl-btn { width: 30px; height: 30px; line-height: 30px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #444; border-bottom: 1px solid #eee; cursor: pointer; background-color: #fff; position: relative; box-sizing: border-box; }
      .brouter-ctrl-btn:last-child { border-bottom: none; }
      .brouter-ctrl-btn:hover { background-color: #f4f4f4; color: #000; }
      .brouter-ctrl-btn.active-track { background-color: var(--accent) !important; color: #fff !important; }
      .brouter-ctrl-btn.active-mode { background-color: var(--accent) !important; color: #fff !important; }
      .brouter-ctrl-btn svg { width: 15px; height: 15px; vertical-align: middle; fill: currentColor; }

      /* --- BOTTOM SHEET : mêmes 3 positions (basse/milieu/haute) que GeoRouter --- */
      .sheet {
        position: relative; width: 100%; flex: 0 0 auto; z-index: 20;
        background: var(--card-bg); color: var(--text);
        box-shadow: 0 -4px 16px rgba(0,0,0,0.10);
        display: flex; flex-direction: column; overflow: hidden;
        transition: height 0.28s cubic-bezier(.4,0,.2,1);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .sheet.dragging { transition: none; }

      .sheet-handle-zone { display: flex; align-items: center; justify-content: center; height: 34px; flex-shrink: 0; cursor: grab; touch-action: none; }
      .sheet-handle { width: 38px; height: 4px; border-radius: 2px; background: var(--muted); }

      .sheet-drag-buffer {
        position: fixed; left: 0; right: 0; height: 22px; z-index: 19;
        cursor: grab; touch-action: none;
        background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.03));
      }

      .sheet-pinned { flex-shrink: 0; padding: 0 12px; }
      .sheet-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 12px 16px; }

      .header-controls { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 10px; font-size: 13px; scrollbar-width: none; -ms-overflow-style: none; }
      .header-controls::-webkit-scrollbar { display: none; }
      .header-trailing-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
      .refresh-btn { background: var(--panel-2); color: var(--btn-text); border: 1px solid var(--line-strong); padding: 5px 9px; border-radius: 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; height: 34px; width: 34px; box-sizing: border-box; }
      .refresh-btn:hover, .refresh-btn:active { filter: brightness(0.96); }
      .refresh-btn.tool-active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

      .input-field { background: var(--input-bg); color: var(--text); border: 1px solid var(--line-strong); padding: 5px; width: 74px; flex-shrink: 0; height: 34px; box-sizing: border-box; border-radius: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; text-align: center; font-size: 13px; }

      /* --- Bandeau : bouton switch de mode élargi et centré --- */
      .mode-switch-btn {
        flex: 1; height: 34px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        background: var(--panel-2); color: var(--btn-text); border: 1px solid var(--line-strong); border-radius: 10px;
        font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer;
      }
      .mode-switch-btn:hover, .mode-switch-btn:active { filter: brightness(0.96); }
      .mode-switch-btn svg { flex-shrink: 0; }

      /* --- Panneau réglages (repliable via l'icône ⚙️, même principe que GeoRouter) --- */
      .settings-panel { padding: 4px 0 2px; margin-bottom: 10px; }
      .settings-panel[hidden] { display: none; }
      .settings-section-label { font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.02em; }
      .settings-section-label:first-child { margin-top: 2px; }

      .segmented { display: flex; gap: 3px; background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px; }
      .segmented-btn { flex: 1; border: none; background: transparent; color: var(--text); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; padding: 7px 6px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
      .segmented-btn.active { background: var(--accent); color: var(--on-accent); }

      .settings-advanced-toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding: 6px 2px; cursor: pointer; user-select: none; }
      .settings-advanced-toggle span { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }
      .settings-advanced-toggle svg { transition: transform 0.15s; color: var(--muted); flex-shrink: 0; }
      .settings-advanced-toggle.open svg { transform: rotate(180deg); }
      #advancedSettingsBody[hidden] { display: none; }

      .settings-tools-row { display: flex; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
      .settings-tools-row[hidden] { display: none; }
      .btn-tool-wide { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 38px; background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--btn-text); cursor: pointer; font-family: 'Inter', sans-serif; }
      .btn-tool-wide:hover, .btn-tool-wide:active { filter: brightness(0.96); }

      /* --- État initial (aucune trace chargée) --- */
      .empty-state { text-align: center; padding: 28px 10px 20px; }
      .empty-state-icon { width: 40px; height: 40px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; opacity: 0.55; }
      .empty-state-icon img { width: 100%; height: 100%; object-fit: contain; }
      .empty-state-title { font-size: 14px; color: var(--text); margin: 0; font-weight: 600; }
      .empty-state-sub { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
      .empty-state-actions { display: flex; gap: 8px; margin-top: 20px; }
      .btn-primary-wide { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 38px; background: var(--accent); color: var(--on-accent); border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
      
      .settings-section-label.with-actions { display: flex; align-items: baseline; justify-content: space-between; }
      .settings-section-count { font-weight: 400; text-transform: none; letter-spacing: normal; color: var(--muted); margin-left: 3px; }
      .op-select-links { display: flex; align-items: center; }
      .op-link-btn { background: none; border: none; padding: 0; font-size: 11px; font-weight: 600; color: var(--accent); cursor: pointer; text-transform: none; letter-spacing: normal; }
      .op-link-sep { font-size: 11px; color: var(--muted); margin: 0 5px; }
      .op-chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
      .op-chip-list[hidden] { display: none; }
      .op-chip { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
      .op-chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
      .op-chip-more { background: transparent; border-style: dashed; color: var(--muted); }

      .station-card { display: flex; flex-direction: column; border: 1px solid var(--line-strong); padding: 12px; cursor: pointer; background: var(--card-bg); border-radius: 12px; margin-bottom: 8px; }
      .station-main { display: flex; align-items: center; width: 100%; }
      .nav-block { width: 75px; min-width: 75px; border-right: 1px solid var(--border); margin-right: 12px; }
      .nav-block.nav-block-maneuver { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .maneuver-icon { width: 30px; height: 30px; margin: 0 auto 2px; display: flex; align-items: center; justify-content: center; }
      .maneuver-icon img { width: 100%; height: 100%; object-fit: contain; }
      .maneuver-icon .icon-dark-theme, .empty-state-icon .icon-dark-theme { display: none; }
      @media (prefers-color-scheme: dark) {
        .maneuver-icon .icon-light-theme, .empty-state-icon .icon-light-theme { display: none; }
        .maneuver-icon .icon-dark-theme, .empty-state-icon .icon-dark-theme { display: block; }
      }
      .pk-val { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
      .pk-val-wrap { display: flex; align-items: baseline; justify-content: center; gap: 2px; }
      .pk-unit { font-size: 10px; font-weight: 600; opacity: 0.6; }
      .detour-line { display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; opacity: 0.75; margin-top: 3px; white-space: nowrap; }
      .info-block { flex: 1; min-width: 0; }
      .op-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; word-break: break-word; color: var(--op-color); }
      .st-name { font-size: 13px; opacity: 0.9; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .st-commune { font-size: 11px; opacity: 0.75; font-weight: 600; margin-top: 1px; word-break: break-word; }
      
      .tech-block { width: auto; min-width: 55px; text-align: right; border-left: 1px solid var(--border); padding-left: 8px; flex-shrink: 0; }
      
      .dispo-ok { color: var(--dispo-ok); } .dispo-warn { color: var(--dispo-warn); } .dispo-alert { color: var(--dispo-alert); }

      /* --- Prochaine instruction de conduite : mise en avant + code couleur par urgence --- */
      .roadbook-next { border: 2px solid var(--line-strong); border-radius: 12px; padding: 18px 12px; margin-bottom: 10px; }
      .roadbook-next .maneuver-icon { width: 42px; height: 42px; }
      .roadbook-next .pk-val { font-size: 26px; }
      .roadbook-next .pk-unit { font-size: 12px; }
      .roadbook-next .op-title { font-size: 19px; }
      .roadbook-next.roadbook-far { border-color: var(--dispo-ok); background: var(--dispo-ok-bg); }
      .roadbook-next.roadbook-far .pk-val { color: var(--dispo-ok); }
      .roadbook-next.roadbook-mid { border-color: var(--dispo-warn); background: var(--dispo-warn-bg); }
      .roadbook-next.roadbook-mid .pk-val { color: var(--dispo-warn); }
      .roadbook-next.roadbook-near { border-color: var(--dispo-alert); background: var(--dispo-alert-bg); animation: roadbook-pulse 1.4s ease-in-out infinite; }
      .roadbook-next.roadbook-near .pk-val { color: var(--dispo-alert); }
      @keyframes roadbook-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.35); }
        50% { box-shadow: 0 0 0 7px rgba(220,38,38,0); }
      }
      .roadbook-later { opacity: 0.8; }
      .pdc-panel { display: none; margin-top: 10px; font-size: 12px; background: var(--pdc-bg); padding: 10px; border-radius: 10px; }
      .pdc-panel.show { display: block; }
      .pdc-table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
      .pdc-table td, .pdc-table th { padding: 4px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      
      .pdc-table th:nth-child(1), .pdc-table td:nth-child(1) { width: 28%; word-break: break-all; overflow-wrap: break-word; }
      .pdc-table th:nth-child(2), .pdc-table td:nth-child(2) { width: 28%; }
      .pdc-table th:nth-child(3), .pdc-table td:nth-child(3) { width: 22%; }
      .pdc-table th:nth-child(4), .pdc-table td:nth-child(4) { width: 22%; }
      
      
      .user-loc-icon { background: transparent !important; border: none !important; }
      .user-loc-arrow { width: 28px; height: 28px; transition: transform 0.3s ease-out; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4)); }
    </style>
</head>
<body>
  <div id="terminal-logs">
    <div class="log-panel-header">
      <span>Journal des opérations</span>
      <div style="display:flex; gap:6px;">
        <button class="log-panel-btn" onclick="copyLogs()" title="Copier">Copier</button>
        <button class="log-panel-btn" onclick="clearLogs()" title="Vider">Vider</button>
        <button class="log-panel-btn" onclick="toggleLogs()" title="Fermer">✕</button>
      </div>
    </div>
    <div id="log-content"></div>
  </div>

  <div id="map"></div>
  <div class="sheet-drag-buffer" id="sheetDragBuffer" aria-hidden="true"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle-zone" id="sheetHandle">
      <span class="sheet-handle" aria-hidden="true"></span>
    </div>

    <div class="sheet-pinned" id="sheetPinned">
      <div class="header-controls">
        <input type='number' id='kmInput' class='input-field' value="0" step="1" oninput='onKmInputChange()' max="9999">
        <button id="btnToggleMode" class="mode-switch-btn" onclick="toggleViewMode()" title="Passer à la feuille de route">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
          <span id="btnToggleModeLabel">Stations</span>
        </button>

        <input type="file" id="gpxInput" accept=".gpx,.json,.geojson" style="display:none;" onchange="handleTraceUpload(event)">

        <div class="header-trailing-group" style="margin-left:auto;">
          <button id="settingsToggleBtn" class="refresh-btn" onclick="toggleSettingsPanel(event)" title="Réglages">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <a class="refresh-btn" href="./index.html" title="Retour à l'accueil" style="text-decoration:none;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
          </a>
          <button class='refresh-btn' onclick="fetchLiveQualicharge()" title="Rafraîchir Live">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-5h5"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="sheet-body" id="sheetBody">

      <!-- Réglages : repliés par défaut, ouverts via l'icône ⚙️ du bandeau -->
      <div class="settings-panel" id="settingsPanel" hidden>

        <div class="settings-section-label with-actions" id="operatorSettingsBlock">
          <span>Opérateurs<span id="opCountLabel" class="settings-section-count"></span></span>
          <span class="op-select-links">
            <button type="button" class="op-link-btn" onclick="toggleSelectAllOps(true)">Tout</button><span class="op-link-sep">·</span><button type="button" class="op-link-btn" onclick="toggleSelectAllOps(false)">Aucun</button>
          </span>
        </div>
        <div id="operatorSelectContainer">
          <div id="operatorChipsList" class="op-chip-list"></div>
          <div id="operatorChipsListSecondary" class="op-chip-list" style="margin-top:6px;" hidden></div>
        </div>

        <div class="settings-section-label">Puissance mini</div>
        <div class="segmented" id="powerSegmented">
          <button type="button" class="segmented-btn" data-power="50" onclick="setPowerMin(50)">50 kW</button>
          <button type="button" class="segmented-btn active" data-power="150" onclick="setPowerMin(150)">150 kW</button>
          <button type="button" class="segmented-btn" data-power="350" onclick="setPowerMin(350)">350 kW</button>
        </div>

        <div class="settings-section-label">Rayon de recherche</div>
        <div class="segmented" id="radiusSegmented">
          <button type="button" class="segmented-btn" data-radius="1" onclick="setRadius(1)">1 km</button>
          <button type="button" class="segmented-btn active" data-radius="3" onclick="setRadius(3)">3 km</button>
          <button type="button" class="segmented-btn" data-radius="5" onclick="setRadius(5)">5 km</button>
          <button type="button" class="segmented-btn" data-radius="10" onclick="setRadius(10)">10 km</button>
        </div>

        <div class="settings-advanced-toggle" id="advancedToggleRow" onclick="toggleAdvancedSettings()">
          <span>Avancé</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div id="advancedSettingsBody" hidden>
          <div class="settings-section-label">Distance mini avant 1ère borne</div>
          <div class="segmented" id="kmMinSegmented">
            <button type="button" class="segmented-btn" data-kmmin="0" onclick="setKmMinDepart(0)">0 km</button>
            <button type="button" class="segmented-btn active" data-kmmin="5" onclick="setKmMinDepart(5)">5 km</button>
            <button type="button" class="segmented-btn" data-kmmin="10" onclick="setKmMinDepart(10)">10 km</button>
          </div>

<script>
/* ===================== BOTTOM SHEET (basse / milieu / haute) ===================== */
const sheet = document.getElementById('sheet');
const mapEl = document.getElementById('map');
const sheetHandleZone = document.getElementById('sheetHandle');
const sheetDragBuffer = document.getElementById('sheetDragBuffer');
const sheetPinned = document.getElementById('sheetPinned');
let sheetState = 'mid';
let mapReady = false; // la carte Leaflet n'existe pas encore à ce stade du script

// "basse" = exactement la hauteur du contenu épinglé (poignée + entêtes de contrôle).
function pinnedContentHeight() {
  const firstCard = document.querySelector('#stationsContainer > *:first-child');
  const firstCardHeight = firstCard ? firstCard.offsetHeight : 0;
  return sheetHandleZone.offsetHeight + sheetPinned.offsetHeight + firstCardHeight + 6;
}

function sheetHeightsPx() {
  const vh = window.innerHeight;
  return {
    low: pinnedContentHeight(),
    mid: Math.round(vh * 0.52),
    high: Math.max(vh - 4, 0) // la carte (ou les logs) est quasi entièrement masquée
  };
}

// Le sheet ET la zone haute (carte OU logs, selon le mode actif) se complètent
// toujours exactement : quand le sheet grandit, l'autre rétrécit d'autant.
function applySheetHeight(px) {
  const vh = window.innerHeight;
  const topHeight = Math.max(vh - px, 0);
  sheet.style.height = px + 'px';
  mapEl.style.height = topHeight + 'px';
  sheetDragBuffer.style.bottom = px + 'px';
  if (mapReady) map.invalidateSize({ pan: false });
}

function setSheetState(state) {
  sheetState = state;
  applySheetHeight(sheetHeightsPx()[state]);
  sheet.dataset.state = state;
}

let sheetDrag = null;
let ignoreNextListClick = false;
document.getElementById('stationsContainer').addEventListener('click', (e) => {
  if (ignoreNextListClick) {
    ignoreNextListClick = false;
    e.stopPropagation();
    e.preventDefault();
  }
}, true); // capture : intercepte avant les onclick des cartes

function startSheetDrag(e) {
  e.preventDefault();
  ignoreNextListClick = true;
  setTimeout(() => { ignoreNextListClick = false; }, 400); // sécurité si aucun clic ne suit
  sheetDrag = { startY: e.clientY, startHeight: sheet.getBoundingClientRect().height, moved: 0 };
  sheet.classList.add('dragging');
  e.currentTarget.setPointerCapture(e.pointerId);
}
sheetHandleZone.addEventListener('pointerdown', startSheetDrag);
sheetDragBuffer.addEventListener('pointerdown', startSheetDrag);

document.addEventListener('pointermove', (e) => {
  if (!sheetDrag) return;
  const dy = e.clientY - sheetDrag.startY;
  sheetDrag.moved = Math.max(sheetDrag.moved, Math.abs(dy));
  const h = sheetHeightsPx();
  const newHeight = Math.min(Math.max(sheetDrag.startHeight - dy, h.low), h.high);
  applySheetHeight(newHeight);
});

document.addEventListener('pointerup', () => {
  if (!sheetDrag) return;
  sheet.classList.remove('dragging');
  if (sheetDrag.moved < 6) {
    // Tap sur la poignée : fait défiler basse -> milieu -> haute -> basse
    const order = ['low', 'mid', 'high'];
    setSheetState(order[(order.indexOf(sheetState) + 1) % order.length]);
  } else {
    const currentHeight = sheet.getBoundingClientRect().height;
    const h = sheetHeightsPx();
    const nearest = Object.entries(h).sort((a, b) => Math.abs(a[1] - currentHeight) - Math.abs(b[1] - currentHeight))[0][0];
    setSheetState(nearest);
  }
  sheetDrag = null;
});

window.addEventListener('resize', () => setSheetState(sheetState));

   localStorage (même mécanique que GeoRouter : sauvegarderReglages/restaurerReglages,
   appelées à chaque changement / une fois au démarrage). --- */

function sauvegarderReglages() {

        rayon: RAYON_RECHERCHE_KM,

    try {
        localStorage.setItem(REGLAGES_KEY, JSON.stringify(reglages));
    } catch (err) {
        log("RÉGLAGES", "Échec de sauvegarde : " + err.message, true);

}

function restaurerReglages() {
    let reglages;
    try {
        reglages = JSON.parse(localStorage.getItem(REGLAGES_KEY) || '{}');
    } catch (err) {
        return;
    }
    // Vérifs de type (pas de simple `if (valeur)`) : 0 est une valeur valide pour
    // kmMinDepart et pdcTotalMin ("Tous"), un test de vérité les ignorerait à tort.
    if (typeof reglages.puissanceMin === 'number') setPowerMin(reglages.puissanceMin);
    if (typeof reglages.rayon === 'number') setRadius(reglages.rayon);
    if (typeof reglages.kmMinDepart === 'number') setKmMinDepart(reglages.kmMinDepart);

function decodeValhallaPolyline(str, precision = 6) {
    let index = 0, lat = 0, lng = 0, coordinates = [];
    const factor = Math.pow(10, precision);

    while (index < str.length) {
        let byte = null, shift = 0, result = 0;
        do {
            byte = str.charCodeAt(index++) - 63;
            result |= (byte & 0x1f) << shift;
            shift += 5;
        } while (byte >= 0x20);
        let deltaLat = ((result & 1) ? ~(result >> 1) : (result >> 1));
        lat += deltaLat;

        shift = 0; result = 0;
        do {
            byte = str.charCodeAt(index++) - 63;
            result |= (byte & 0x1f) << shift;
            shift += 5;
        } while (byte >= 0x20);
        let deltaLng = ((result & 1) ? ~(result >> 1) : (result >> 1));
        lng += deltaLng;

        coordinates.push([lat / factor, lng / factor]);
    }
    return coordinates;
}

const DB_NAME = 'IRVEDatabase';
const DB_VERSION = 2;
const STORE_STATIONS = 'stations';
const STORE_COMMUNES = 'communes';
const MAX_AGE_DAYS = 7;

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_STATIONS)) {
        db.createObjectStore(STORE_STATIONS);
      }
      if (!db.objectStoreNames.contains(STORE_COMMUNES)) {
        db.createObjectStore(STORE_COMMUNES);
      }
    };
    request.onsuccess = (e) => resolve(e.target.result);
    request.onerror = (e) => reject(e.target.error);
  });
}

async function loadOrFetchCommunesDB() {
    try {
        const db = await openDB();
        const tx = db.transaction(STORE_COMMUNES, 'readonly');
        const count = await new Promise(r => {
            const req = tx.objectStore(STORE_COMMUNES).count();
            req.onsuccess = () => r(req.result);
        });

        if (count > 0) {
            log("COMMUNES", `Base de communes locale trouvée (${count} communes).`);
            return;
        }

        if (!navigator.onLine) {
            log("COMMUNES", "🌐 Hors-ligne : Impossible d'initialiser la base communes.", true);
            return;
        }

        log("COMMUNES", "Téléchargement de la base officielle des communes (JSON)...");
        
        const response = await fetch("https://geo.api.gouv.fr/communes?fields=code,nom");
        if (!response.ok) throw new Error(`HTTP error ${response.status}`);
        
        const communes = await response.json();
        log("COMMUNES", `Analyse et stockage de ${communes.length} communes...`);

        const writeTx = db.transaction(STORE_COMMUNES, 'readwrite');
        const store = writeTx.objectStore(STORE_COMMUNES);

        communes.forEach(item => {
            if (item.code && item.nom) {
                store.put(item.nom, item.code);
            }
        });

        writeTx.oncomplete = () => {
            log("COMMUNES", "💾 Base officielle des communes enregistrée dans IndexedDB !");
        };

    } catch (e) {
        log("COMMUNES", "Erreur initialisation communes : " + e.message, true);
    }
}

async function getCommunesMap(codesInseeSet) {
    const communesMap = new Map();
    if (codesInseeSet.size === 0) return communesMap;

    try {
        const db = await openDB();
        const tx = db.transaction(STORE_COMMUNES, 'readonly');
        const store = tx.objectStore(STORE_COMMUNES);

        await new Promise((resolve) => {
            let pending = codesInseeSet.size;

            codesInseeSet.forEach(code => {
                if (!code) {
                    if (--pending === 0) resolve();
                    return;
                }
                const req = store.get(code);
                req.onsuccess = () => {
                    if (req.result) communesMap.set(code, req.result);
                    if (--pending === 0) resolve();
                };
                req.onerror = () => {
                    if (--pending === 0) resolve();
                };
            });
        });
    } catch (e) {
        log("COMMUNES", "Erreur lecture des communes : " + e.message, true);
    }
    return communesMap;
}

async function saveStaticDataToDB(data) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_STATIONS, 'readwrite');
    const store = tx.objectStore(STORE_STATIONS);
    store.put(data, 'cached_raw_data');
    store.put(Date.now(), 'last_update_timestamp');
    log("INDEXEDDB", "💾 Base IRVE statique sauvegardée localement.");
  } catch (err) {
    log("INDEXEDDB", "Erreur de sauvegarde stations : " + err.message, true);
  }
}

async function getCachedStaticData() {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_STATIONS, 'readonly');
    const store = tx.objectStore(STORE_STATIONS);
    
    const data = await new Promise(r => {
      const req = store.get('cached_raw_data');
      req.onsuccess = () => r(req.result);
    });
    
    const timestamp = await new Promise(r => {
      const req = store.get('last_update_timestamp');
      req.onsuccess = () => r(req.result);
    });

    if (!data || !timestamp) return null;

    const ageInDays = (Date.now() - timestamp) / (1000 * 60 * 60 * 24);
    return { data, isOutdated: ageInDays > MAX_AGE_DAYS };
  } catch (err) {
    log("INDEXEDDB", "Erreur de lecture : " + err.message, true);
    return null;
  }
}

const logEntries = [];
function log(tag, message, isError=false) {
    const time = new Date().toLocaleTimeString('fr-FR', { hour12: false });
    logEntries.push({ time, tag, message, isError: !!isError });
    if (isError) console.error(`[${tag}]`, message); else console.log(`[${tag}]`, message);

    const term = document.getElementById('terminal-logs');
    const content = document.getElementById('log-content');
    if (content) {
        const line = document.createElement('div');
        line.className = 'log-line' + (isError ? ' log-err' : '');
        line.innerHTML = `<span class="log-time">${time}</span> <span class="log-cat">[${tag}]</span> ${String(message).replace(/</g, '&lt;')}`;
        content.appendChild(line);
        term.scrollTop = term.scrollHeight;
    }
}

function toggleLogs() {
    document.getElementById('terminal-logs').classList.toggle('show');
}

function clearLogs() {
    logEntries.length = 0;

}

function copyLogs() {
    const text = logEntries.map(e => `${e.time} [${e.tag}] ${e.message}`).join('\n');
    navigator.clipboard.writeText(text).then(() => log('LOG', 'Journal copié dans le presse-papier.'));
}

            b4.title = "Simuler le trajet sur la trace";
            b4.onclick = (e) => { e.stopPropagation(); toggleSimulation(); };

            let b5 = L.DomUtil.create('a', 'brouter-ctrl-btn', container);
            b5.id = 'simSpeedBtn';
            b5.textContent = simSpeedMultiplier + '×';
            b5.title = "Vitesse de simulation (appui pour changer)";
            b5.style.display = 'none';
            b5.style.fontWeight = '700';
            b5.style.fontSize = '12px';
            b5.onclick = (e) => { e.stopPropagation(); cycleSimSpeed(); };

            return container;
        }
    });
    map.addControl(new CustomActionControls());

    log("INIT", "Carte Leaflet initialisée.");
    loadOrFetchCommunesDB();
}


function handleButton1Click() {
    if (isAutoTrack || isSimulating) {
        navDisplayMode = 'OVERVIEW';
        log("MAP", "Mode Vue d'Ensemble activé.");
        applyNavBounds(lastValidLat, lastValidLng);
    } else {
        fitTraceBounds();
    }
}

function handleButton2Click() {
    if (isAutoTrack || isSimulating) {
        navDisplayMode = 'CLOSE';
        log("MAP", "Retour au Mode Suivi Rapproché.");
        if (lastValidLat !== null && lastValidLng !== null) {
            map.setView([lastValidLat, lastValidLng], NAV_CLOSE_ZOOM);
        } else {
            getSinglePosition();
        }
    } else {
        getSinglePosition();
    }
}

// Marge de recadrage : évite que la trace ne passe sous les boutons de contrôle Leaflet
// (empilés en haut à gauche : zoom + boutons custom, et la barre d'échelle en bas à gauche)
const FIT_BOUNDS_OPTIONS = {
    paddingTopLeft: [45, 60],
    paddingBottomRight: [20, 30]
};

function fitTraceBounds() {
    if (gpxLineFuture) {
        let bounds = gpxLineFuture.getBounds();
        if (gpxLinePast && gpxLinePast.getLatLngs().length > 0) {
            bounds.extend(gpxLinePast.getBounds());
        }
        map.fitBounds(bounds, FIT_BOUNDS_OPTIONS);
        log("MAP", "Recadrage sur la trace.");
    } else {
        map.fitBounds(franceBounds, { padding: [10, 10] });
        log("MAP", "Carte vide : Recadrage sur la France.");
    }
}

function applyNavBounds(lat, lng) {
    if (gpxLineFuture && gpxLineFuture.getLatLngs().length > 0) {
        map.fitBounds(gpxLineFuture.getBounds(), { 
            ...FIT_BOUNDS_OPTIONS,
            maxZoom: NAV_MAX_OVERVIEW_ZOOM 
        });
    } else if (lat !== null && lng !== null) {
        map.panTo([lat, lng]);
    }
}

function getSinglePosition() {
    if(!navigator.geolocation) {
        log("GPS", "Géolocalisation non supportée.", true);
        return;
    }
    log("GPS", "Acquisition d'une position GPS ponctuelle...");
    navigator.geolocation.getCurrentPosition(
        pos => {
            updatePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.heading, pos.coords.speed);
            map.setView([pos.coords.latitude, pos.coords.longitude], NAV_CLOSE_ZOOM);
            log("GPS", "Position ponctuelle acquise avec succès.");
        },
        err => log("GPS", "Erreur acquisition : " + err.message, true),
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function toggleAutoTrack() {
    if(isSimulating) toggleSimulation();
    isAutoTrack = !isAutoTrack;
    const btn = document.getElementById('autoTrackBtn');
    if (isAutoTrack) {
        btn.classList.add('active-track');
        navDisplayMode = 'CLOSE';
        
        if (lastValidLat !== null && lastValidLng !== null) {
            map.setView([lastValidLat, lastValidLng], NAV_CLOSE_ZOOM);
        }

        requestWakeLock();
        if(navigator.geolocation) {
            watchId = navigator.geolocation.watchPosition(
                pos => updatePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.heading, pos.coords.speed),
                err => log("GPS", "Erreur : " + err.message, true),
                { enableHighAccuracy: true, maximumAge: 0 }
            );
            log("GPS", "Suivi live activé.");
        }
    } else {
        btn.classList.remove('active-track');
        releaseWakeLock();
        if(watchId) navigator.geolocation.clearWatch(watchId);
        lastValidLat = null; lastValidLng = null;
        log("GPS", "Suivi live désactivé.");
    }
}

// Multiplicateur de vitesse de simulation : appliqué à la distance parcourue par tick
// (le tick lui-même reste fixe) pour garder une cadence de rendu stable quel que soit le multiplicateur.
let simSpeedMultiplier = 1;
const SIM_SPEED_LEVELS = [1, 2, 3, 5];

function cycleSimSpeed() {
    const idx = SIM_SPEED_LEVELS.indexOf(simSpeedMultiplier);
    simSpeedMultiplier = SIM_SPEED_LEVELS[(idx + 1) % SIM_SPEED_LEVELS.length];
    const btn = document.getElementById('simSpeedBtn');
    if (btn) btn.textContent = simSpeedMultiplier + '×';
}

function toggleSimulation() {
    if(isAutoTrack) toggleAutoTrack();
    isSimulating = !isSimulating;
    const btn = document.getElementById('simTrackBtn');
    const speedBtn = document.getElementById('simSpeedBtn');
    
    if(isSimulating) {
        if(gpxPoints.length === 0) {
            log("SIM", "Impossible de simuler : aucun fichier de trace chargé.", true);
            isSimulating = false;
            return;
        }
        btn.classList.add('active-track');
        if (speedBtn) { speedBtn.style.display = ''; speedBtn.textContent = simSpeedMultiplier + '×'; }
        navDisplayMode = 'CLOSE';

        if (gpxPoints.length > 0) {
            map.setView([gpxPoints[0].lat, gpxPoints[0].lon], NAV_CLOSE_ZOOM);
        }

        requestWakeLock();
        log("SIM", "Démarrage de la simulation de trajet...");
        const SIM_SPEED_KMH = 110; // vitesse de référence pour le multiplicateur 1×
        const TICK_MS = 300;
        const kmPerTickBase = (SIM_SPEED_KMH / 3600) * (TICK_MS / 1000);
        const traceEndKm = gpxPoints[gpxPoints.length - 1].km;
        let simKm = 0, cursor = 0;
        simInterval = setInterval(() => {
            simKm += kmPerTickBase * simSpeedMultiplier; // relit le multiplicateur à chaque tick : effet immédiat sans relancer le timer
            if (simKm >= traceEndKm) {
                toggleSimulation();
                log("SIM", "Simulation terminée (fin du tracé).");
                return;
            }
            while (cursor < gpxPoints.length - 1 && gpxPoints[cursor].km < simKm) cursor++;
            let pt = gpxPoints[cursor];
            // Cap dérivé automatiquement de la géométrie du tracé par updatePosition (on est toujours dessus en simulation)
            updatePosition(pt.lat, pt.lon, null, null);
        }, TICK_MS);
    } else {
        btn.classList.remove('active-track');
        if (speedBtn) speedBtn.style.display = 'none';
        releaseWakeLock();
        if(simInterval) clearInterval(simInterval);
        log("SIM", "Simulation arrêtée.");
    }
}

function updateTraceDisplay(currentKm) {
    if(gpxPoints.length === 0) return;

    let pastPoints = [];
    let futurePoints = [];

    for(let pt of gpxPoints) {
        if(pt.km <= currentKm) {
            pastPoints.push([pt.lat, pt.lon]);
        } else {
            if(futurePoints.length === 0 && pastPoints.length > 0) {
                futurePoints.push(pastPoints[pastPoints.length - 1]);
            }
            futurePoints.push([pt.lat, pt.lon]);
        }
    }

    if(gpxLinePast) gpxLinePast.setLatLngs(pastPoints);
    if(gpxLineFuture) gpxLineFuture.setLatLngs(futurePoints);
}

// Delta angulaire signé le plus court entre deux caps (évite qu'une transition CSS
// tourne "dans le mauvais sens" en passant par 0°/360°, ex. 350° -> 10°).
function shortestAngleDelta(fromDeg, toDeg) {
    let diff = (toDeg - fromDeg) % 360;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    return diff;
}

// Applique une nouvelle orientation à la flèche en tournant toujours du côté le plus
// court (rotation cumulative, peut dépasser 0-360) ; la transition CSS fait le reste.
function setArrowRotation(headingDeg) {
    const target = ((headingDeg % 360) + 360) % 360;
    const current = ((currentArrowRotation % 360) + 360) % 360;
    currentArrowRotation += shortestAngleDelta(current, target);
    const arrow = userMarker && userMarker.getElement() ? userMarker.getElement().querySelector('.user-loc-arrow') : null;
    if (arrow) arrow.style.transform = `rotate(${currentArrowRotation}deg)`;
}

// Cap local déduit de la géométrie du tracé autour de l'index donné (moyenne sur une
// petite fenêtre avant/après) : bien plus stable qu'un cap GPS instantané, puisqu'il
// repose sur une géométrie fixe plutôt que sur des positions bruitées.
function getRouteHeadingAt(index) {
    if (gpxPoints.length < 2) return null;
    const aheadIdx = Math.min(index + 5, gpxPoints.length - 1);
    const behindIdx = Math.max(index - 5, 0);
    if (aheadIdx === behindIdx) return null;
    const p1 = gpxPoints[behindIdx], p2 = gpxPoints[aheadIdx];
    return Math.atan2(p2.lon - p1.lon, p2.lat - p1.lat) * (180 / Math.PI);
}

const ON_TRACK_KM = 0.05;           // 50 m : distance sous laquelle on considère être "sur" le tracé
const MIN_SPEED_FOR_GPS_HEADING = 1; // m/s : sous ce seuil, le cap GPS brut n'est pas fiable -> on ne le suit pas

function updatePosition(lat, lng, heading, speedMps) {
    if (!isSimulating && lastValidLat !== null && lastValidLng !== null) {
        let distanceMetres = distanceHaversine(lastValidLat, lastValidLng, lat, lng) * 1000;
        if (distanceMetres < 10) return;
    }
    
    lastValidLat = lat;
    lastValidLng = lng;

    if (isAutoTrack || isSimulating) {
        if (navDisplayMode === 'OVERVIEW') {
            applyNavBounds(lat, lng);
        } else {
            map.panTo([lat, lng], {animate: true, duration: 0.8});
        }
    } else {
        map.panTo([lat, lng], {animate: true, duration: 0.8});
    }

    // Point le plus proche sur le tracé : calculé une seule fois, réutilisé pour le cap et le km affiché.
    let bestIdx = -1, minDist = Infinity, bestKm = 0;
    if (gpxPoints.length > 0) {
        for (let i = 0; i < gpxPoints.length; i++) {
            const d = distanceHaversine(lat, lng, gpxPoints[i].lat, gpxPoints[i].lon);
            if (d < minDist) { minDist = d; bestKm = gpxPoints[i].km; bestIdx = i; }
        }
    }

    // Cap : géométrie du tracé si on est dessus (stable), sinon cap GPS brut si la vitesse
    // le rend fiable ; sinon on ne touche pas à la flèche (on garde le dernier cap connu).
    let newHeading = (bestIdx !== -1 && minDist <= ON_TRACK_KM) ? getRouteHeadingAt(bestIdx) : null;
    if (newHeading === null && heading !== null && heading !== undefined && !isNaN(heading)) {
        if (speedMps === null || speedMps === undefined || speedMps >= MIN_SPEED_FOR_GPS_HEADING) {
            newHeading = heading;
        }
    }

    if (userMarker) {
        userMarker.setLatLng([lat, lng]);
    } else {
        const svg = `<div style="width:32px;height:32px;"><svg class="user-loc-arrow" viewBox="0 0 24 24"><path fill="#0B72E7" stroke="#ffffff" stroke-width="2" d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg></div>`;
        userMarker = L.marker([lat, lng], {icon: L.divIcon({html: svg, iconSize:[32,32], iconAnchor:[16,16], className: 'user-loc-icon'})}).addTo(map);
    }
    if (newHeading !== null) setArrowRotation(newHeading);

    if (bestIdx !== -1) {
        document.getElementById('kmInput').value = Math.round(bestKm);
        updateTraceDisplay(bestKm);
        renderList(bestKm); // position précise (non arrondie) pour les tuiles, indépendamment de l'affichage du champ km
    }
}

function onKmInputChange() {
    const kmVal = parseFloat(document.getElementById('kmInput').value) || 0;
    updateTraceDisplay(kmVal);
    renderList();
}

function distanceHaversine(lat1, lon1, lat2, lon2) {
    const R = 6371.0, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function handleTraceUpload(event) {
    const file = event.target ? event.target.files[0] : event.file;
    if(!file) return;
    
    isInitialGPXLoad = true;
    log("TRACE", `Fichier '${file.name}' reçu. Analyse en cours...`);
    const reader = new FileReader();
    
    reader.onload = (e) => {
        processTraceContent(e.target.result, file.name);
    };
    
    reader.readAsText(file);
}

// Traitement centralisé d'un contenu de trace (texte brut), quelle que soit sa source :
// upload fichier local, partage Android, ou transmission depuis GeoRouter via localStorage.
function processTraceContent(content, filename) {
    gpxPoints = [];
    roadbookManeuvers = [];

    if (filename.endsWith('.json') || filename.endsWith('.geojson') || content.trim().startsWith('{')) {
        parseJSONTrace(content);
    } else {
        parseGPXTrace(content);
    }

    if (gpxPoints.length === 0) {
        log("TRACE", "Échec de lecture : Aucun point de tracé valide trouvé.", true);
        return;
    }

    const maxKm = gpxPoints[gpxPoints.length - 1].km;
    log("TRACE", `${gpxPoints.length} points extraits. Distance totale : ${maxKm.toFixed(1)} km.`);
    if(roadbookManeuvers.length > 0) {
        log("ROADBOOK", `${roadbookManeuvers.length} instructions de guidage extraites !`);
    }

    // Une trace est chargée : Importer/Logs quittent l'état d'accueil et rejoignent
    // la section "Outils" du panneau réglages (usage occasionnel une fois le trajet en cours).
    document.getElementById('settingsToolsRow').hidden = false;

    if(gpxLineFuture) map.removeLayer(gpxLineFuture);
    if(gpxLinePast) map.removeLayer(gpxLinePast);

    const allCoords = gpxPoints.map(p => [p.lat, p.lon]);

    gpxLineFuture = L.polyline(allCoords, {color: '#0B72E7', weight: 4, opacity: 1.0}).addTo(map);
    gpxLinePast = L.polyline([], {color: '#16a34a', weight: 4, opacity: 0.5}).addTo(map);

    // Décalé d'un tick : au chargement initial (transmission GeoRouter via
    // localStorage notamment), le conteneur de la carte n'a pas encore fini
    // son layout au moment où ce code s'exécute (même souci que le cadrage
    // France au démarrage). L'upload manuel fonctionnait déjà car il survient
    // toujours après que la page se soit stabilisée.
    requestAnimationFrame(() => {
        map.invalidateSize();
        map.fitBounds(gpxLineFuture.getBounds(), FIT_BOUNDS_OPTIONS);
    });

    fetchAndFilterStations();
}

// --- RÉCEPTION DES DONNÉES EN PROVENANCE DU HUB / GEOROUTER (via localStorage) ---
const HANDOFF_KEY = 'current_route_data';

function checkIncomingRouteData() {
    try {
        const raw = localStorage.getItem(HANDOFF_KEY);
        if (!raw) return false;

        localStorage.removeItem(HANDOFF_KEY);
        const payload = JSON.parse(raw);
        if (!payload || !payload.content) return false;

        const originLabel = payload.source === 'georouter' ? 'GeoRouter' : 'Portail';
        log("HANDOFF", `📥 Itinéraire reçu depuis ${originLabel}. Chargement automatique...`);
        isInitialGPXLoad = true;
        processTraceContent(payload.content, payload.filename || 'itineraire.json');
        return true;
    } catch (err) {
        log("HANDOFF", "Erreur lors de la réception des données transmises : " + err.message, true);
        return false;
    }
}

// Vérification de la présence d'un fichier reçu par la Web Share Target API
async function checkSharedFile() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('shared') === 'true') {
        log("SHARE", "Fichier détecté via le menu Partager d'Android.");
        try {
            const cache = await caches.open('incoming-shared-files');
            const response = await cache.match('/shared-trace-file');
            if (response) {
                const blob = await response.blob();
                const rawFileName = response.headers.get('x-file-name');
                const fileName = rawFileName ? decodeURIComponent(rawFileName) : 'trace.gpx';
                
                const file = new File([blob], fileName, { type: blob.type });
                log("SHARE", `Chargement automatique du fichier partagé : ${fileName}`);
                
                // Traitement du fichier transmis
                handleTraceUpload({ file: file });

                // Nettoyage du cache temporaire
                await cache.delete('/shared-trace-file');
                
                // Nettoyage de l'URL (?shared=true) sans recharger la page
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        } catch (err) {
            log("SHARE", "Erreur lors de la récupération du fichier partagé : " + err.message, true);
        }
    }
}

function parseGPXTrace(xmlString) {
    log("GPX", "Analyse au format GPX/XML...");
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlString, "text/xml");
    const trkpts = xml.getElementsByTagName("trkpt");
    let km = 0, prev = null;
    
    for(let i=0; i<trkpts.length; i++) {
        let lat = parseFloat(trkpts[i].getAttribute("lat"));
        let lon = parseFloat(trkpts[i].getAttribute("lon"));
        if(prev) km += distanceHaversine(prev.lat, prev.lon, lat, lon);
        gpxPoints.push({lat, lon, km});
        prev = {lat, lon};
    }
}

function parseJSONTrace(jsonString) {
    log("VALHALLA", "Analyse au format JSON/GeoJSON...");
    try {
        const data = JSON.parse(jsonString);
        let coords = [];

        if (data.trip && data.trip.legs) {
            data.trip.legs.forEach(leg => {
                const decoded = leg.shape ? decodeValhallaPolyline(leg.shape, 6) : [];
                const baseIndex = coords.length;
                coords = coords.concat(decoded);

                if (leg.maneuvers && Array.isArray(leg.maneuvers)) {
                    leg.maneuvers.forEach(m => {
                        const ptIndex = baseIndex + (m.begin_shape_index || 0);
                        roadbookManeuvers.push({
                            instruction: m.instruction || "Continuer",
                            street: (m.street_names || []).join(', '),
                            length: m.length || 0,
                            type: typeof m.type === 'number' ? m.type : null,
                            shapeIndex: ptIndex,
                            km: 0
                        });
                    });
                }
            });
        } 
        else if (data.features && data.features[0] && data.features[0].geometry) {
            const geom = data.features[0].geometry;
            if (geom.type === "LineString") {
                coords = geom.coordinates.map(c => [c[1], c[0]]);
            }
        }

        let km = 0, prev = null;
        coords.forEach(pt => {
            let lat = pt[0], lon = pt[1];
            if (prev) km += distanceHaversine(prev.lat, prev.lon, lat, lon);
            gpxPoints.push({ lat, lon, km });
            prev = { lat, lon };
        });

        roadbookManeuvers.forEach(m => {
            if (m.shapeIndex < gpxPoints.length) {
                const pt = gpxPoints[m.shapeIndex];
                m.km = pt.km;
                m.lat = pt.lat;
                m.lon = pt.lon;
            }
        });

    } catch (e) {
        log("VALHALLA", "Erreur lors du décodage du JSON : " + e.message, true);
    }
}

async function fetchAndFilterStations() {
    log("ÉTAPE 1", "Recherche de la base IRVE en local (IndexedDB)...");
    const cached = await getCachedStaticData();
    let hasLoadedData = false;

    if (cached) {
        log("INDEXEDDB", "⚡ Base locale trouvée ! Traitement immédiat.");
        await processStaticData(cached.data);
        hasLoadedData = true;

        if (!cached.isOutdated || !navigator.onLine) {
            if (!navigator.onLine) log("RÉSEAU", "🌐 Mode Hors-ligne : Utilisation exclusive des données locales.");
            return;
        }
        log("RÉSEAU", "🔄 Base locale > 7 jours. Mise à jour en arrière-plan...");
    }

    if (navigator.onLine) {
        log("RÉSEAU", "Recherche du fichier IRVE statique sur data.gouv.fr...");
        fetch("https://www.data.gouv.fr/api/1/datasets/infrastructures-de-recharge-pour-vehicules-electriques-donnees-ouvertes/")
        .then(res => res.json())
        .then(data => {
            const url = data.resources.find(r => r.title.toLowerCase().includes('statique')).latest;
            log("STATIQUE", `Fichier trouvé. Téléchargement et analyse CSV en cours...`);
            
            Papa.parse(url, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: async function(results) {
                    log("STATIQUE", `${results.data.length} bornes brutes téléchargées. Sauvegarde locale...`);
                    
                    const cleanRows = results.data.map(row => ({
                        puissance_nominale: row.puissance_nominale || row.puissance_max_kw,
                        coordonneesXY: row.coordonneesXY || row.xy_coords || row.coordonnees,
                        nom_amenageur: row.nom_amenageur,
                        nom_station: row.nom_station,
                        code_insee_commune: row.code_insee_commune || row.code_insee || "",
                        id_station_itinerance: row.id_station_itinerance,
                        id_pdc_itinerance: row.id_pdc_itinerance
                    }));

                    await saveStaticDataToDB(cleanRows);
                    
                    if (!hasLoadedData) {
                        await processStaticData(cleanRows);
                    }
                }
            });
        }).catch(e => log("RÉSEAU", "Erreur réseau: " + e.message, true));
    } else if (!hasLoadedData) {
        log("RÉSEAU", "Vous êtes hors-ligne et aucune base n'a encore été enregistrée.", true);
    }
}

async function processStaticData(rawData) {
    lastRawStationRows = rawData;
    let stationsMap = new Map();
    let codesInseeSet = new Set();

    rawData.forEach(row => {
        let pwr = parseFloat(row.puissance_nominale || 0);
        if (pwr < PUISSANCE_MIN_KW) return;
        
        let coordsStr = row.coordonneesXY;
        if(!coordsStr) return;
        let c = coordsStr.replace('[','').replace(']','').split(',');
        let lon = parseFloat(c[0]), lat = parseFloat(c[1]);
        if(isNaN(lat) || isNaN(lon)) return;
        
        let opName = row.nom_amenageur || "IRVE";
        let stId = row.id_station_itinerance || row.nom_station;
        let codeInsee = row.code_insee_commune || "";
        
        if (codeInsee) codesInseeSet.add(codeInsee);

        if(!stationsMap.has(stId)) {
            stationsMap.set(stId, {
                id: stId, 
                nom: row.nom_station, 
                code_insee: codeInsee,
                commune: codeInsee ? `INSEE: ${codeInsee}` : "Commune inconnue",
                op: opName,
                lat: lat, lng: lon, pwr: pwr, pdcs: []
            });
        }
        let st = stationsMap.get(stId);
        if(pwr > st.pwr) st.pwr = pwr;
        st.pdcs.push(row.id_pdc_itinerance);
    });

    log("COMMUNES", `Résolution locale des noms de villes pour ${codesInseeSet.size} codes INSEE...`);
    const communesLookup = await getCommunesMap(codesInseeSet);
    
    stationsMap.forEach(st => {
        if (st.code_insee && communesLookup.has(st.code_insee)) {
            st.commune = communesLookup.get(st.code_insee);
        }
    });

    log("TRAITEMENT", `${stationsMap.size} stations rapides identifiées. Projection sur le tracé...`);
    
    let sampled = gpxPoints.filter((_, i) => i % 3 === 0);
    globalData = [];
    let activeOperators = new Set();
    
    stationsMap.forEach(st => {
        let minDist = Infinity, bestKm = 0;
        for(let pt of sampled) {
            let d = distanceHaversine(st.lat, st.lng, pt.lat, pt.lon);
            if(d < minDist) { minDist = d; bestKm = pt.km; }
        }
        
        if (minDist <= RAYON_RECHERCHE_KM && bestKm >= KM_MIN_DEPART) {
            globalData.push({
                ...st, km: bestKm, detour: minDist,
                dispo: st.pdcs.length, total: st.pdcs.length, liveInfo: []
            });
            activeOperators.add(st.op);
        }
    });
    
    globalData.sort((a,b) => a.km - b.km);

    lastActiveOperators = activeOperators;
    buildOperatorChips(activeOperators);

    log("PROJECTION", `${globalData.length} stations retenues le long du tracé.`);
    renderList();
    fetchLiveQualicharge();
}

/* --- Opérateurs "principaux" : liste externe (CSV), jamais codée en dur --- */
let PRIMARY_OPERATORS = [];
let lastActiveOperators = new Set();
let operatorsMoreExpanded = false;
const PRIMARY_OPERATORS_CSV_URL = './operateurs_principaux.csv';
const PRIMARY_OPERATORS_CACHE_KEY = 'cached_primary_operators';

async function getCachedPrimaryOperators() {
    try {
        const db = await openDB();
        const tx = db.transaction(STORE_STATIONS, 'readonly');
        const store = tx.objectStore(STORE_STATIONS);
        return await new Promise(r => {
            const req = store.get(PRIMARY_OPERATORS_CACHE_KEY);
            req.onsuccess = () => r(req.result || null);
            req.onerror = () => r(null);
        });
    } catch (err) {
        return null;
    }
}

async function savePrimaryOperatorsToDB(list) {
    try {
        const db = await openDB();
        const tx = db.transaction(STORE_STATIONS, 'readwrite');
        tx.objectStore(STORE_STATIONS).put(list, PRIMARY_OPERATORS_CACHE_KEY);
    } catch (err) {
        log("OPÉRATEURS", "Erreur de sauvegarde de la liste principale : " + err.message, true);
    }
}

// Récupère la liste des opérateurs "principaux" depuis un fichier CSV externe,
// maintenu indépendamment de l'appli (un seul champ attendu : "nom"). Mise en
// cache locale pour un fonctionnement hors-ligne dès le premier chargement réussi.
async function loadPrimaryOperators() {
    const cached = await getCachedPrimaryOperators();
    if (Array.isArray(cached) && cached.length > 0) {
        PRIMARY_OPERATORS = cached;
        log("OPÉRATEURS", `Liste des opérateurs principaux chargée depuis le cache (${cached.length}).`);
    }

    if (!navigator.onLine) {
        if (!PRIMARY_OPERATORS.length) log("OPÉRATEURS", "Hors-ligne et aucune liste en cache : pas de tri principal/secondaire pour l'instant.", true);
        return;
    }

    try {
        const res = await fetch(PRIMARY_OPERATORS_CSV_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
        const list = parsed.data.map(row => (row.nom || '').trim()).filter(Boolean);
        if (list.length === 0) throw new Error('fichier vide ou colonne "nom" absente');

        PRIMARY_OPERATORS = list;
        savePrimaryOperatorsToDB(list);
        log("OPÉRATEURS", `${list.length} opérateurs principaux récupérés depuis ${PRIMARY_OPERATORS_CSV_URL}.`);

        // Si des bornes étaient déjà affichées avant que le CSV n'arrive, on ré-applique le tri.
        if (lastActiveOperators.size > 0) buildOperatorChips(lastActiveOperators);
    } catch (err) {
        const msg = PRIMARY_OPERATORS.length
            ? `Échec de mise à jour de ${PRIMARY_OPERATORS_CSV_URL}, liste en cache conservée (${err.message}).`
            : `${PRIMARY_OPERATORS_CSV_URL} introuvable : liste plate utilisée en attendant (${err.message}).`;
        log("OPÉRATEURS", msg, true);
    }
}

// Correspondance partielle insensible à la casse : absorbe les variantes de
// nommage du fichier IRVE (ex. "Power Dot France" vs entrée "Power Dot").
function isPrimaryOperator(opName) {
    if (!opName || PRIMARY_OPERATORS.length === 0) return false;
    const norm = opName.toLowerCase();
    return PRIMARY_OPERATORS.some(p => norm.includes(p.toLowerCase()));
}

function buildOperatorChips(activeOperatorsSet) {
    const sorted = Array.from(activeOperatorsSet).sort();
    const primary = sorted.filter(isPrimaryOperator);
    const secondary = sorted.filter(op => !isPrimaryOperator(op));

    const primaryContainer = document.getElementById('operatorChipsList');
    const secondaryContainer = document.getElementById('operatorChipsListSecondary');
    primaryContainer.innerHTML = "";
    secondaryContainer.innerHTML = "";
    operatorsMoreExpanded = false;
    secondaryContainer.hidden = true;

    const makeChip = (op) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'op-chip active';
        chip.dataset.op = op;
        chip.textContent = op;
        chip.onclick = () => toggleOperatorChip(op);
        return chip;
    };

    if (primary.length === 0) {
        // Aucun opérateur principal détecté sur ce trajet : liste à plat, pas de découpage.
        sorted.forEach(op => primaryContainer.appendChild(makeChip(op)));
    } else {
        primary.forEach(op => primaryContainer.appendChild(makeChip(op)));
        secondary.forEach(op => secondaryContainer.appendChild(makeChip(op)));
        if (secondary.length > 0) {
            const moreToggle = document.createElement('button');
            moreToggle.type = 'button';
            moreToggle.id = 'opMoreToggle';
            moreToggle.className = 'op-chip op-chip-more';
            moreToggle.textContent = `+ ${secondary.length} autres`;
            moreToggle.onclick = toggleOperatorsMore;
            primaryContainer.appendChild(moreToggle);
        }
    }
    updateOpCountLabel();
}

function toggleOperatorsMore() {
    operatorsMoreExpanded = !operatorsMoreExpanded;
    const secondaryContainer = document.getElementById('operatorChipsListSecondary');
    const moreToggle = document.getElementById('opMoreToggle');
    secondaryContainer.hidden = !operatorsMoreExpanded;
    if (moreToggle) moreToggle.textContent = operatorsMoreExpanded ? `− Moins d'opérateurs` : `+ ${secondaryContainer.children.length} autres`;
}

function toggleSelectAllOps(status) {
    document.querySelectorAll('#operatorChipsList .op-chip[data-op], #operatorChipsListSecondary .op-chip').forEach(chip => chip.classList.toggle('active', status));
    updateOpCountLabel();
    renderList();
}

function toggleOperatorChip(op) {
    const chip = document.querySelector(`.op-chip[data-op="${CSS.escape(op)}"]`);
    if (chip) chip.classList.toggle('active');
    updateOpCountLabel();
    renderList();
}

function updateOpCountLabel() {
    const chips = document.querySelectorAll('#operatorChipsList .op-chip[data-op], #operatorChipsListSecondary .op-chip');
    const activeCount = document.querySelectorAll('#operatorChipsList .op-chip.active[data-op], #operatorChipsListSecondary .op-chip.active').length;
    const label = document.getElementById('opCountLabel');
    if (!label) return;
    label.textContent = chips.length ? ` (${activeCount}/${chips.length})` : '';
}

function fetchLiveQualicharge() {
    if(globalData.length === 0) {
        log("LIVE", "Aucune station en mémoire pour lancer le live.", true);
        return;
    }
    
    if(!navigator.onLine) {
        log("LIVE", "🌐 Hors-ligne : Qualicharge Live indisponible.", true);
        return;
    }

    log("LIVE", "Recherche du fichier dynamique Qualicharge sur data.gouv.fr...");
    
    fetch("https://www.data.gouv.fr/api/1/datasets/infrastructures-de-recharge-pour-vehicules-electriques-donnees-ouvertes/")
    .then(res => res.json())
    .then(data => {
        const resource = data.resources.find(r => 
            r.title.toLowerCase().includes('dynamique') || 
            r.title.toLowerCase().includes('disponibilité') ||
            r.description?.toLowerCase().includes('dynamique')
        );
        
        const liveUrl = resource ? resource.latest : "https://www.data.gouv.fr/fr/datasets/r/411443b1-6667-473f-8217-1c57c167408f";
        log("LIVE", `URL dynamique trouvée. Téléchargement CSV en cours...`);
        
        Papa.parse(liveUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                log("LIVE", `Flux Qualicharge chargé (${res.data.length} lignes). Analyse...`);
                let dict = {};
                res.data.forEach(r => { if(r.id_pdc_itinerance) dict[r.id_pdc_itinerance] = r; });
                
                globalData.forEach(st => {
                    let countOk = 0;
                    st.liveInfo = [];
                    st.pdcs.forEach(pdcId => {
                        let info = dict[pdcId] || { etat_pdc: "INCONNU", occupation_pdc: "INCONNU", horodatage: "N/A" };
                        
                        let etatClean = (info.etat_pdc || "").trim().toLowerCase();
                        let occupClean = (info.occupation_pdc || "").trim().toLowerCase();
                        
                        let estEnService = ["en_service", "active", "available", "disponible"].includes(etatClean);
                        etatClean = estEnService ? "en_service" : info.etat_pdc;

                        let estLibre = ["libre", "free", "false", "0", "available"].includes(occupClean);
                        occupClean = estLibre ? "libre" : info.occupation_pdc;

                        if (estEnService && estLibre) {
                            countOk++;
                        }
                        st.liveInfo.push({id: pdcId, etat: etatClean, occup: occupClean, h: (info.horodatage || "").substring(0,16).replace('T',' ')});
                    });
                    st.dispo = countOk;
                });
                log("LIVE", "Disponibilités mises à jour avec succès !");
                renderList();

                if (isInitialGPXLoad) {
                    const term = document.getElementById('terminal-logs');
                    if (term && term.classList.contains('show')) {
                        toggleLogs();
                    }
                    isInitialGPXLoad = false;
                }
            },
            error: function(err) { log("LIVE", "Erreur chargement flux live: " + err.message, true); }
        });
    })
    .catch(e => log("LIVE", "Erreur réseau API live: " + e.message, true));
}

// --- Icônes de manœuvre (PNG Mapbox directions-icons, domaine public CC0) ---
// Fichiers archivés dans le repo sous icons/dark/ (icônes noires, thème clair)
// et icons/light/ (icônes blanches, thème sombre) — voir <img class="icon-light-theme">
// et <img class="icon-dark-theme"> ci-dessous, basculées automatiquement en CSS
// via prefers-color-scheme. kUturnLeft (13) réutilise le PNG de kUturnRight (12),
// reflété en CSS ; kRoundaboutExit (27) réutilise l'icône de kRoundaboutEnter (26).
const VALHALLA_MANEUVER_ICON_FILES = {
  1: "direction_depart.png",
  2: "direction_depart_right.png",
  3: "direction_depart_left.png",
  4: "direction_arrive.png",
  5: "direction_arrive_right.png",
  6: "direction_arrive_left.png",
  7: "direction_new_name_straight.png",
  8: "direction_continue_straight.png",
  9: "direction_turn_slight_right.png",
  10: "direction_turn_right.png",
  11: "direction_turn_sharp_right.png",
  12: "direction_uturn.png",
  13: "direction_uturn.png",
  14: "direction_turn_sharp_left.png",
  15: "direction_turn_left.png",
  16: "direction_turn_slight_left.png",
  17: "direction_on_ramp_straight.png",
  18: "direction_on_ramp_right.png",
  19: "direction_on_ramp_left.png",
  20: "direction_off_ramp_right.png",
  21: "direction_off_ramp_left.png",
  22: "direction_fork_straight.png",
  23: "direction_fork_right.png",
  24: "direction_fork_left.png",
  25: "direction_merge_straight.png",
  26: "direction_roundabout.png",
  27: "direction_roundabout.png",
  37: "direction_merge_right.png",
  38: "direction_merge_left.png",
};

// Rend les deux <img> (icône claire/sombre) d'une manœuvre ; la bascule entre les deux
// se fait en CSS pur (.icon-light-theme / .icon-dark-theme). kUturnLeft (13) est reflété.
function maneuverIconImg(type) {
    const file = VALHALLA_MANEUVER_ICON_FILES[type] || VALHALLA_MANEUVER_ICON_FILES[8];
    const mirrorStyle = type === 13 ? ' style="transform:scaleX(-1)"' : '';
    return `<img class="icon-light-theme" src="icons/dark/${file}" alt=""${mirrorStyle}>`
         + `<img class="icon-dark-theme" src="icons/light/${file}" alt=""${mirrorStyle}>`;
}

function renderList(kmOverride) {
    const kmFilter = (typeof kmOverride === 'number' && !isNaN(kmOverride)) ? kmOverride : (parseFloat(document.getElementById('kmInput').value) || 0);
    
    if (currentViewMode === 'ROADBOOK') {
        renderRoadbookList(kmFilter);
    } else {
        renderStationsList(kmFilter);
    }

    // La position basse dévoile la prochaine carte (station ou instruction) :
    // si son contenu vient de changer de hauteur, on réajuste tout de suite.
    if (sheetState === 'low') setSheetState('low');
}

// Affiche en mètres sous 1 km (arrondi à 50m : une précision GPS/route-matching plus
// fine serait trompeuse et ferait "trembler" le chiffre), en km au dixième au-delà.
function formatManeuverDistance(km) {
    const clamped = Math.max(0, km);
    if (clamped < 1) return { val: Math.round(clamped * 1000 / 50) * 50, unit: 'm' };
    return { val: clamped.toFixed(1), unit: 'km' };
}

function renderRoadbookList(kmFilter) {
    // Mode "instructions de conduite" : les points des stations VE sont masqués de la carte
    for(let k in markers) map.removeLayer(markers[k]);
    markers = {};

    if (roadbookManeuvers.length === 0) {
        document.getElementById('stationsContainer').innerHTML = "<div style='padding:20px; text-align:center;'>Aucune instruction de guidage trouvée dans ce fichier.<br><small>(Fonctionnalité disponible avec les fichiers JSON Valhalla nativement fournis avec manœuvres)</small></div>";
        return;
    }

    const visibleManeuvers = roadbookManeuvers.filter(m => m.km >= kmFilter);

    if (visibleManeuvers.length === 0) {
        document.getElementById('stationsContainer').innerHTML = "<div style='padding:20px; text-align:center;'>Fin du guidage (aucune instruction restante).</div>";
        return;
    }

    let html = "";
    visibleManeuvers.forEach((m, idx) => {
        const distToNext = m.km - kmFilter;
        const isNext = idx === 0;

        let urgency = 'roadbook-far';
        if (distToNext <= 0.2) urgency = 'roadbook-near';
        else if (distToNext <= 1) urgency = 'roadbook-mid';

        const cardClass = isNext ? `roadbook-next ${urgency}` : 'roadbook-later';
        const d = formatManeuverDistance(distToNext);

        html += `
        <div class='station-card ${cardClass}' onclick="if(${m.lat}){ map.setView([${m.lat}, ${m.lon}], 16); }">
          <div class='station-main'>
            <div class='nav-block nav-block-maneuver'>
              <div class='maneuver-icon'>${maneuverIconImg(m.type)}</div>
              <div class='pk-val-wrap'><span class='pk-val'>${d.val}</span><span class='pk-unit'>${d.unit}</span></div>
            </div>
            <div class='info-block'>
              <div class='op-title' style='color: var(--text);'>${m.instruction}</div>
            </div>
          </div>
        </div>`;
    });

    document.getElementById('stationsContainer').innerHTML = html;
}

function renderStationsList(kmFilter) {
    let selectedOps = new Set();
    document.querySelectorAll('#operatorChipsList .op-chip.active[data-op], #operatorChipsListSecondary .op-chip.active').forEach(chip => {
        selectedOps.add(chip.dataset.op);
    });

    for(let k in markers) map.removeLayer(markers[k]);
    markers = {};
    
    let html = "";
    globalData.forEach((s, i) => {
        if (s.km < kmFilter) return;
        if (selectedOps.size > 0 && !selectedOps.has(s.op)) return;
        if (s.total < PDC_TOTAL_MIN) return;
        
        let status = s.dispo === 0 ? 'dispo-alert' : (s.dispo <= s.total/3 ? 'dispo-warn' : 'dispo-ok');
        let color = s.dispo === 0 ? '#dc2626' : (s.dispo <= s.total/3 ? '#d97706' : '#16a34a');
        
        let m = L.circleMarker([s.lat, s.lng], {radius:8, fillColor:color, color:'#fff', weight:1, fillOpacity:0.9}).addTo(map);
        
        const coordsStr = `${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}`;
        const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;

        m.bindPopup(`
          <b>${s.op}</b><br>${s.nom}<br>
          <div style="margin-top:6px; font-size:11px;">
            📍 <a href="${gmapsUrl}" target="_blank" rel="noopener noreferrer" style="color: #0B72E7; text-decoration: underline; font-weight: bold;">
              ${coordsStr} ↗
            </a>
          </div>
        `);
        markers[i] = m;
        
        let pdcsHtml = s.liveInfo.map(p => `<tr><td>${p.id}</td><td><b>${p.etat}</b></td><td>${p.occup}</td><td>${p.h}</td></tr>`).join('');
        if(!pdcsHtml) pdcsHtml = `<tr><td colspan="4">Aucun statut disponible</td></tr>`;
        
        html += `
        <div class='station-card' onclick="map.setView([${s.lat}, ${s.lng}], 14); markers[${i}].openPopup();">
          <div class='station-main'>
            <div class='nav-block'>
              <div class='pk-val-wrap'><span class='pk-val'>${(s.km - kmFilter).toFixed(1)}</span><span class='pk-unit'>km</span></div>
              <div class='detour-line'>
                <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v9a4 4 0 0 0 4 4h6"/><path d="M13 12l4 4-4 4"/></svg>
                ${s.detour.toFixed(2)} km
              </div>
            </div>
            <div class='info-block'>
              <div class='op-title'>${s.op}</div>
              <div class='st-name' title="${s.nom}">${s.nom}</div>
              <div class='st-commune'>${s.commune}</div>
            </div>
            <div class='tech-block' onclick="event.stopPropagation(); document.getElementById('pdc_${i}').classList.toggle('show')">
              <div style='font-weight:bold; font-size:12px;'>${s.pwr}kW</div>
              <div class='${status}' style='font-size:11px; font-weight:bold;'>${s.dispo}/${s.total} PDC</div>
            </div>
          </div>
          <div id='pdc_${i}' class='pdc-panel'>
            <table class='pdc-table'>
              <thead><tr><th>PDC</th><th>Etat</th><th>Occupation</th><th>Heure</th></tr></thead>
              <tbody>${pdcsHtml}</tbody>
            </table>
          </div>
        </div>`;
    });
    
    document.getElementById('stationsContainer').innerHTML = html || "<div style='padding:20px; text-align:center;'>Aucune station trouvée avec ces critères.</div>";
}

// Restaure les réglages bornes de la dernière session (objet JSON unique, même
// mécanique que GeoRouter) et synchronise l'affichage du panneau réglages en conséquence.
restaurerReglages();

initMap();

// Enregistrement du Service Worker & vérification des fichiers partagés
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(() => {
      log("PWA", "Service Worker actif.");

    }).catch(err => {
      log("PWA", "Erreur d'enregistrement du Service Worker : " + err.message, true);
      if (!hasIncomingRoute) checkSharedFile();
    });
  });
}
