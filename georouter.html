<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0B0E" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <title>GeoRouter - GraphHopper</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <!-- Polices de l'interface (zone basse uniquement — la carte garde ses styles Leaflet natifs) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFFFFF; --text: #111114; --muted: #6B6B72; --border: #EBEBEE;
      --card-bg: #FAFAFB; --input-bg: #FAFAFB; --input-border: #EBEBEE;
      --options-bg: #FAFAFB; --options-border: #EBEBEE;
      --hover-bg: #E8F1FD;
      --panel-2: #E9EAED; --line-strong: #C3C4CB;
      --accent: #0B72E7; --on-accent: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0B0E; --text: #F2F2F5; --muted: #8B8B93; --border: #232329;
        --card-bg: #141418; --input-bg: #141418; --input-border: #232329;
        --options-bg: #141418; --options-border: #232329;
        --hover-bg: #1B2A3D;
        --panel-2: #232329; --line-strong: #4A4A54;
        --accent: #4FA3FF; --on-accent: #0B0B0E;
      }
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    #map {
      position: relative;
      width: 100%;
      flex: 0 0 auto;
      z-index: 1;
      min-height: 40px; /* filet de sécurité avant que le JS ne fixe la hauteur exacte */
    }

    /* --- BOTTOM SHEET : 3 hauteurs (peek / half / full), glissable --- */
    /* Occupe le reste de l'écran sous la carte (pas de superposition) */
    .sheet {
      position: relative; width: 100%; flex: 0 0 auto; z-index: 20;
      background: var(--card-bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      border-radius: 0;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.28s cubic-bezier(.4,0,.2,1);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet.dragging { transition: none; }

    .sheet-handle-zone {
      display: flex; align-items: center; justify-content: center;
      height: 34px; flex-shrink: 0; cursor: grab; touch-action: none;
    }
    .sheet-handle { width: 38px; height: 4px; border-radius: 2px; background: var(--muted); }

    /* Zone tampon invisible juste au-dessus du sheet, déborde dans la carte
       pour élargir la cible de préhension (évite les taps ratés sur la carte). */
    .sheet-drag-buffer {
      position: fixed; left: 0; right: 0; height: 22px; z-index: 19;
      cursor: grab; touch-action: none;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.03));
    }

    .sheet-summary {
      display: flex; align-items: center; gap: 10px; padding: 0 16px 12px; flex-shrink: 0; cursor: pointer;
    }
    .summary-text {
      flex: 1; min-width: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.98rem;
      color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .summary-text .muted { color: var(--muted); font-weight: 500; }
    .summary-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .sheet-pinned { flex-shrink: 0; padding: 0 16px 12px; }

    .sheet-body {
      flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 8px;
    }

    /* Masquée par défaut quelle que soit l'orientation : ne réapparaît que via
       body.search-mode, mécanisme propre au mode paysage (cf. media query
       plus bas). Sans cette règle hors media query, le <div> retombe sur son
       display:block par défaut et reste visible en permanence en portrait. */
    .search-mode-bar { display: none; }

    /* --- MODE PAYSAGE : carte + panneau côte à côte, largeur fixe responsive.
       Déclenchement 100% automatique (rotation téléphone OU fenêtre PC large),
       pas de drag : largeur calculée une fois pour toutes via clamp(). --- */
    @media (orientation: landscape) and (min-width: 560px) {
      body { flex-direction: row; }
      #map {
        flex: 1 1 auto;
        width: auto;
        height: 100% !important;
        min-height: 0;
      }
      .sheet-drag-buffer, .sheet-handle-zone { display: none; }
      .sheet {
        /* Plancher 340px : sous ce seuil, titre + icônes réglages/accueil
           deviennent trop serrés. + réserve à droite pour la barre de
           navigation système, qui en paysage se retrouve sur ce bord-là sur
           téléphone (inchangé sur PC, où l'inset vaut 0). */
        width: calc(clamp(340px, 34vw, 420px) + env(safe-area-inset-right));
        height: 100% !important;
        flex: 0 0 auto;
        box-sizing: border-box;
        box-shadow: -4px 0 16px rgba(0,0,0,0.10);
        padding-right: env(safe-area-inset-right);
        padding-bottom: 0;
      }
      .sheet-summary {
        /* Marge pour la barre de statut / l'encoche : le sheet occupe toute
           la hauteur en paysage, sa première ligne visible touche donc le
           haut de l'écran (pas de carte au-dessus comme en portrait). */
        padding-top: max(12px, env(safe-area-inset-top));
      }

      /* --- MODE RECHERCHE (paysage uniquement) ---
         Le clavier mobile en paysage mange une part énorme des ~350-400px de
         hauteur dispo : plutôt que de faire cohabiter carte + formulaire +
         suggestions dans ce qui reste, le champ actif prend tout le panneau
         (largeur pleine écran, carte masquée) le temps de la recherche.
         Se déclenche/s'annule via JS (enterSearchMode/exitSearchMode). */
      body.search-mode #map { display: none; }
      body.search-mode .sheet { width: 100% !important; }
      body.search-mode .sheet-summary,
      body.search-mode .sheet-pinned,
      body.search-mode #route-summary,
      body.search-mode .settings-panel,
      body.search-mode #logPanel,
      body.search-mode .btn-grid {
        display: none !important;
      }
      body.search-mode .search-mode-bar {
        display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        padding-top: max(12px, env(safe-area-inset-top));
        margin-bottom: 8px;
      }
      .search-mode-label { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.95rem; color: var(--text); }
      body.search-mode .sheet-body { padding-top: 0; }
      body.search-mode .route-card { flex: 1; min-height: 0; }
      body.search-mode #via-points { display: flex; flex-direction: column; }
      body.search-mode .route-card > .route-row,
      body.search-mode #via-points > .route-row {
        display: none;
      }
      body.search-mode #via-points.search-active-parent { flex: 1; min-height: 0; }
      body.search-mode .route-row.search-active-row {
        display: flex !important; flex: 1; min-height: 0; align-items: stretch;
      }
      body.search-mode .route-row.search-active-row > .input-group {
        flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
      }
      body.search-mode .suggestions {
        flex: 1; min-height: 0; max-height: none; overflow-y: auto; margin-top: 6px;
      }
    }

    .settings-panel { padding: 2px 0 4px; }
    .settings-panel[hidden] { display: none; }


    h2 {
      margin: 0 0 2px 0; font-size: 1.1rem; color: var(--text);
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.01em;
    }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line-strong);
      background: var(--panel-2); color: var(--text); display: inline-flex; align-items: center;
      justify-content: center; cursor: pointer; text-decoration: none; flex-shrink: 0;
      transition: filter 0.15s, color 0.15s;
    }
    .icon-btn svg { width: 17px; height: 17px; }
    .icon-btn:hover { color: var(--accent); filter: brightness(0.96); }
    .icon-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
    .icon-btn.active { color: var(--accent); background: var(--hover-bg); }
    .icon-btn-ghost { background: transparent; border-color: transparent; }
    .icon-btn-ghost:hover { background: var(--hover-bg); filter: none; }
    .icon-btn-sm { width: 34px; height: 34px; border-radius: 9px; }
    .icon-btn-sm svg { width: 15px; height: 15px; }

    /* --- carte de trajet : pastilles départ/arrivée façon appli de nav --- */
    .route-card { display: flex; flex-direction: column; gap: 6px; }
    .route-row { display: flex; align-items: flex-start; gap: 8px; }
    .route-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 14px;
      border: 2px solid var(--accent); background: var(--card-bg);
    }
    .route-dot-end { background: var(--accent); border-color: var(--accent); }
    .route-dot-via {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 9px;
      background: var(--options-bg); border: 1px solid var(--options-border); color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif;
    }
    .route-row > .input-group { flex: 1; min-width: 0; }
    
    .input-group { position: relative; display: flex; flex-direction: column; gap: 4px; }
    .input-row { display: flex; gap: 6px; align-items: center; }
    
    .input-with-clear {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    input[type="text"], select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      font-size: 0.9rem;
      background-color: var(--input-bg);
      color: var(--text);
    }

    .input-with-clear input {
      padding-right: 30px;
    }

    .btn-clear-text {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 50%;
      display: none;
      line-height: 1;
      touch-action: manipulation;
    }
    .btn-clear-text:active { background-color: var(--options-bg); color: var(--text); }

    .btn-remove-step {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
      border-radius: 6px;
      padding: 7px 9px;
      cursor: pointer;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .btn-remove-step:active { background-color: #e53935; color: white; }

    /* --- segmented control : moteur de recherche / vitesse max --- */
    .segmented {
      display: flex; gap: 3px; background: var(--card-bg); border: 1px solid var(--line-strong);
      border-radius: 10px; padding: 3px;
    }
    .segmented-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .segmented-btn {
      flex: 1; border: none; background: transparent; color: var(--muted);
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.78rem;
      padding: 7px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .segmented-btn.active { background: var(--accent); color: var(--on-accent); }

    /* --- ligne d'option avec interrupteur (façon "options d'itinéraire" des apps de nav) --- */
    .option-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; cursor: pointer; user-select: none;
      background: var(--card-bg); border: 1px solid var(--line-strong); border-radius: 10px;
    }
    .option-row-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text); font-weight: 500; }
    .option-row-label svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }

    .switch { position: relative; display: inline-block; width: 40px; height: 24px; flex-shrink: 0; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch-track {
      position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background 0.15s;
    }
    .switch-thumb {
      position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform 0.15s;
    }
    .switch input:checked ~ .switch-track { background: var(--accent); }
    .switch input:checked ~ .switch-track .switch-thumb { transform: translateX(16px); }
    .switch input:focus-visible ~ .switch-track { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* --- réordonnancement des étapes par glisser-déposer --- */
    .drag-handle {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      color: var(--muted); cursor: grab; touch-action: none; flex-shrink: 0; border-radius: 9px;
      margin-top: 3px;
    }
    .drag-handle:hover, .drag-handle:active { color: var(--accent); background: var(--hover-bg); }
    .drag-handle svg { width: 16px; height: 16px; pointer-events: none; }
    .route-row.dragging { opacity: 0.5; }
    .route-row.drag-over { box-shadow: 0 -2px 0 var(--accent); }

    .suggestions:not(:empty) {
      margin-top: 4px;
      background: var(--card-bg);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      max-height: 180px;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.10);
      -webkit-overflow-scrolling: touch;
    }
    .suggestions:empty { display: none; }
    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text);
      border-bottom: 1px solid var(--line-strong);
      -webkit-tap-highlight-color: rgba(52, 152, 219, 0.2);
      user-select: none;
    }
    .suggestion-item:active { background: var(--hover-bg); }

    .btn-grid {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      font-family: 'Inter', sans-serif;
      transition: filter 0.15s, background 0.2s;
      flex: 1;
      text-align: center;
    }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-secondary:hover, .btn-secondary:active { color: var(--accent); filter: brightness(0.96); }
    .btn-secondary:disabled { opacity: 0.4; cursor: default; }
    .btn-outline { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-strong); }
    .btn-outline:hover { color: var(--accent); filter: brightness(0.96); }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn-icon { padding: 8px; flex: initial; width: 38px; display: inline-flex; align-items: center; justify-content: center; }
    .btn-svg { width: 15px; height: 15px; flex-shrink: 0; }
    .btn-pill { border-radius: 999px !important; padding: 12px !important; font-size: 0.9rem !important; }
    .btn-fixed { height: 50px; border-radius: 12px !important; padding: 0 !important; font-size: 0.92rem !important; flex: none; width: 100%; }
    .btn-send { background: #16a34a; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 4px; }
    #route-peage-detail { font-size: 0.72rem; color: var(--muted); margin: 6px 0 4px; display: none; }

    /* --- Étiquettes des points sur la carte : bouton supprimer --- */
    .pt-popup { display: flex; flex-direction: column; gap: 8px; min-width: 140px; }
    .pt-popup b { font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; }
    .pt-popup-del {
      border: none; border-radius: 8px; background: #fee2e2; color: #dc2626;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.8rem;
      padding: 9px 10px; cursor: pointer; width: 100%;
    }
    .pt-popup-del:active { background: #fecaca; }

    .log-panel {
      display: none;
      position: fixed; inset: 0; z-index: 2000;
      background: #0d1117; color: #8ee08e;
      flex-direction: column;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
    .log-panel.show { display: flex; }
    .log-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top));
      background: #161b22; color: #e6edf3; font-size: 0.82rem; font-weight: 600;
      flex-shrink: 0;
    }
    .log-panel-btn {
      background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px;
      padding: 5px 10px; font-size: 0.72rem; cursor: pointer; font-family: inherit;
    }
    .log-panel-content {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 10px 14px 30px; font-size: 0.72rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
      user-select: text; -webkit-user-select: text;
    }
    .log-line { border-bottom: 1px dashed #21262d; padding: 3px 0; }
    .log-line .log-time { color: #6e7681; }
    .log-line .log-cat { color: #58a6ff; font-weight: 700; }
    .log-line.log-err .log-cat { color: #f85149; }
    .log-line.log-err { color: #ffa198; }
    .btn-send:hover { filter: brightness(1.05); }

    .summary-divider { height: 1px; background: var(--border); margin: 10px 0 12px; }

    .stats-row { display: flex; gap: 8px; margin-bottom: 4px; }
    .stat-block { flex: 1; background: var(--card-bg); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; }
    .stat-block .stat-label { font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .stat-block .stat-value { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--text); margin-top: 1px; }
    .stat-block.stat-toll .stat-value { color: var(--accent); }

    .instructions {
      margin-top: 10px;
      padding-top: 4px;
    }
    .step-item {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 0.8rem; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--text);
    }
    .step-item .step-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; }
    .step-item .step-text { flex: 1; line-height: 1.4; }
    .step-item .step-dist { font-family: 'Space Grotesk', sans-serif; font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    #loading { display: none; color: var(--accent); font-weight: bold; font-size: 0.85rem; text-align: center; }

    .pin-marker {
      position: relative;
      width: 32px;
      height: 42px;
    }
    .pin-marker svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.4));
    }
    .pin-label {
      position: absolute;
      top: 7px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 13px;
      pointer-events: none;
    }

    .btn-opacity-slider {
      background-color: #fff;
      width: 30px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .btn-opacity-slider input[type="range"] {
      width: 76px;
      height: 30px;
      margin: 0;
      transform: rotate(-90deg);
      cursor: pointer;
      accent-color: #2980b9;
    }

    .btn-fit-bounds {
      background-color: #fff;
      width: 30px;
      height: 30px;
      position: relative;
      cursor: pointer;
      display: block;
      text-decoration: none;
    }
    .btn-fit-bounds svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #444;
      display: block;
    }
    .btn-fit-bounds:hover { background-color: #f4f4f4; }
    .btn-fit-bounds:hover svg { color: #000; }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="sheet-drag-buffer" id="sheetDragBuffer" aria-hidden="true"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle-zone" id="sheetHandle">
      <span class="sheet-handle" aria-hidden="true"></span>
    </div>

    <div class="sheet-summary" id="sheetSummary">
      <div class="summary-text" id="summaryText">Où souhaitez-vous aller ?</div>
      <div class="summary-actions">
        <button type="button" class="icon-btn" id="settingsBtn" title="Réglages" aria-label="Réglages">

  <script>
    /* ===================== JOURNAL DES OPÉRATIONS ===================== */
    const logEntries = [];
    function log(cat, message, isError) {
      const time = new Date().toLocaleTimeString('fr-FR', { hour12: false });
      logEntries.push({ time, cat, message, isError: !!isError });
      const el = document.getElementById('logContent');
      if (el) {
        const line = document.createElement('div');
        line.className = 'log-line' + (isError ? ' log-err' : '');
        line.innerHTML = `<span class="log-time">${time}</span> <span class="log-cat">[${cat}]</span> ${message.replace(/</g, '&lt;')}`;
        el.appendChild(line);
        el.scrollTop = el.scrollHeight;
      }
      if (isError) console.error(`[${cat}]`, message); else console.log(`[${cat}]`, message);
    }
    function toggleLogPanel() {
      document.getElementById('logPanel').classList.toggle('show');
    }
    function clearLogs() {
      logEntries.length = 0;
      document.getElementById('logContent').innerHTML = '';
      log('LOG', 'Journal vidé.');
    }
    function copyLogs() {
      const text = logEntries.map(e => `${e.time} [${e.cat}] ${e.message}`).join('\n');
      navigator.clipboard.writeText(text).then(() => log('LOG', 'Journal copié dans le presse-papier.'));
    }

    /* --- CONFIGURATION GRAPHHOPPER ---
       Serveur auto-hébergé : pas de clé API, mode flexible (custom_model)
       disponible nativement -> pas besoin de repli "compte gratuit". */
    const GRAPHHOPPER_BASE_URL = "https://api.lawatture.fr";

    let currentGeocoder = 'photon';
    let ignoreNextMapClick = false;

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    /* --- TARIFS PAR ROUTE (synthese_par_route.csv) ---
       Chargé une fois au démarrage : numero_route -> { coutKm, coutTotal,
       forfait, ouvrage }. Les entrées composées (ex "A40/A42", des
       bretelles à coût quasi nul) sont écartées à la lecture, pour rester
       simple.
       type_tarif distingue deux logiques de calcul :
       - "lineaire" (routes normales) : coût = km parcourus × cout_km.
       - "forfait" (ponts/tunnels à péage forfaitaire type Millau, Mont
         Blanc, Tancarville...) : le tarif réel ne dépend pas de la
         distance mais du simple franchissement de l'ouvrage. cout_km a
         été calculé en divisant un total sur une longueur de référence
         qui n'a aucune raison de coïncider avec la longueur mesurée sur
         le tracé GraphHopper (souvent très courte, donc très sensible à
         la moindre différence de digitalisation) - d'où des écarts
         parfois importants si on applique bêtement km_graphhopper ×
         cout_km. Pour ces routes, on applique directement cout_total,
         une seule fois par franchissement, indépendamment du km mesuré. */
    // Normalisation commune pour comparer un numéro de route quelle que soit
    // sa source (CSV sans espace "A13" vs GraphHopper avec espace "A 13").
    function normaliserNumeroRoute(s) {
      return (s || '').toUpperCase().replace(/\s+/g, '');
    }

    let tarifsRoutes = new Map();
    async function chargerTarifsRoutes() {
      try {
        const res = await fetch('./synthese_par_route.csv');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const texte = await res.text();
        const lignes = texte.trim().split('\n');
        const entetes = lignes[0].split(';').map(h => h.trim());
        const idxNumero = entetes.indexOf('numero_route');
        const idxCoutKm = entetes.indexOf('cout_km');
        const idxCoutTotal = entetes.indexOf('cout_total');
        const idxTypeTarif = entetes.indexOf('type_tarif');
        const idxOuvrage = entetes.indexOf('ouvrage_identifie');
        let nbForfait = 0;
        for (let i = 1; i < lignes.length; i++) {
          const cols = lignes[i].split(';');
          const numero = (cols[idxNumero] || '').trim();
          if (!numero || numero.includes('/')) continue; // bretelles composées écartées
          const coutKm = parseFloat(cols[idxCoutKm]);
          const coutTotal = idxCoutTotal >= 0 ? parseFloat(cols[idxCoutTotal]) : NaN;
          const typeTarif = idxTypeTarif >= 0 ? (cols[idxTypeTarif] || '').trim().toLowerCase() : 'lineaire';
          const ouvrage = idxOuvrage >= 0 ? (cols[idxOuvrage] || '').trim() : '';
          if (numero && !isNaN(coutKm)) {
            const estForfait = typeTarif === 'forfait' && !isNaN(coutTotal);
            if (estForfait) nbForfait++;
            tarifsRoutes.set(normaliserNumeroRoute(numero), {
              coutKm,
              coutTotal: isNaN(coutTotal) ? 0 : coutTotal,
              forfait: estForfait,
              ouvrage
            });
          }
        }
        log('PEAGE', `Tarifs chargés : ${tarifsRoutes.size} routes (dont ${nbForfait} au forfait).`);
      } catch (err) {
        log('PEAGE', `Échec du chargement des tarifs : ${err.message}`, true);
      }
    }

    /* --- SURCOUCHE VISUELLE (troncons_filtres.geojson) ---
       Purement décorative désormais (couche "Routes payantes" du menu
       calques) - plus aucun lien avec la détection ni le calcul du coût,
       qui viennent entièrement de la réponse GraphHopper. */
    let tollDataLoaded = false;
    let tollDataLoadingPromise = null;
    function ensureTollDataLoaded() {
      if (tollDataLoadingPromise) return tollDataLoadingPromise;
      const t0 = performance.now();
      log('PEAGE', 'Chargement de la surcouche visuelle démarré...');
      tollDataLoadingPromise = fetch('./troncons_filtres.geojson')
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(geoData => {
          tollLayer.addData(geoData);
          tollDataLoaded = true;
          log('PEAGE', `Surcouche visuelle chargée : ${geoData.features.length} tronçons en ${Math.round(performance.now() - t0)} ms.`);
        })
        .catch(err => {
          log('PEAGE', `Échec du chargement de la surcouche visuelle : ${err.message}`, true);
          tollDataLoadingPromise = null;
        });
      return tollDataLoadingPromise;
    }

    function tollEstPayant(valeur) {
      if (valeur == null) return false;
      if (typeof valeur === 'boolean') return valeur;
      return String(valeur).toLowerCase() !== 'no';
    }

    /* --- CALCUL DU PÉAGE : 100% depuis la réponse GraphHopper, un seul
       appel réseau (celui du calcul d'itinéraire lui-même) ---
       path.details.toll et path.details.street_ref sont deux découpages
       en intervalles [début, fin, valeur] du même tableau de points
       (path.points.coordinates). On fusionne leurs frontières pour obtenir
       des intervalles atomiques où le statut péage ET le numéro de route
       sont constants - une même zone payante peut ainsi chevaucher deux
       numéros différents (ex: A41 puis A43) sans erreur d'attribution.
       Un intervalle payant sans numéro identifiable (trou "None", souvent
       aux jonctions/bretelles) est affiché tel quel comme "segment non
       identifié", coût 0€ - jamais estimé à l'aveugle, juste rendu visible. */
    function calculerCoutPeage(path, tarifs) {
      const details = path.details || {};
      const tollArr = details.toll || [];
      const refArr = details.street_ref || [];
      const coords = (path.points && path.points.coordinates || []).map(([lon, lat]) => [lat, lon]); // -> [lat,lng]

      log('PEAGE', `Diagnostic : details=${JSON.stringify(Object.keys(details))}, toll=${tollArr.length} intervalle(s), street_ref=${refArr.length} intervalle(s), ${coords.length} points.`);
      if (tollArr.length > 0) log('PEAGE', `toll (brut) : ${JSON.stringify(tollArr)}`);

      if (tollArr.length === 0 || coords.length < 2) {
        log('PEAGE', 'Aucun intervalle "toll" dans la réponse (ou tracé vide) -> 0€ par construction.');
        return { total: 0, detail: [], segments: [] };
      }

      const frontieres = new Set([0, coords.length - 1]);
      tollArr.forEach(([s, e]) => { frontieres.add(s); frontieres.add(e); });
      refArr.forEach(([s, e]) => { frontieres.add(s); frontieres.add(e); });
      const bornes = Array.from(frontieres).sort((a, b) => a - b);

      const tollAIndex = i => {
        const e = tollArr.find(([s, e]) => i >= s && i < e);
        return e ? tollEstPayant(e[2]) : false;
      };
      const refAIndex = i => {
        const e = refArr.find(([s, e]) => i >= s && i < e);
        return e ? e[2] : null;
      };

      const parRoute = {}; // numero -> { cout, km }
      const segments = [];
      let segmentCourant = [];
      let dernierNumero;

      for (let k = 0; k < bornes.length - 1; k++) {
        const start = bornes[k], end = bornes[k + 1];
        if (end <= start) continue;
        const payant = tollAIndex(start);

        if (payant) {
          const numero = refAIndex(start) || '?';
          let km = 0;
          for (let i = start; i < end; i++) km += haversineKm(coords[i][0], coords[i][1], coords[i + 1][0], coords[i + 1][1]);
          const cleTarif = normaliserNumeroRoute(numero);
          const infosTarif = tarifs.get(cleTarif);
          const tarifTrouve = !!infosTarif;
          if (numero !== '?' && !tarifTrouve) {
            log('PEAGE', `Tarif introuvable pour "${numero}" (clé normalisée "${cleTarif}") - 0€ appliqué par défaut.`, true);
          }

          if (!parRoute[numero]) parRoute[numero] = { cout: 0, km: 0, forfait: false, ouvrage: '' };

          let cout;
          if (tarifTrouve && infosTarif.forfait) {
            // Péage forfaitaire (pont/tunnel) : le tarif ne dépend pas de
            // la distance mesurée par GraphHopper. On applique le montant
            // une seule fois par franchissement, pas à chaque intervalle
            // atomique qui compose ce même franchissement.
            cout = parRoute[numero].forfait ? 0 : infosTarif.coutTotal;
            parRoute[numero].forfait = true;
            parRoute[numero].ouvrage = infosTarif.ouvrage || '';
          } else {
            const tarif = tarifTrouve ? infosTarif.coutKm : 0;
            cout = km * tarif;
          }

          parRoute[numero].cout += cout;
          parRoute[numero].km += km;

          const sousCoords = coords.slice(start, end + 1);
          if (numero === dernierNumero && segmentCourant.length > 0) {
            segmentCourant.push(...sousCoords.slice(1));
          } else {
            if (segmentCourant.length > 1) segments.push(segmentCourant);
            segmentCourant = sousCoords.slice();
          }
          dernierNumero = numero;
        } else {
          if (segmentCourant.length > 1) segments.push(segmentCourant);
          segmentCourant = [];
          dernierNumero = undefined;
        }
      }
      if (segmentCourant.length > 1) segments.push(segmentCourant);

      let total = 0;
      Object.values(parRoute).forEach(v => total += v.cout);

      const detail = Object.entries(parRoute)
        .map(([numero, v]) => ({ numero, cout: v.cout, km: v.km, forfait: v.forfait, ouvrage: v.ouvrage }))
        .sort((a, b) => b.cout - a.cout);

      log('PEAGE', `Résultat : total=${total.toFixed(2)}€, ${detail.length} route(s), ${segments.length} segment(s) à colorier.`);
      if (detail.length > 0) log('PEAGE', `Détail : ${JSON.stringify(detail)}`);

      return { total, detail, segments };
    }

    function setGeocoder(engine) {
      currentGeocoder = engine;
      document.querySelectorAll('#geocoder-segmented .segmented-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.engine === engine);
      });
      sauvegarderReglages();
    }

    function setSpeedLimit(value) {
      document.getElementById('speed-limit-select').value = value;
      document.querySelectorAll('#speed-segmented .segmented-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.speed === value);
      });
      sauvegarderReglages();
    }

    /* --- Persistance des réglages (localStorage) : vitesse max, éviter
       péages, éviter grands axes, moteur de recherche - tout revenait à
       zéro à chaque rechargement de page avant ça. */
    const REGLAGES_KEY = 'georouter_reglages';

    function sauvegarderReglages() {
      const reglages = {
        speedLimit: document.getElementById('speed-limit-select').value,
        avoidTolls: document.getElementById('avoid-tolls-check').checked,
        avoidHighways: document.getElementById('avoid-highways-check').checked,
        geocoder: currentGeocoder
      };
      try {
        localStorage.setItem(REGLAGES_KEY, JSON.stringify(reglages));
      } catch (err) {
        log('REGLAGES', `Échec de sauvegarde : ${err.message}`, true);
      }
    }

    function restaurerReglages() {
      let reglages;
      try {
        reglages = JSON.parse(localStorage.getItem(REGLAGES_KEY) || '{}');
      } catch (err) {
        return;
      }
      if (reglages.speedLimit) setSpeedLimit(reglages.speedLimit);
      if (reglages.avoidTolls) document.getElementById('avoid-tolls-check').checked = true;
      if (reglages.avoidHighways) document.getElementById('avoid-highways-check').checked = true;
      if (reglages.geocoder) setGeocoder(reglages.geocoder);
      log('REGLAGES', 'Réglages restaurés depuis la dernière session.');
    }

    /* ===================== BOTTOM SHEET (haute / milieu / basse) ===================== */
    const sheet = document.getElementById('sheet');
    const mapEl = document.getElementById('map');
    const sheetHandleZone = document.getElementById('sheetHandle');
    const sheetDragBuffer = document.getElementById('sheetDragBuffer');
    const sheetSummary = document.getElementById('sheetSummary');
    const sheetPinned = document.getElementById('sheetPinned');
    let sheetState = 'mid';
    let mapReady = false; // la carte Leaflet n'existe pas encore à ce stade du script

    // Détection auto du mode paysage (rotation téléphone OU fenêtre PC large) :
    // s'appuie sur le même media query que le CSS, aucune action utilisateur requise.
    const landscapeMQ = window.matchMedia('(orientation: landscape) and (min-width: 560px)');
    function isLandscape() { return landscapeMQ.matches; }

    // "basse" = exactement la hauteur du contenu épinglé (poignée + résumé +
    // bouton Calculer), calculée dynamiquement pour ne jamais rien couper.
    function pinnedContentHeight() {
      return sheetHandleZone.offsetHeight + sheetSummary.offsetHeight + sheetPinned.offsetHeight;
    }

    function sheetHeightsPx() {
      const vh = window.innerHeight;
      return {
        low: pinnedContentHeight(),
        mid: Math.round(vh * 0.52),
        high: Math.max(vh - 4, 0) // la carte est quasi entièrement masquée
      };
    }

    // Le sheet ET la carte se complètent toujours exactement (pas de superposition) :
    // quand le sheet grandit, la carte rétrécit d'autant. Le buffer de préhension
    // reste collé juste au-dessus du sheet, quelle que soit sa hauteur.
    function applySheetHeight(px) {
      const vh = window.innerHeight;
      sheet.style.height = px + 'px';
      mapEl.style.height = Math.max(vh - px, 0) + 'px';
      sheetDragBuffer.style.bottom = px + 'px';
      if (mapReady) map.invalidateSize({ pan: false });
    }

    function setSheetState(state) {
      sheetState = state;
      sheet.dataset.state = state;

      if (isLandscape()) {
        // En paysage, la largeur du panneau est fixée en CSS (clamp()) : on ne
        // touche pas à sheet.style.height, on efface juste les valeurs inline
        // laissées par le mode portrait pour laisser la main au CSS.
        sheet.style.height = '';
        mapEl.style.height = '';
        sheetDragBuffer.style.bottom = '';
        if (mapReady) requestAnimationFrame(() => map.invalidateSize({ pan: false }));
        return;
      }

      applySheetHeight(sheetHeightsPx()[state]);
    }

    let sheetDrag = null;
    function startSheetDrag(e) {
      e.preventDefault(); // supprime les événements souris de compatibilité générés après un tap tactile
      ignoreNextMapClick = true; // évite qu'un clic fantôme retombe sur la carte après redimensionnement
      setTimeout(() => { ignoreNextMapClick = false; }, 400); // sécurité : ne bloque pas un vrai clic ultérieur
      sheetDrag = { startY: e.clientY, startHeight: sheet.getBoundingClientRect().height, moved: 0 };
      sheet.classList.add('dragging');
      e.currentTarget.setPointerCapture(e.pointerId);
    }
    sheetHandleZone.addEventListener('pointerdown', startSheetDrag);
    sheetDragBuffer.addEventListener('pointerdown', startSheetDrag);

    document.addEventListener('pointermove', (e) => {
      if (!sheetDrag) return;
      const dy = e.clientY - sheetDrag.startY;
      sheetDrag.moved = Math.max(sheetDrag.moved, Math.abs(dy));
      const h = sheetHeightsPx();
      const newHeight = Math.min(Math.max(sheetDrag.startHeight - dy, h.low), h.high);
      applySheetHeight(newHeight);
    });

    document.addEventListener('pointerup', () => {
      if (!sheetDrag) return;
      sheet.classList.remove('dragging');
      if (sheetDrag.moved < 6) {
        // Tap sur la poignée : fait défiler basse -> milieu -> haute -> basse
        const order = ['low', 'mid', 'high'];
        setSheetState(order[(order.indexOf(sheetState) + 1) % order.length]);
      } else {
        const currentHeight = sheet.getBoundingClientRect().height;
        const h = sheetHeightsPx();
        const nearest = Object.entries(h).sort((a, b) => Math.abs(a[1] - currentHeight) - Math.abs(b[1] - currentHeight))[0][0];
        setSheetState(nearest);
      }
      sheetDrag = null;
    });

    // Taper sur la barre résumé (hors boutons) remonte le sheet en position milieu s'il est en position basse
    sheetSummary.addEventListener('click', (e) => {
      if (e.target.closest('.icon-btn')) return;
      if (sheetState === 'low') setSheetState('mid');
    });

    window.addEventListener('resize', () => setSheetState(sheetState));
    // Filet de sécurité : certains navigateurs ne redéclenchent pas 'resize' de
    // façon fiable sur une rotation d'écran ; matchMedia, lui, est garanti.
    landscapeMQ.addEventListener('change', () => setSheetState(sheetState));

    // Réglages avancés (moteur de recherche) repliés par défaut
    document.getElementById('settingsBtn').addEventListener('click', () => {
      const panel = document.getElementById('settingsPanel');
      panel.hidden = !panel.hidden;
      if (!panel.hidden && sheetState === 'low') setSheetState('mid');
    });

    // Résumé compact de la barre du haut, mis à jour au fil de la saisie
    function updateSummaryText() {
      const el = document.getElementById('summaryText');
      if (document.getElementById('route-summary').style.display === 'block') return; // le résultat prime une fois calculé
      const startVal = document.getElementById('start-input').value.trim();
      const endVal = document.getElementById('end-input').value.trim();
      if (!startVal && !endVal) {
        el.innerHTML = 'Où souhaitez-vous aller ?';
      } else {
        el.innerHTML = `<span>${startVal || '<span class="muted">Départ</span>'}</span> → <span>${endVal || '<span class="muted">Arrivée</span>'}</span>`;
      }
    }
    document.getElementById('start-input').addEventListener('input', updateSummaryText);
    document.getElementById('end-input').addEventListener('input', updateSummaryText);

    // --- MODE RECHERCHE (paysage) : le champ actif + ses suggestions prennent
    // tout le panneau (largeur pleine écran, carte masquée), pour éviter que
    // le clavier mobile n'écrase un panneau déjà réduit à ~350-400px de haut.
    // Sans effet en portrait, où le mécanisme existant (setSheetState('high'))
    // suffit largement.
    function enterSearchMode(rowEl, labelText) {
      if (!isLandscape() || !rowEl) return;
      document.querySelectorAll('.route-row.search-active-row').forEach(r => r.classList.remove('search-active-row'));
      rowEl.classList.add('search-active-row');
      const viaPoints = document.getElementById('via-points');
      viaPoints.classList.toggle('search-active-parent', rowEl.parentElement === viaPoints);
      document.getElementById('searchModeLabel').textContent = labelText;
      document.body.classList.add('search-mode');
      if (mapReady) requestAnimationFrame(() => map.invalidateSize({ pan: false }));
    }

    function exitSearchMode(afterRestore) {
      const wasActive = document.body.classList.contains('search-mode');
      if (wasActive) {
        document.body.classList.remove('search-mode');
        document.querySelectorAll('.route-row.search-active-row').forEach(r => r.classList.remove('search-active-row'));
        document.getElementById('via-points').classList.remove('search-active-parent');
        if (document.activeElement && document.activeElement.tagName === 'INPUT') {
          document.activeElement.blur();
        }
      }
      if (mapReady && wasActive) {
        // La carte était masquée (display:none) pendant la recherche : tant
        // que invalidateSize() n'a pas tourné sur le conteneur redevenu
        // visible, tout setView/panTo derrière calculerait une position
        // fausse. afterRestore() (ex: recentrage sur le lieu choisi) attend
        // donc que ce soit fait.
        requestAnimationFrame(() => {
          map.invalidateSize({ pan: false });
          if (afterRestore) afterRestore();
        });
      } else if (afterRestore) {
        afterRestore();
      }
    }

    // Position haute obligatoire dès qu'on tape dans un champ de recherche :
    // la carte se masque pour laisser toute la place au clavier + aux suggestions.
    document.addEventListener('focusin', (e) => {
      if (!e.target.matches('input[type="text"]')) return;
      const row = e.target.closest('.route-row');
      if (isLandscape() && row) {
        // Libellé lisible tiré du placeholder existant ("Départ (clic carte...)"
        // -> "Départ"), pas de nouvelle source de vérité à maintenir.
        const label = (e.target.placeholder || '').split('(')[0].trim() || 'Recherche';
        enterSearchMode(row, label);
      } else {
        setSheetState('high');
      }
    });

    const map = L.map('map', { minZoom: 2, maxZoom: 18 });
    mapReady = true;
    setSheetState('mid'); // dimensionne carte + sheet maintenant que Leaflet existe
    const franceBounds = L.latLngBounds([41.3, -5.2], [51.1, 9.6]);
    map.fitBounds(franceBounds, { padding: [10, 10] });

    const osmDeLayer = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
      minZoom: 2,
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    /* --- CREATION DU PANE POUR PÉAGES --- */
    map.createPane('tollPane');
    map.getPane('tollPane').style.zIndex = 350;

    /* --- SURCOUCHE TRONÇONS PAYANTS (GEOJSON, rendu Canvas) ---
       Rendu en Canvas plutôt que SVG (défaut Leaflet) : nettement plus
       rapide avec plusieurs milliers de tracés (un seul <canvas>, pas un
       <path> DOM par tronçon).
       Chargée À LA DEMANDE uniquement (pas au démarrage) : soit quand
       l'utilisateur active la couche "Routes payantes" dans le menu calques,
       soit dès qu'un calcul d'itinéraire a besoin du coût péage. */
    const tollLayer = L.geoJSON(null, {
      pane: 'tollPane',
      renderer: L.canvas({ pane: 'tollPane' }),
      style: {
        color: '#e74c3c',
        weight: 5,
        opacity: 0.9
      }
    });

    /* --- CONTRÔLE DES CALQUES & ÉCHELLE --- */
    const baseLayers = { "OpenStreetMap.de": osmDeLayer };
    const overlayLayers = {
      "Routes payantes (Péages)": tollLayer
    };

    const layerControl = L.control.layers(baseLayers, overlayLayers, { 
      position: 'topright', 
      collapsed: true 
    }).addTo(map);

    // Chargement à la demande : dès que l'utilisateur coche "Routes payantes"
    map.on('overlayadd', (e) => {
      if (e.layer === tollLayer && !tollDataLoaded) {
        ensureTollDataLoaded().then(() => {
          if (tollLayer.getBounds().isValid()) {
            map.fitBounds(tollLayer.getBounds(), { padding: [20, 20] });
          }
        });
      }
    });

    const layerContainer = layerControl.getContainer();

    L.DomEvent.disableClickPropagation(layerContainer);
    L.DomEvent.disableScrollPropagation(layerContainer);

    layerContainer.addEventListener('pointerdown', (e) => {
      if (!layerContainer.classList.contains('leaflet-control-layers-expanded')) {
        ignoreNextMapClick = true;
      }
    });

    L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);

    restaurerReglages();
    chargerTarifsRoutes();

    /* --- BOUTON DE RECADRAGE AUTOMATIQUE --- */
    const FitBoundsControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function(map) {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        const button = L.DomUtil.create('a', 'btn-fit-bounds', container);
        
        button.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
          </svg>
        `;
        button.href = '#';
        button.title = "Recadrer sur l'itinéraire ou les marqueurs";

        L.DomEvent.disableClickPropagation(container);

        button.onclick = function(e) {
          e.preventDefault();
          fitMapToContent();
        };

        return container;
      }
    });
    map.addControl(new FitBoundsControl());

    function fitMapToContent() {
      if (routeLayer && routeLayer.getBounds().isValid()) {
        map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
        return;
      }

      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        if (group.getBounds().isValid()) {
          map.fitBounds(group.getBounds(), { padding: [50, 50], maxZoom: 15 });
          return;
        }
      }

      map.fitBounds(franceBounds, { padding: [10, 10] });
    }

    let routeOpacity = 0.85;
    const opacityControl = L.control({ position: 'topleft' });
    opacityControl.onAdd = function() {
      const container = L.DomUtil.create('div', 'leaflet-bar');
      const div = L.DomUtil.create('div', 'btn-opacity-slider', container);
      div.title = "Opacité de la surcouche péages";
      div.innerHTML = `
        <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="${routeOpacity}" orient="vertical" aria-label="Opacité de la surcouche péages">
      `;
      L.DomEvent.disableClickPropagation(container);
      return container;
    };
    opacityControl.addTo(map);

    document.getElementById('opacity-slider').addEventListener('input', (e) => {
      routeOpacity = parseFloat(e.target.value);
      if (routeLayer) routeLayer.setStyle({ opacity: routeOpacity });
      if (peageHighlightLayer) peageHighlightLayer.setStyle({ opacity: routeOpacity });
    });

    let routePoints = { start: null, end: null, vias: [] };
    let markers = [];
    let routeLayer = null;
    let peageHighlightLayer = L.polyline([], { color: '#ff1493', weight: 7, opacity: routeOpacity }); // portions payantes réellement empruntées, en surbrillance sur le tracé (même principe que gpxLinePast dans Roadbook VE)
    let decodedRouteCoords = [];
    let routeSummary = null;
    let currentPath = null;        // path GraphHopper courant (instructions, details, points)
    let rawRouteResponse = null;   // réponse brute complète (export JSON / envoi Roadbook)

    function closeAllSuggestions() {
      document.querySelectorAll('.suggestions').forEach(el => el.innerHTML = '');
      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        document.activeElement.blur();
      }
    }

    map.on('movestart dragstart', closeAllSuggestions);
    document.getElementById('sheetBody').addEventListener('scroll', closeAllSuggestions, { passive: true });

    map.on('click', function(e) {
      closeAllSuggestions();

      if (layerContainer.classList.contains('leaflet-control-layers-expanded')) {
        layerControl.collapse();
        ignoreNextMapClick = false;
        return;
      }

      if (ignoreNextMapClick) {
        ignoreNextMapClick = false;
        return;
      }

      const latlng = e.latlng;
      const coordsString = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;

      if (!routePoints.start) {
        setPoint('start', latlng, coordsString);
      } else if (!routePoints.end) {
        setPoint('end', latlng, coordsString);
      } else {
        addViaPoint(latlng);
      }
    });

    function setPoint(type, latlng, label) {
      routePoints[type] = latlng;
      if (type === 'start') {
        document.getElementById('start-input').value = label;
        toggleClearBtn('start-input', 'start-clear');
      }
      if (type === 'end') {
        document.getElementById('end-input').value = label;
        toggleClearBtn('end-input', 'end-clear');
      }
      updateMarkers();
      if (typeof updateSummaryText === 'function') updateSummaryText();
      if (sheetState === 'high') setSheetState('mid');
    }

    function toggleClearBtn(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (input && btn) {
        btn.style.display = input.value.length > 0 ? 'block' : 'none';
      }
    }

    function handleClearClick(e, type, inputId, btnId) {
      e.preventDefault();
      
      const input = document.getElementById(inputId);
      if (input) {
        input.value = '';
        input.blur();
      }
      
      toggleClearBtn(inputId, btnId);
      closeAllSuggestions();
      
      if (type === 'start') {
        routePoints.start = null;
      } else if (type === 'end') {
        routePoints.end = null;
      } else if (typeof type === 'number') {
        routePoints.vias[type] = null;
      }
      
      updateMarkers();
    }

    function useCurrentLocation() {
      if (!navigator.geolocation) {
        alert("La géolocalisation n'est pas supportée par votre navigateur.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const latlng = L.latLng(position.coords.latitude, position.coords.longitude);
          const coordsString = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
          exitSearchMode(() => {
            setPoint('start', latlng, coordsString);
            map.setView(latlng, 14);
          });
        },
        (error) => alert(`Erreur de géolocalisation : ${error.message}`),
        { enableHighAccuracy: true }
      );
    }

    // Variante Promise, sans recentrage carte (calculateRoute recadre déjà sur
    // tout le trajet une fois calculé - un setView ici ferait un saut inutile).
    // Utilisée pour pré-remplir automatiquement le départ quand seule
    // l'arrivée a été renseignée.
    function resolveStartFromCurrentLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("La géolocalisation n'est pas supportée par votre navigateur."));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const latlng = L.latLng(position.coords.latitude, position.coords.longitude);
            const coordsString = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
            setPoint('start', latlng, coordsString); // remplit visiblement le champ, pas de magie silencieuse
            log('GEOLOC', `Départ auto-renseigné : ${coordsString}`);
            resolve(latlng);
          },
          (error) => {
            const messages = {
              1: "Localisation refusée. Renseignez un départ manuellement.",
              2: "Position indisponible. Renseignez un départ manuellement.",
              3: "La localisation a pris trop de temps. Renseignez un départ manuellement."
            };
            const msg = messages[error.code] || "Impossible de vous localiser. Renseignez un départ manuellement.";
            log('GEOLOC', `Échec (code ${error.code}) : ${msg}`, true);
            reject(new Error(msg));
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      });
    }

    function addViaPoint(latlng = null) {
      routePoints.vias.push(latlng);
      renderViaInputs();
      updateMarkers();
    }

    /* --- Glisser-déposer pour réordonner les étapes (Pointer Events : souris + tactile) --- */
    let dragState = null;

    function initViaDrag(row) {
      const handle = row.querySelector('.drag-handle');
      handle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        dragState = { rowEl: row, pointerId: e.pointerId };
        row.classList.add('dragging');
        handle.setPointerCapture(e.pointerId);
      });
    }

    document.addEventListener('pointermove', (e) => {
      if (!dragState) return;
      const container = document.getElementById('via-points');
      const rows = Array.from(container.querySelectorAll('.route-row'));
      const overRow = rows.find(r => {
        if (r === dragState.rowEl) return false;
        const rect = r.getBoundingClientRect();
        return e.clientY >= rect.top && e.clientY <= rect.bottom;
      });
      rows.forEach(r => r.classList.remove('drag-over'));
      if (overRow) {
        const rect = overRow.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        container.insertBefore(dragState.rowEl, before ? overRow : overRow.nextSibling);
      }
    });

    document.addEventListener('pointerup', (e) => {
      if (!dragState) return;
      dragState.rowEl.classList.remove('dragging');

      const container = document.getElementById('via-points');
      const newOrder = Array.from(container.querySelectorAll('.route-row'))
        .map(r => routePoints.vias[parseInt(r.dataset.viaIndex, 10)]);
      routePoints.vias = newOrder;
      dragState = null;
      renderViaInputs();
      updateMarkers();
    });

    function renderViaInputs() {
      const container = document.getElementById('via-points');
      container.innerHTML = '';

      routePoints.vias.forEach((v, index) => {
        const row = document.createElement('div');
        row.className = 'route-row';
        const coordsStr = v ? `${v.lat.toFixed(5)}, ${v.lng.toFixed(5)}` : '';

        row.dataset.viaIndex = index;
        row.innerHTML = `
          <span class="drag-handle" title="Glisser pour réordonner">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
          </span>
          <span class="route-dot route-dot-via" aria-hidden="true">${index + 1}</span>
          <div class="input-group">
            <div class="input-row">
              <div class="input-with-clear">
                <input type="text" id="via-input-${index}" placeholder="Étape N°${index + 1}" value="${coordsStr}" oninput="toggleClearBtn('via-input-${index}', 'via-clear-${index}')">
                <button type="button" class="btn-clear-text" id="via-clear-${index}" onmousedown="handleClearClick(event, ${index}, 'via-input-${index}', 'via-clear-${index}')">✕</button>
              </div>
              <button class="icon-btn icon-btn-ghost icon-btn-sm" onclick="removeVia(${index})" title="Supprimer l'étape" aria-label="Supprimer l'étape">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
              </button>
            </div>
            <div id="via-suggestions-${index}" class="suggestions"></div>
          </div>
        `;
        container.appendChild(row);
        initViaDrag(row);

        toggleClearBtn(`via-input-${index}`, `via-clear-${index}`);

        setupAutocomplete(document.getElementById(`via-input-${index}`), document.getElementById(`via-suggestions-${index}`), (coords, name) => {
          routePoints.vias[index] = coords;
          document.getElementById(`via-input-${index}`).value = name;
          toggleClearBtn(`via-input-${index}`, `via-clear-${index}`);
          updateMarkers();
          map.setView(coords, 14);
          if (sheetState === 'high') setSheetState('mid');
        });
      });
    }

    function removeVia(index) {
      routePoints.vias.splice(index, 1);
      renderViaInputs();
      updateMarkers();
    }

    function reverseFullRoute() {
      const tempStart = routePoints.start;
      const startVal = document.getElementById('start-input').value;

      routePoints.start = routePoints.end;
      document.getElementById('start-input').value = document.getElementById('end-input').value;

      routePoints.end = tempStart;
      document.getElementById('end-input').value = startVal;

      routePoints.vias.reverse();

      toggleClearBtn('start-input', 'start-clear');
      toggleClearBtn('end-input', 'end-clear');
      renderViaInputs();
      updateMarkers();
    }

    function createPinIcon(label, color) {
      const svg = `
        <div class="pin-marker">
          <svg viewBox="0 0 384 512">
            <path fill="${color}" stroke="#ffffff" stroke-width="20" d="M172.268 501.67C26.97 291.03 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.03-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0z"/>
          </svg>
          <div class="pin-label">${label}</div>
        </div>
      `;
      return L.divIcon({
        className: 'custom-pin-icon',
        html: svg,
        iconSize: [32, 42],
        iconAnchor: [16, 42],
        popupAnchor: [0, -38]
      });
    }

    function updateMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      if (routePoints.start) {
        const m = L.marker(routePoints.start, { icon: createPinIcon('D', '#2ecc71'), draggable: true })
          .addTo(map)
          .bindPopup(`<div class="pt-popup"><b>Départ</b><button class="pt-popup-del" onclick="supprimerDepart()">🗑️ Supprimer ce point</button></div>`);
        m.on('dragend', function(e) {
          const latlng = e.target.getLatLng();
          const coordsStr = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
          setPoint('start', latlng, coordsStr);
        });
        markers.push(m);
      }

      routePoints.vias.forEach((v, i) => {
        if (v) {
          const m = L.marker(v, { icon: createPinIcon(i + 1, '#e67e22'), draggable: true })
            .addTo(map)
            .bindPopup(`<div class="pt-popup"><b>Étape N°${i + 1}</b><button class="pt-popup-del" onclick="supprimerEtapeDepuisCarte(${i})">🗑️ Supprimer ce point</button></div>`);
          m.on('dragend', function(e) {
            const latlng = e.target.getLatLng();
            routePoints.vias[i] = latlng;
            const input = document.getElementById(`via-input-${i}`);
            if (input) {
              input.value = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
              toggleClearBtn(`via-input-${i}`, `via-clear-${i}`);
            }
          });
          markers.push(m);
        }
      });

      if (routePoints.end) {
        const m = L.marker(routePoints.end, { icon: createPinIcon('A', '#e74c3c'), draggable: true })
          .addTo(map)
          .bindPopup(`<div class="pt-popup"><b>Arrivée</b><button class="pt-popup-del" onclick="supprimerArrivee()">🗑️ Supprimer ce point</button></div>`);
        m.on('dragend', function(e) {
          const latlng = e.target.getLatLng();
          const coordsStr = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
          setPoint('end', latlng, coordsStr);
        });
        markers.push(m);
      }
    }

    function supprimerDepart() {
      map.closePopup();
      routePoints.start = null;
      document.getElementById('start-input').value = '';
      toggleClearBtn('start-input', 'start-clear');
      updateMarkers();
      log('CARTE', 'Point de départ supprimé depuis la carte.');
    }

    function supprimerArrivee() {
      map.closePopup();
      routePoints.end = null;
      document.getElementById('end-input').value = '';
      toggleClearBtn('end-input', 'end-clear');
      updateMarkers();
      log('CARTE', "Point d'arrivée supprimé depuis la carte.");
    }

    function supprimerEtapeDepuisCarte(index) {
      map.closePopup();
      removeVia(index);
      log('CARTE', `Étape N°${index + 1} supprimée depuis la carte.`);
    }

    function setupAutocomplete(inputEl, suggestionsEl, onSelect) {
      let timer;
      inputEl.addEventListener('input', () => {
        clearTimeout(timer);
        const query = inputEl.value.trim();
        if (query.length < 3) { suggestionsEl.innerHTML = ''; return; }

        timer = setTimeout(() => {
          const center = map.getCenter();
          const currentZoom = map.getZoom();

          let url = "";
          if (currentGeocoder === 'ban') {
            url = `https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(query)}&lat=${center.lat}&lon=${center.lng}&limit=5`;
          } else {
            url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=-5.2,41.3,9.6,51.1&lat=${center.lat}&lon=${center.lng}&zoom=${currentZoom}&lang=fr&limit=5`;
          }

          fetch(url)
            .then(res => res.json())
            .then(data => {
              suggestionsEl.innerHTML = '';
              if (!data.features || data.features.length === 0) return;

              data.features.forEach(feature => {
                const props = feature.properties;
                const div = document.createElement('div');
                div.className = 'suggestion-item';

                let mainName = "";
                let city = "";
                let postcode = "";
                let lat, lng;

                if (currentGeocoder === 'ban') {
                  mainName = props.name || props.label;
                  city = props.city || '';
                  postcode = props.postcode ? `(${props.postcode})` : '';
                  [lng, lat] = feature.geometry.coordinates;
                } else {
                  mainName = props.name || props.street || '';
                  if (props.street && props.name && props.name !== props.street) {
                    mainName += ` (${props.street})`;
                  }
                  city = props.city || props.town || props.village || '';
                  postcode = props.postcode ? `(${props.postcode})` : '';
                  [lng, lat] = feature.geometry.coordinates;
                }

                div.innerHTML = `<strong>${mainName}</strong> <small style="color:#666; margin-left:5px;">${city} ${postcode}</small>`;

                div.onclick = (e) => {
                  e.stopPropagation();
                  const fullLabel = [props.name || props.street || props.label, city].filter(Boolean).join(', ');

                  suggestionsEl.innerHTML = '';
                  inputEl.blur();
                  exitSearchMode(() => onSelect(L.latLng(lat, lng), fullLabel));
                };
                suggestionsEl.appendChild(div);
              });
            })
            .catch(() => {});
        }, 300);
      });
    }

    setupAutocomplete(document.getElementById('start-input'), document.getElementById('start-suggestions'), (coords, name) => {
      setPoint('start', coords, name);
      toggleClearBtn('start-input', 'start-clear');
      map.setView(coords, 14);
    });

    setupAutocomplete(document.getElementById('end-input'), document.getElementById('end-suggestions'), (coords, name) => {
      setPoint('end', coords, name);
      toggleClearBtn('end-input', 'end-clear');
      map.setView(coords, 14);
    });

    // Arrondit à ~2 chiffres significatifs (ex: 24.10 -> 24, 4.42 -> 4.4, 0.85 -> 0.85)
    // cohérent avec le total péage arrondi à l'entier supérieur : c'est une estimation, pas un montant exact.
    function formatSig2(n) {
      if (n === 0) return '0';
      return Number(n.toPrecision(2)).toString();
    }

    function formatDuration(totalSeconds) {
      const totalMinutes = Math.round(totalSeconds / 60);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return hours > 0 ? `${hours} h ${minutes > 0 ? minutes + ' min' : ''}`.trim() : `${minutes} min`;
    }

    async function calculateRoute() {
      if (!routePoints.end) {
        alert("Veuillez sélectionner au moins une arrivée.");
        return;
      }

      if (!routePoints.start) {
        const loadingEl = document.getElementById('loading');
        loadingEl.textContent = 'Localisation de votre position...';
        loadingEl.style.display = 'block';
        try {
          await resolveStartFromCurrentLocation();
        } catch (err) {
          loadingEl.style.display = 'none';
          loadingEl.textContent = "Calcul de l'itinéraire en cours...";
          alert(err.message);
          return;
        }
        loadingEl.textContent = "Calcul de l'itinéraire en cours...";
      }

      ensureTollDataLoaded(); // en parallèle : couche visuelle facultative, sans lien avec le calcul

      document.getElementById('loading').style.display = 'block';
      document.getElementById('route-summary').style.display = 'none';

      const points = [
        [routePoints.start.lng, routePoints.start.lat],
        ...routePoints.vias.filter(v => v !== null).map(v => [v.lng, v.lat]),
        [routePoints.end.lng, routePoints.end.lat]
      ];

      // Réglages -> custom_model GraphHopper
      const priority = [];
      const speedRules = [];
      const speedVal = document.getElementById('speed-limit-select').value;
      if (speedVal !== 'none') speedRules.push({ if: "true", limit_to: speedVal });
      if (document.getElementById('avoid-tolls-check').checked) {
        priority.push({ if: "toll == ALL || toll == HGV", multiply_by: "0.1" });
      }
      if (document.getElementById('avoid-highways-check').checked) {
        priority.push({ if: "road_class == MOTORWAY", multiply_by: "0.1" });
      }
      const customModel = (priority.length > 0 || speedRules.length > 0)
        ? { priority: priority.length ? priority : undefined, speed: speedRules.length ? speedRules : undefined }
        : null;

      const payload = {
        points,
        profile: "car",
        points_encoded: false,
        details: ["street_ref", "toll"],
        instructions: true,
        locale: "fr",
        elevation: false
      };
      if (customModel) {
        payload.custom_model = customModel;
        payload['ch.disable'] = true; // custom_model incompatible avec le speed mode (Contraction Hierarchies)
      }

      log('ROUTE', `Calcul demandé : ${points.length} points, custom_model=${JSON.stringify(customModel)}${customModel ? ' (ch.disable=true)' : ''}`);

      try {
        const t0 = performance.now();
        const response = await fetch(`${GRAPHHOPPER_BASE_URL}/route`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok || !data.paths || data.paths.length === 0) {
          throw new Error(data.message || "Impossible de calculer l'itinéraire.");
        }

        log('ROUTE', `Réponse GraphHopper reçue en ${Math.round(performance.now() - t0)} ms (${(data.paths[0].distance / 1000).toFixed(1)} km).`);

        rawRouteResponse = data;
        await processRouteResponse(data.paths[0]);
      } catch (error) {
        log('ROUTE', `Erreur de calcul : ${error.message}`, true);
        alert(`Erreur : ${error.message}`);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    async function processRouteResponse(path) {
      currentPath = path;
      routeSummary = { length: path.distance / 1000, time: path.time / 1000 };
      decodedRouteCoords = (path.points.coordinates || []).map(([lon, lat]) => [lat, lon]); // -> [lat,lng]

      if (routeLayer) map.removeLayer(routeLayer);
      routeLayer = L.polyline(decodedRouteCoords, { color: '#2980b9', weight: 6, opacity: routeOpacity }).addTo(map);

      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

      // Le péage ne dépend plus d'aucune donnée externe (tout vient de la
      // réponse GraphHopper déjà en main) - la surcouche visuelle continue
      // de charger en parallèle si besoin, mais on ne l'attend plus.
      displayInstructions();
    }

    function displayInstructions() {
      const summaryDiv = document.getElementById('route-summary');
      const statsDiv = document.getElementById('route-stats');
      const listDiv = document.getElementById('instructions-list');
      const detailEl = document.getElementById('route-peage-detail');

      const evitementActif = document.getElementById('avoid-tolls-check').checked;

      // Calcul du péage : 100% depuis la réponse GraphHopper (street_ref +
      // toll), aucun appel réseau supplémentaire, synchrone.
      const peage = calculerCoutPeage(currentPath, tarifsRoutes);
      const peageValue = evitementActif ? 'Sans péage' : (peage.total > 0.01 ? `${Math.ceil(peage.total)} €` : 'Gratuit');

      statsDiv.innerHTML = `
        <div class="stats-row">
          <div class="stat-block">
            <div class="stat-label">Distance</div>
            <div class="stat-value">${routeSummary.length.toFixed(1)} km</div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Durée</div>
            <div class="stat-value">${formatDuration(routeSummary.time)}</div>
          </div>
          <div class="stat-block stat-toll">
            <div class="stat-label">Péage</div>
            <div class="stat-value">${peageValue}</div>
          </div>
        </div>
      `;

      // Coloration magenta : les mêmes segments GraphHopper utilisés pour
      // repérer les points du coût ci-dessus - garantit que ce qui est
      // affiché en couleur et ce qui est compté dans le total proviennent
      // exactement de la même détection.
      // Une seule polyline multi-segments mise à jour via setLatLngs, même
      // principe que gpxLinePast/gpxLineFuture dans Roadbook VE.
      if (!evitementActif && peage.segments.length > 0) {
        peageHighlightLayer.setLatLngs(peage.segments);
        // Retrait puis réajout systématique : routeLayer est recréé de zéro à
        // chaque recalcul (donc toujours réinséré tout en haut), alors qu'un
        // simple .addTo(map) sur une couche déjà présente ne la déplace pas -
        // sans ça, dès un 2e calcul (ex: après ajout d'une étape), la
        // surbrillance resterait sous le nouveau tracé bleu.
        map.removeLayer(peageHighlightLayer);
        peageHighlightLayer.addTo(map);
      } else {
        peageHighlightLayer.setLatLngs([]);
        map.removeLayer(peageHighlightLayer);
      }

      if (peage.detail.length > 0) {
        const noteResiduel = evitementActif
          ? '⚠️ Résiduel malgré "Éviter les péages" : '
          : '';
        const detailStr = peage.detail
          .map(d => {
            if (d.forfait) {
              const nomOuvrage = d.ouvrage ? ` (${d.ouvrage})` : '';
              return `${d.numero === '?' ? 'segment non identifié' : d.numero}${nomOuvrage} : forfait : ${formatSig2(d.cout)}€`;
            }
            const coutParKm = d.km > 0 ? d.cout / d.km : 0;
            return `${d.numero === '?' ? 'segment non identifié' : d.numero} : ${d.km.toFixed(1)} km à ${coutParKm.toFixed(2)}€/km : ${formatSig2(d.cout)}€`;
          })
          .join(' · ');
        detailEl.textContent = noteResiduel + detailStr;
        detailEl.style.display = 'block';
      } else {
        detailEl.textContent = '';
        detailEl.style.display = 'none';
      }

      listDiv.innerHTML = '';
      (currentPath.instructions || []).forEach((step) => {
        const item = document.createElement('div');
        item.className = 'step-item';
        const distMeters = Math.round(step.distance);
        const distStr = distMeters >= 1000 ? `${(distMeters / 1000).toFixed(1)} km` : `${distMeters} m`;
        item.innerHTML = `
          <span class="step-dot"></span>
          <span class="step-text">${step.text}</span>
          <span class="step-dist">${distStr}</span>
        `;
        listDiv.appendChild(item);
      });

      summaryDiv.style.display = 'block';
      const summaryText = document.getElementById('summaryText');
      summaryText.innerHTML = `${routeSummary.length.toFixed(1)} km · ${formatDuration(routeSummary.time)}` +
        (!evitementActif && peage.total > 0.01 ? ` · <span style="color:var(--accent)">${Math.ceil(peage.total)} €</span>` : '');

      // Le résultat prime : on repasse en position milieu (résultats + carte visibles) et on amène les résultats en vue
      if (sheetState === 'low' || sheetState === 'high') setSheetState('mid');
      setTimeout(() => summaryDiv.scrollIntoView({ block: 'start', behavior: 'smooth' }), 150);
    }


    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      log('IMPORT', `Fichier sélectionné : "${file.name}" (${file.size} octets)`);

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.paths && data.paths.length > 0) {
            // Format GraphHopper natif (seul format supporté).
            rawRouteResponse = data;
            await processRouteResponse(data.paths[0]);
            log('IMPORT', `Import réussi (format GraphHopper) : ${data.paths[0].points.coordinates.length} points.`);
          } else {
            throw new Error("Format non supporté (JSON GraphHopper attendu).");
          }
        } catch (err) {
          log('IMPORT', `Échec : ${err.message}`, true);
          alert(`Erreur d'importation : ${err.message}`);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function exportGPX() {
      if (!decodedRouteCoords || decodedRouteCoords.length === 0) return;
      let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="GeoRouter"><trk><name>Itinéraire</name><trkseg>\n`;
      decodedRouteCoords.forEach(c => gpx += `  <trkpt lat="${c[0]}" lon="${c[1]}"></trkpt>\n`);
      gpx += `</trkseg></trk></gpx>`;

      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'itineraire.gpx';
      a.click();
      URL.revokeObjectURL(url);
      log('EXPORT', `GPX exporté (${decodedRouteCoords.length} points).`);
    }

    function exportJSON() {
      if (!rawRouteResponse) return;
      const blob = new Blob([JSON.stringify(rawRouteResponse, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'itineraire.json';
      a.click();
      URL.revokeObjectURL(url);
      log('EXPORT', 'JSON (format brut GraphHopper) exporté.');
    }

    // --- PONT DE COMMUNICATION VERS ROADBOOK VE (via localStorage) ---
    // Envoie la réponse GraphHopper brute (format natif attendu par Roadbook VE).
    const HANDOFF_KEY = 'current_route_data';

    function sendToRoadbook() {
      if (!rawRouteResponse) {
        alert("Veuillez d'abord calculer un itinéraire avant de l'envoyer vers Roadbook VE.");
        return;
      }
      try {
        const payload = {
          type: 'json',
          filename: 'itineraire.json',
          content: JSON.stringify(rawRouteResponse),
          source: 'georouter',
          ts: Date.now()
        };
        localStorage.setItem(HANDOFF_KEY, JSON.stringify(payload));
        log('ENVOI', 'Itinéraire transmis vers Roadbook VE (format brut GraphHopper), redirection...');
        window.location.href = './roadbook.html';
      } catch (err) {
        log('ENVOI', `Échec de la transmission : ${err.message}`, true);
        alert("Impossible de transmettre l'itinéraire (stockage local plein ou indisponible) : " + err.message);
      }
    }

  </script>
