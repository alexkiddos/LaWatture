<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0B0E" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <title>GeoRouter - Valhalla (Stadia Maps)</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Turf.js pour le matching géométrique tracé <-> tronçons payants (calcul du péage) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

  <!-- Polices de l'interface (zone basse uniquement — la carte garde ses styles Leaflet natifs) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFFFFF; --text: #111114; --muted: #6B6B72; --border: #EBEBEE;
      --card-bg: #FAFAFB; --input-bg: #FAFAFB; --input-border: #EBEBEE;
      --options-bg: #FAFAFB; --options-border: #EBEBEE;
      --hover-bg: #E8F1FD;
      --panel-2: #E9EAED; --line-strong: #C3C4CB;
      --accent: #0B72E7; --on-accent: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0B0E; --text: #F2F2F5; --muted: #8B8B93; --border: #232329;
        --card-bg: #141418; --input-bg: #141418; --input-border: #232329;
        --options-bg: #141418; --options-border: #232329;
        --hover-bg: #1B2A3D;
        --panel-2: #232329; --line-strong: #4A4A54;
        --accent: #4FA3FF; --on-accent: #0B0B0E;
      }
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    #map {
      position: relative;
      width: 100%;
      flex: 0 0 auto;
      z-index: 1;
      min-height: 40px; /* filet de sécurité avant que le JS ne fixe la hauteur exacte */
    }

    /* --- BOTTOM SHEET : 3 hauteurs (peek / half / full), glissable --- */
    /* Occupe le reste de l'écran sous la carte (pas de superposition) */
    .sheet {
      position: relative; width: 100%; flex: 0 0 auto; z-index: 20;
      background: var(--card-bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      border-radius: 0;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.28s cubic-bezier(.4,0,.2,1);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet.dragging { transition: none; }

    .sheet-handle-zone {
      display: flex; align-items: center; justify-content: center;
      height: 34px; flex-shrink: 0; cursor: grab; touch-action: none;
    }
    .sheet-handle { width: 38px; height: 4px; border-radius: 2px; background: var(--muted); }

    /* Zone tampon invisible juste au-dessus du sheet, déborde dans la carte
       pour élargir la cible de préhension (évite les taps ratés sur la carte). */
    .sheet-drag-buffer {
      position: fixed; left: 0; right: 0; height: 22px; z-index: 19;
      cursor: grab; touch-action: none;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.03));
    }

    .sheet-summary {
      display: flex; align-items: center; gap: 10px; padding: 0 16px 12px; flex-shrink: 0; cursor: pointer;
    }
    .summary-text {
      flex: 1; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.98rem;
      color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .summary-text .muted { color: var(--muted); font-weight: 500; }
    .summary-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .sheet-pinned { flex-shrink: 0; padding: 0 16px 12px; }

    .sheet-body {
      flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 8px;
    }

    .settings-panel { padding: 2px 0 4px; }
    .settings-panel[hidden] { display: none; }


    h2 {
      margin: 0 0 2px 0; font-size: 1.1rem; color: var(--text);
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.01em;
    }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line-strong);
      background: var(--panel-2); color: var(--text); display: inline-flex; align-items: center;
      justify-content: center; cursor: pointer; text-decoration: none; flex-shrink: 0;
      transition: filter 0.15s, color 0.15s;
    }
    .icon-btn svg { width: 17px; height: 17px; }
    .icon-btn:hover { color: var(--accent); filter: brightness(0.96); }
    .icon-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
    .icon-btn.active { color: var(--accent); background: var(--hover-bg); }
    .icon-btn-ghost { background: transparent; border-color: transparent; }
    .icon-btn-ghost:hover { background: var(--hover-bg); filter: none; }
    .icon-btn-sm { width: 34px; height: 34px; border-radius: 9px; }
    .icon-btn-sm svg { width: 15px; height: 15px; }

    /* --- carte de trajet : pastilles départ/arrivée façon appli de nav --- */
    .route-card { display: flex; flex-direction: column; gap: 6px; }
    .route-row { display: flex; align-items: flex-start; gap: 8px; }
    .route-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 14px;
      border: 2px solid var(--accent); background: var(--card-bg);
    }
    .route-dot-end { background: var(--accent); border-color: var(--accent); }
    .route-dot-via {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 9px;
      background: var(--options-bg); border: 1px solid var(--options-border); color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif;
    }
    .route-row > .input-group { flex: 1; min-width: 0; }
    
    .input-group { position: relative; display: flex; flex-direction: column; gap: 4px; }
    .input-row { display: flex; gap: 6px; align-items: center; }
    
    .input-with-clear {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    input[type="text"], select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      font-size: 0.9rem;
      background-color: var(--input-bg);
      color: var(--text);
    }

    .input-with-clear input {
      padding-right: 30px;
    }

    .btn-clear-text {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 50%;
      display: none;
      line-height: 1;
      touch-action: manipulation;
    }
    .btn-clear-text:active { background-color: var(--options-bg); color: var(--text); }

    .btn-remove-step {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
      border-radius: 6px;
      padding: 7px 9px;
      cursor: pointer;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .btn-remove-step:active { background-color: #e53935; color: white; }

    /* --- segmented control : moteur de recherche / vitesse max --- */
    .segmented {
      display: flex; gap: 3px; background: var(--card-bg); border: 1px solid var(--line-strong);
      border-radius: 10px; padding: 3px;
    }
    .segmented-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .segmented-btn {
      flex: 1; border: none; background: transparent; color: var(--muted);
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.78rem;
      padding: 7px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .segmented-btn.active { background: var(--accent); color: var(--on-accent); }

    /* --- ligne d'option avec interrupteur (façon "options d'itinéraire" des apps de nav) --- */
    .option-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; cursor: pointer; user-select: none;
      background: var(--card-bg); border: 1px solid var(--line-strong); border-radius: 10px;
    }
    .option-row-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text); font-weight: 500; }
    .option-row-label svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }

    .switch { position: relative; display: inline-block; width: 40px; height: 24px; flex-shrink: 0; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch-track {
      position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background 0.15s;
    }
    .switch-thumb {
      position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform 0.15s;
    }
    .switch input:checked ~ .switch-track { background: var(--accent); }
    .switch input:checked ~ .switch-track .switch-thumb { transform: translateX(16px); }
    .switch input:focus-visible ~ .switch-track { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* --- réordonnancement des étapes par glisser-déposer --- */
    .drag-handle {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      color: var(--muted); cursor: grab; touch-action: none; flex-shrink: 0; border-radius: 9px;
      margin-top: 3px;
    }
    .drag-handle:hover, .drag-handle:active { color: var(--accent); background: var(--hover-bg); }
    .drag-handle svg { width: 16px; height: 16px; pointer-events: none; }
    .route-row.dragging { opacity: 0.5; }
    .route-row.drag-over { box-shadow: 0 -2px 0 var(--accent); }

    .suggestions:not(:empty) {
      margin-top: 4px;
      background: var(--card-bg);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      max-height: 180px;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.10);
      -webkit-overflow-scrolling: touch;
    }
    .suggestions:empty { display: none; }
    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text);
      border-bottom: 1px solid var(--line-strong);
      -webkit-tap-highlight-color: rgba(52, 152, 219, 0.2);
      user-select: none;
    }
    .suggestion-item:active { background: var(--hover-bg); }

    .btn-grid {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      font-family: 'Inter', sans-serif;
      transition: filter 0.15s, background 0.2s;
      flex: 1;
      text-align: center;
    }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-secondary:hover, .btn-secondary:active { color: var(--accent); filter: brightness(0.96); }
    .btn-secondary:disabled { opacity: 0.4; cursor: default; }
    .btn-outline { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-strong); }
    .btn-outline:hover { color: var(--accent); filter: brightness(0.96); }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn-icon { padding: 8px; flex: initial; width: 38px; display: inline-flex; align-items: center; justify-content: center; }
    .btn-svg { width: 15px; height: 15px; flex-shrink: 0; }
    .btn-pill { border-radius: 999px !important; padding: 12px !important; font-size: 0.9rem !important; }
    .btn-fixed { height: 50px; border-radius: 12px !important; padding: 0 !important; font-size: 0.92rem !important; flex: none; width: 100%; }
    .btn-send { background: #16a34a; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 4px; }
    #route-peage-detail { font-size: 0.72rem; color: var(--muted); margin: 6px 0 4px; display: none; }
    .btn-send:hover { filter: brightness(1.05); }

    .summary-divider { height: 1px; background: var(--border); margin: 10px 0 12px; }

    .stats-row { display: flex; gap: 8px; margin-bottom: 4px; }
    .stat-block { flex: 1; background: var(--card-bg); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; }
    .stat-block .stat-label { font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .stat-block .stat-value { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--text); margin-top: 1px; }
    .stat-block.stat-toll .stat-value { color: var(--accent); }

    .instructions {
      margin-top: 10px;
      padding-top: 4px;
    }
    .step-item {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 0.8rem; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--text);
    }
    .step-item .step-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; }
    .step-item .step-text { flex: 1; line-height: 1.4; }
    .step-item .step-dist { font-family: 'Space Grotesk', sans-serif; font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    #loading { display: none; color: var(--accent); font-weight: bold; font-size: 0.85rem; text-align: center; }

    .pin-marker {
      position: relative;
      width: 32px;
      height: 42px;
    }
    .pin-marker svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.4));
    }
    .pin-label {
      position: absolute;
      top: 7px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 13px;
      pointer-events: none;
    }

    .btn-opacity-slider {
      background-color: #fff;
      width: 30px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .btn-opacity-slider input[type="range"] {
      width: 76px;
      height: 30px;
      margin: 0;
      transform: rotate(-90deg);
      cursor: pointer;
      accent-color: #2980b9;
    }

    .btn-fit-bounds {
      background-color: #fff;
      width: 30px;
      height: 30px;
      position: relative;
      cursor: pointer;
      display: block;
      text-decoration: none;
    }
    .btn-fit-bounds svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #444;
      display: block;
    }
    .btn-fit-bounds:hover { background-color: #f4f4f4; }
    .btn-fit-bounds:hover svg { color: #000; }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="sheet-drag-buffer" id="sheetDragBuffer" aria-hidden="true"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle-zone" id="sheetHandle">
      <span class="sheet-handle" aria-hidden="true"></span>
    </div>

    <div class="sheet-summary" id="sheetSummary">
      <div class="summary-text" id="summaryText">Où souhaitez-vous aller ?</div>
      <div class="summary-actions">
        <button type="button" class="icon-btn" id="settingsBtn" title="Réglages" aria-label="Réglages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <a href="./index.html" class="icon-btn" title="Retour à l'accueil" aria-label="Retour à l'accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        </a>
      </div>
    </div>

    <!-- Zone épinglée : toujours visible, même en position basse -->
    <div class="sheet-pinned" id="sheetPinned">
      <button class="btn btn-primary btn-fixed" onclick="calculateRoute()">Calculer l'itinéraire</button>
      <div id="loading">Calcul de l'itinéraire en cours...</div>
    </div>

    <div class="sheet-body" id="sheetBody">

    <div class="route-card" id="points-container">
      <!-- DÉPART -->
      <div class="route-row">
        <span class="route-dot route-dot-start" aria-hidden="true"></span>
        <div class="input-group">
          <div class="input-row">
            <div class="input-with-clear">
              <input type="text" id="start-input" placeholder="Départ (clic carte ou recherche)" oninput="toggleClearBtn('start-input', 'start-clear')" />
              <button type="button" class="btn-clear-text" id="start-clear" onmousedown="handleClearClick(event, 'start', 'start-input', 'start-clear')">✕</button>
            </div>
            <button class="icon-btn icon-btn-ghost" onclick="useCurrentLocation()" title="Ma position actuelle" aria-label="Ma position actuelle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            </button>
          </div>
          <div id="start-suggestions" class="suggestions"></div>
        </div>
      </div>

      <!-- VIA POINTS (DYNAMIQUES) -->
      <div id="via-points"></div>

      <!-- ARRIVÉE -->
      <div class="route-row">
        <span class="route-dot route-dot-end" aria-hidden="true"></span>
        <div class="input-group">
          <div class="input-row">
            <div class="input-with-clear">
              <input type="text" id="end-input" placeholder="Arrivée (clic carte ou recherche)" oninput="toggleClearBtn('end-input', 'end-clear')" />
              <button type="button" class="btn-clear-text" id="end-clear" onmousedown="handleClearClick(event, 'end', 'end-input', 'end-clear')">✕</button>
            </div>
            <button class="icon-btn icon-btn-ghost" onclick="reverseFullRoute()" title="Inverser le trajet" aria-label="Inverser le trajet">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v14M8 17l-3.5-3.5M8 17l3.5-3.5"/><path d="M16 21V7M16 7l3.5 3.5M16 7l-3.5 3.5"/></svg>
            </button>
            <button class="icon-btn icon-btn-ghost" onclick="addViaPoint()" title="Ajouter une étape" aria-label="Ajouter une étape">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <div id="end-suggestions" class="suggestions"></div>
        </div>
      </div>
    </div>

    <div class="btn-grid">
      <input type="hidden" id="speed-limit-select" value="none" />
      <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">
        <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        Importer
      </button>
      <button class="btn btn-secondary" onclick="location.reload()" title="Remettre à zéro l'itinéraire">
        <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-5h5"/></svg>
        RAZ
      </button>
      <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importJSON(event)" />
    </div>

    <!-- Réglages avancés : repliés par défaut, ouverts via l'icône ⚙️ -->
    <div class="settings-panel" id="settingsPanel" hidden>
      <div class="option-row-label" style="margin-bottom:6px; font-size:0.78rem;">Moteur de recherche</div>
      <div class="segmented" id="geocoder-segmented" role="group" aria-label="Moteur de recherche">

        <button type="button" class="segmented-btn" data-speed="110" onclick="setSpeedLimit('110')">110</button>

      <div class="segmented" id="highways-segmented" role="group" aria-label="Préférence autoroutes">
        <button type="button" class="segmented-btn active" data-pref="autoriser" onclick="setAutoroutesPref('autoriser')">Autoriser</button>
        <button type="button" class="segmented-btn" data-pref="eviter" onclick="setAutoroutesPref('eviter')">Éviter</button>
        <button type="button" class="segmented-btn" data-pref="favoriser" onclick="setAutoroutesPref('favoriser')">Favoriser</button>
      </div>

      <label class="option-row" style="margin-top:8px;">
        <span class="option-row-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 17h16M6 17V9l6-4 6 4v8"/></svg>
          Éviter les péages
        </span>
        <span class="switch">
          <input type="checkbox" id="avoid-tolls-check" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>

    <div id="route-summary" style="display:none;">
      <div class="summary-divider"></div>
      <div id="route-stats"></div>

      <div class="btn-grid" style="margin-bottom: 8px;">
        <button class="btn btn-outline" onclick="exportGPX()">Télécharger GPX</button>
        <button class="btn btn-outline" onclick="exportJSON()">Télécharger JSON</button>
      </div>

      <button class="btn btn-send btn-pill" onclick="sendToRoadbook()">
        <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        Envoyer vers Roadbook VE
      </button>

      <div id="route-peage-detail"></div>

      <div class="instructions" id="instructions-list"></div>
    </div>
    </div>
  </div>

  <script>
    const STADIA_API_KEY = "bfd69906-9c31-4162-bfcc-f5fc463c4116";

    let currentGeocoder = 'photon';
    let ignoreNextMapClick = false;

    /* --- COÛT PÉAGE : source unique = la surcouche BD Carto elle-même ---
       Le fichier autoroutes_payantes_surcouche.geojson (sortie de
       generate_surcouche_geojson.py) est chargé tel quel par Leaflet, sans
       conversion topojson intermédiaire. Il ne contient QUE les tronçons
       payants, chacun avec un 'cout_troncon_eur' déjà figé - pas de tarif
       au km à appliquer côté app. Pas de fichier séparé à maintenir : la
       surcouche affichée sur la carte EST la source du calcul. */
    const TOLERANCE_MATCH_METRES = 40;    // distance max tracé <-> tronçon BD Carto pour considérer un "match"
    let tollIndex = null; // rempli par buildTollIndex() une fois la surcouche chargée

    /* Grille spatiale grossière pour ne comparer un point du tracé qu'aux
       tronçons payants réellement proches (évite de tester les ~10 000+
       tronçons de la surcouche à chaque point du tracé). */
    const GRID_CELL_DEG = 0.05; // ~5 km

    function cellKey(lng, lat) {
      return `${Math.floor(lng / GRID_CELL_DEG)}_${Math.floor(lat / GRID_CELL_DEG)}`;
    }

    function buildTollIndex(geoData) {
      const lines = [];
      const grid = new Map();

      function ajouterLigne(coords, cout, numero, idxOriginal, longueurKm) {
        if (!coords || coords.length < 2) return;
        let minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
        coords.forEach(([lng, lat]) => {
          if (lng < minLng) minLng = lng;
          if (lng > maxLng) maxLng = lng;
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
        });

        // idTroncon identifie le tronçon D'ORIGINE (une feature peut être
        // scindée en plusieurs lignes si MultiLineString) - sert à ne
        // compter son coût qu'UNE SEULE FOIS même si le tracé la traverse
        // sur plusieurs points/segments successifs.
        const idx = lines.length;
        lines.push({ coords, cout, numero, longueurKm, idTroncon: idxOriginal, turfLine: turf.lineString(coords) });

        const cx0 = Math.floor(minLng / GRID_CELL_DEG), cx1 = Math.floor(maxLng / GRID_CELL_DEG);
        const cy0 = Math.floor(minLat / GRID_CELL_DEG), cy1 = Math.floor(maxLat / GRID_CELL_DEG);
        for (let cx = cx0; cx <= cx1; cx++) {
          for (let cy = cy0; cy <= cy1; cy++) {
            const key = `${cx}_${cy}`;
            if (!grid.has(key)) grid.set(key, []);
            grid.get(key).push(idx);
          }
        }
      }

      geoData.features.forEach((feature, idxOriginal) => {
        const props = feature.properties || {};
        const cout = (props.cout_troncon_eur != null) ? props.cout_troncon_eur : 0;
        const numero = props.numero || props.autoroute || '?';
        const geom = feature.geometry;
        if (!geom) return;

        if (geom.type === 'LineString') {
          const longueurKm = turf.length(turf.lineString(geom.coordinates), { units: 'kilometers' });
          ajouterLigne(geom.coordinates, cout, numero, idxOriginal, longueurKm);
        } else if (geom.type === 'MultiLineString') {
          // MultiLineString : le coût du tronçon est réparti au prorata de
          // la longueur de chaque sous-ligne (rare en BD Carto, sécurité).
          const longueurs = geom.coordinates.map(c => turf.length(turf.lineString(c), { units: 'kilometers' }));
          const totalKm = longueurs.reduce((a, b) => a + b, 0) || 1;
          geom.coordinates.forEach((c, i) => {
            ajouterLigne(c, cout * (longueurs[i] / totalKm), numero, idxOriginal, longueurs[i]);
          });
        }
      });

      console.log(`✓ Index péage construit : ${lines.length} tronçons`);
      return { lines, grid };
    }

    /* Renvoie le tronçon payant le plus proche d'un point (lat, lng), ou
       null si aucun tronçon n'est présent dans son voisinage indexé. */
    function tollLeProchePoint(lat, lng) {
      if (!tollIndex || tollIndex.lines.length === 0) return null;

      const cx = Math.floor(lng / GRID_CELL_DEG);
      const cy = Math.floor(lat / GRID_CELL_DEG);
      const candidats = new Set();
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const key = `${cx + dx}_${cy + dy}`;
          const bucket = tollIndex.grid.get(key);
          if (bucket) bucket.forEach(i => candidats.add(i));
        }
      }
      if (candidats.size === 0) return null;

      const pt = turf.point([lng, lat]);
      let meilleur = null, meilleureDist = Infinity;
      candidats.forEach(idx => {
        const ligne = tollIndex.lines[idx];
        const d = turf.pointToLineDistance(pt, ligne.turfLine, { units: 'meters' });
        if (d < meilleureDist) { meilleureDist = d; meilleur = ligne; }
      });

      if (meilleureDist > TOLERANCE_MATCH_METRES) return null;
      return meilleur;
    }

    
    /* --- CALCUL DU COÛT PÉAGE PAR MATCHING GÉOMÉTRIQUE ---
       Pour chaque segment du tracé Valhalla, on cherche le tronçon payant le
       plus proche dans la surcouche BD Carto. On ne retient un tronçon que
       s'il a été matché sur au moins 2 points consécutifs du tracé (pas
       juste un point isolé) - protège contre un simple croisement ponctuel
       (pont, bretelle parallèle sur un instant) sans dépendre d'un seuil de
       distance absolu, dont on ne connaît pas la bonne valeur pour la
       granularité réelle des tronçons BD Carto (un seuil en distance mal
       calibré peut filtrer à tort de vrais péages courts). Aucun coût n'est
       calculé ici : chaque tronçon BD Carto porte déjà son propre
       cout_troncon_eur (figé lors de la génération du geojson). Aucun match
       retenu = segment gratuit (BD Carto fait foi). */
    const SEUIL_MATCH_NB_POINTS = 2; // au moins 2 points consécutifs matchés, pas juste 1

    function calculerCoutPeage(routeCoords) {
      if (!tollIndex) return { total: 0, detail: [], indexIndisponible: true };

      const matchsParTroncon = new Map(); // idTroncon -> { numero, cout, longueurKm, nbPoints }

      for (let i = 0; i < routeCoords.length - 1; i++) {
        const [lat1, lng1] = routeCoords[i];
        const [lat2, lng2] = routeCoords[i + 1];
        const midLat = (lat1 + lat2) / 2, midLng = (lng1 + lng2) / 2;

        const troncon = tollLeProchePoint(midLat, midLng);
        if (!troncon) continue;

        if (!matchsParTroncon.has(troncon.idTroncon)) {
          matchsParTroncon.set(troncon.idTroncon, {
            numero: troncon.numero, cout: troncon.cout,
            longueurKm: troncon.longueurKm || 0, nbPoints: 0
          });
        }
        matchsParTroncon.get(troncon.idTroncon).nbPoints += 1;
      }

      let total = 0;
      const parAutoroute = {}; // { "A6": { cout: 4.4, km: 23.1 } }
      matchsParTroncon.forEach(({ numero, cout, longueurKm, nbPoints }) => {
        if (nbPoints < SEUIL_MATCH_NB_POINTS) return; // point isolé, probable simple croisement -> ignoré

        total += cout;
        if (!parAutoroute[numero]) parAutoroute[numero] = { cout: 0, km: 0 };
        parAutoroute[numero].cout += cout;
        parAutoroute[numero].km += longueurKm;
      });

      const detail = Object.entries(parAutoroute)
        .map(([numero, v]) => ({ numero, cout: v.cout, km: v.km }))
        .sort((a, b) => b.cout - a.cout);

      return { total, detail };
    }

    function setGeocoder(engine) {
      currentGeocoder = engine;
      document.querySelectorAll('#geocoder-segmented .segmented-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.engine === engine);
      });
    }

    function setSpeedLimit(value) {
      document.getElementById('speed-limit-select').value = value;
      document.querySelectorAll('#speed-segmented .segmented-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.speed === value);
      });
    }

    // Préférence autoroutes : 3 états, cf. discussion sur use_highways/use_living_streets.
    // - autoriser  : comportement par défaut de Valhalla, rien n'est envoyé
    // - eviter     : use_highways à son minimum (évitement fort, courbe quadratique près de 0)
    // - favoriser  : use_highways à son maximum + use_living_streets abaissé sous son défaut
    //                (0.1 -> 0.0) pour un vrai effet, cf. discussion : envoyer 0.1 ne change
    //                rien puisque c'est déjà la valeur par défaut de Valhalla pour l'auto.
    let autoroutesPref = 'autoriser';
    function setAutoroutesPref(value) {
      autoroutesPref = value;
      document.querySelectorAll('#highways-segmented .segmented-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.pref === value);
      });
    }

    /* ===================== BOTTOM SHEET (haute / milieu / basse) ===================== */
    const sheet = document.getElementById('sheet');
    const mapEl = document.getElementById('map');
    const sheetHandleZone = document.getElementById('sheetHandle');
    const sheetDragBuffer = document.getElementById('sheetDragBuffer');
    const sheetSummary = document.getElementById('sheetSummary');
    const sheetPinned = document.getElementById('sheetPinned');
    let sheetState = 'mid';
    let mapReady = false; // la carte Leaflet n'existe pas encore à ce stade du script

    // "basse" = exactement la hauteur du contenu épinglé (poignée + résumé +
    // bouton Calculer), calculée dynamiquement pour ne jamais rien couper.
    function pinnedContentHeight() {
      return sheetHandleZone.offsetHeight + sheetSummary.offsetHeight + sheetPinned.offsetHeight;
    }

    function sheetHeightsPx() {
      const vh = window.innerHeight;
      return {
        low: pinnedContentHeight(),
        mid: Math.round(vh * 0.52),
        high: Math.max(vh - 4, 0) // la carte est quasi entièrement masquée
      };
    }

    // Le sheet ET la carte se complètent toujours exactement (pas de superposition) :
    // quand le sheet grandit, la carte rétrécit d'autant. Le buffer de préhension
    // reste collé juste au-dessus du sheet, quelle que soit sa hauteur.
    function applySheetHeight(px) {
      const vh = window.innerHeight;
      sheet.style.height = px + 'px';
      mapEl.style.height = Math.max(vh - px, 0) + 'px';
      sheetDragBuffer.style.bottom = px + 'px';
      if (mapReady) map.invalidateSize({ pan: false });
    }

    function setSheetState(state) {
      sheetState = state;
      applySheetHeight(sheetHeightsPx()[state]);
      sheet.dataset.state = state;
    }

    let sheetDrag = null;
    function startSheetDrag(e) {
      e.preventDefault(); // supprime les événements souris de compatibilité générés après un tap tactile
      ignoreNextMapClick = true; // évite qu'un clic fantôme retombe sur la carte après redimensionnement
      setTimeout(() => { ignoreNextMapClick = false; }, 400); // sécurité : ne bloque pas un vrai clic ultérieur
      sheetDrag = { startY: e.clientY, startHeight: sheet.getBoundingClientRect().height, moved: 0 };
      sheet.classList.add('dragging');
      e.currentTarget.setPointerCapture(e.pointerId);
    }
    sheetHandleZone.addEventListener('pointerdown', startSheetDrag);
    sheetDragBuffer.addEventListener('pointerdown', startSheetDrag);

    document.addEventListener('pointermove', (e) => {
      if (!sheetDrag) return;
      const dy = e.clientY - sheetDrag.startY;
      sheetDrag.moved = Math.max(sheetDrag.moved, Math.abs(dy));
      const h = sheetHeightsPx();
      const newHeight = Math.min(Math.max(sheetDrag.startHeight - dy, h.low), h.high);
      applySheetHeight(newHeight);
    });

    document.addEventListener('pointerup', () => {
      if (!sheetDrag) return;
      sheet.classList.remove('dragging');
      if (sheetDrag.moved < 6) {
        // Tap sur la poignée : fait défiler basse -> milieu -> haute -> basse
        const order = ['low', 'mid', 'high'];
        setSheetState(order[(order.indexOf(sheetState) + 1) % order.length]);
      } else {
        const currentHeight = sheet.getBoundingClientRect().height;
        const h = sheetHeightsPx();
        const nearest = Object.entries(h).sort((a, b) => Math.abs(a[1] - currentHeight) - Math.abs(b[1] - currentHeight))[0][0];
        setSheetState(nearest);
      }
      sheetDrag = null;
    });

    // Taper sur la barre résumé (hors boutons) remonte le sheet en position milieu s'il est en position basse
    sheetSummary.addEventListener('click', (e) => {
      if (e.target.closest('.icon-btn')) return;
      if (sheetState === 'low') setSheetState('mid');
    });

    window.addEventListener('resize', () => setSheetState(sheetState));

    // Réglages avancés (moteur de recherche) repliés par défaut
    document.getElementById('settingsBtn').addEventListener('click', () => {
      const panel = document.getElementById('settingsPanel');
      panel.hidden = !panel.hidden;
      if (!panel.hidden && sheetState === 'low') setSheetState('mid');
    });

    // Résumé compact de la barre du haut, mis à jour au fil de la saisie
    function updateSummaryText() {
      const el = document.getElementById('summaryText');
      if (document.getElementById('route-summary').style.display === 'block') return; // le résultat prime une fois calculé
      const startVal = document.getElementById('start-input').value.trim();
      const endVal = document.getElementById('end-input').value.trim();
      if (!startVal && !endVal) {
        el.innerHTML = 'Où souhaitez-vous aller ?';
      } else {
        el.innerHTML = `<span>${startVal || '<span class="muted">Départ</span>'}</span> → <span>${endVal || '<span class="muted">Arrivée</span>'}</span>`;
      }
    }
    document.getElementById('start-input').addEventListener('input', updateSummaryText);
    document.getElementById('end-input').addEventListener('input', updateSummaryText);

    // Position haute obligatoire dès qu'on tape dans un champ de recherche :
    // la carte se masque pour laisser toute la place au clavier + aux suggestions.
    document.addEventListener('focusin', (e) => {
      if (e.target.matches('input[type="text"]')) {
        setSheetState('high');
      }
    });

    const map = L.map('map', { minZoom: 2, maxZoom: 18 });
    mapReady = true;
    setSheetState('mid'); // dimensionne carte + sheet maintenant que Leaflet existe
    const franceBounds = L.latLngBounds([41.3, -5.2], [51.1, 9.6]);
    map.fitBounds(franceBounds, { padding: [10, 10] });

    const osmDeLayer = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
      minZoom: 2,
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    /* --- CREATION DU PANE POUR PÉAGES --- */
    map.createPane('tollPane');
    map.getPane('tollPane').style.zIndex = 350;

    /* --- SURCOUCHE TRONÇONS PAYANTS (GEOJSON, rendu Canvas) ---
       Rendu en Canvas plutôt que SVG (défaut Leaflet) : nettement plus
       rapide avec plusieurs milliers de tracés (un seul <canvas>, pas un
       <path> DOM par tronçon).
       Chargée À LA DEMANDE uniquement (pas au démarrage) : soit quand
       l'utilisateur active la couche "Routes payantes" dans le menu calques,
       soit dès qu'un calcul d'itinéraire a besoin du coût péage. */
    const tollLayer = L.geoJSON(null, {
      pane: 'tollPane',
      renderer: L.canvas({ pane: 'tollPane' }),
      style: {
        color: '#e74c3c',
        weight: 5,
        opacity: 0.9
      }
    });

    let tollDataLoaded = false;
    let tollDataLoadingPromise = null;

    function ensureTollDataLoaded() {
      if (tollDataLoadingPromise) return tollDataLoadingPromise;
      tollDataLoadingPromise = fetch('./autoroutes_payantes_surcouche.geojson')
        .then(res => {
          if (!res.ok) throw new Error("Fichier GeoJSON introuvable");
          return res.json();
        })
        .then(geoData => {
          tollLayer.addData(geoData);
          tollIndex = buildTollIndex(geoData);
          tollDataLoaded = true;
        })
        .catch(err => {
          console.warn("Surcouche péages non chargée :", err);
          tollDataLoadingPromise = null; // permet de retenter plus tard
        });
      return tollDataLoadingPromise;
    }

    /* --- CONTRÔLE DES CALQUES & ÉCHELLE --- */
    const baseLayers = { "OpenStreetMap.de": osmDeLayer };
    const overlayLayers = {
      "Routes payantes (Péages)": tollLayer
    };

    const layerControl = L.control.layers(baseLayers, overlayLayers, { 
      position: 'topright', 
      collapsed: true 
    }).addTo(map);

    // Chargement à la demande : dès que l'utilisateur coche "Routes payantes"
    map.on('overlayadd', (e) => {
      if (e.layer === tollLayer && !tollDataLoaded) {
        ensureTollDataLoaded().then(() => {
          if (tollLayer.getBounds().isValid()) {
            map.fitBounds(tollLayer.getBounds(), { padding: [20, 20] });
          }
        });
      }
    });

    const layerContainer = layerControl.getContainer();

    L.DomEvent.disableClickPropagation(layerContainer);
    L.DomEvent.disableScrollPropagation(layerContainer);

    layerContainer.addEventListener('pointerdown', (e) => {
      if (!layerContainer.classList.contains('leaflet-control-layers-expanded')) {
        ignoreNextMapClick = true;
      }
    });

    L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);

    /* --- BOUTON DE RECADRAGE AUTOMATIQUE --- */
    const FitBoundsControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function(map) {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        const button = L.DomUtil.create('a', 'btn-fit-bounds', container);
        
        button.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
          </svg>
        `;
        button.href = '#';
        button.title = "Recadrer sur l'itinéraire ou les marqueurs";

        L.DomEvent.disableClickPropagation(container);

        button.onclick = function(e) {
          e.preventDefault();
          fitMapToContent();
        };

        return container;
      }
    });
    map.addControl(new FitBoundsControl());

    function fitMapToContent() {
      if (routeLayer && routeLayer.getBounds().isValid()) {
        map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
        return;
      }

      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        if (group.getBounds().isValid()) {
          map.fitBounds(group.getBounds(), { padding: [50, 50], maxZoom: 15 });
          return;
        }
      }

      map.fitBounds(franceBounds, { padding: [10, 10] });
    }

    let routeOpacity = 0.85;
    const opacityControl = L.control({ position: 'topleft' });
    opacityControl.onAdd = function() {
      const container = L.DomUtil.create('div', 'leaflet-bar');
      const div = L.DomUtil.create('div', 'btn-opacity-slider', container);
      div.title = "Opacité de la surcouche péages";
      div.innerHTML = `
        <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="${routeOpacity}" orient="vertical" aria-label="Opacité de la surcouche péages">
      `;
      L.DomEvent.disableClickPropagation(container);
      return container;
    };
    opacityControl.addTo(map);

    document.getElementById('opacity-slider').addEventListener('input', (e) => {
      routeOpacity = parseFloat(e.target.value);
      if (routeLayer) routeLayer.setStyle({ opacity: routeOpacity });
    });

    let routePoints = { start: null, end: null, vias: [] };
    let markers = [];
    let routeLayer = null;
    let decodedRouteCoords = [];
    let routeSummary = null;
    let routeLegs = [];
    let rawValhallaResponse = null;

    function closeAllSuggestions() {
      document.querySelectorAll('.suggestions').forEach(el => el.innerHTML = '');
      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        document.activeElement.blur();
      }
    }

    map.on('movestart dragstart', closeAllSuggestions);
    document.getElementById('sheetBody').addEventListener('scroll', closeAllSuggestions, { passive: true });

    map.on('click', function(e) {
      closeAllSuggestions();

      if (layerContainer.classList.contains('leaflet-control-layers-expanded')) {
        layerControl.collapse();
        ignoreNextMapClick = false;
        return;
      }

      if (ignoreNextMapClick) {
        ignoreNextMapClick = false;
        return;
      }

      const latlng = e.latlng;
      const coordsString = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;

      if (!routePoints.start) {
        setPoint('start', latlng, coordsString);
      } else if (!routePoints.end) {
        setPoint('end', latlng, coordsString);
      } else {
        addViaPoint(latlng);
      }
    });

    function setPoint(type, latlng, label) {
      routePoints[type] = latlng;
      if (type === 'start') {
        document.getElementById('start-input').value = label;
        toggleClearBtn('start-input', 'start-clear');
      }
      if (type === 'end') {
        document.getElementById('end-input').value = label;
        toggleClearBtn('end-input', 'end-clear');
      }
      updateMarkers();
      if (typeof updateSummaryText === 'function') updateSummaryText();
      if (sheetState === 'high') setSheetState('mid');
    }

    function toggleClearBtn(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (input && btn) {
        btn.style.display = input.value.length > 0 ? 'block' : 'none';
      }
    }

    function handleClearClick(e, type, inputId, btnId) {
      e.preventDefault();
      
      const input = document.getElementById(inputId);
      if (input) {
        input.value = '';
        input.blur();
      }
      
      toggleClearBtn(inputId, btnId);
      closeAllSuggestions();
      
      if (type === 'start') {
        routePoints.start = null;
      } else if (type === 'end') {
        routePoints.end = null;
      } else if (typeof type === 'number') {
        routePoints.vias[type] = null;
      }
      
      updateMarkers();
    }

    function useCurrentLocation() {
      if (!navigator.geolocation) {
        alert("La géolocalisation n'est pas supportée par votre navigateur.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const latlng = L.latLng(position.coords.latitude, position.coords.longitude);
          const coordsString = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
          setPoint('start', latlng, coordsString);
          map.setView(latlng, 14);
        },
        (error) => alert(`Erreur de géolocalisation : ${error.message}`),
        { enableHighAccuracy: true }
      );
    }

    // Variante Promise, sans recentrage carte (calculateRoute recadre déjà sur
    // tout le trajet une fois calculé - un setView ici ferait un saut inutile).
    // Utilisée pour pré-remplir automatiquement le départ quand seule
    // l'arrivée a été renseignée.
    function resolveStartFromCurrentLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("La géolocalisation n'est pas supportée par votre navigateur."));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const latlng = L.latLng(position.coords.latitude, position.coords.longitude);
            const coordsString = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
            setPoint('start', latlng, coordsString); // remplit visiblement le champ, pas de magie silencieuse
            resolve(latlng);
          },
          (error) => {
            const messages = {
              1: "Localisation refusée. Renseignez un départ manuellement.",
              2: "Position indisponible. Renseignez un départ manuellement.",
              3: "La localisation a pris trop de temps. Renseignez un départ manuellement."
            };
            reject(new Error(messages[error.code] || "Impossible de vous localiser. Renseignez un départ manuellement."));
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      });
    }

    function addViaPoint(latlng = null) {
      routePoints.vias.push(latlng);
      renderViaInputs();
      updateMarkers();
    }

    /* --- Glisser-déposer pour réordonner les étapes (Pointer Events : souris + tactile) --- */
    let dragState = null;

    function initViaDrag(row) {
      const handle = row.querySelector('.drag-handle');
      handle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        dragState = { rowEl: row, pointerId: e.pointerId };
        row.classList.add('dragging');
        handle.setPointerCapture(e.pointerId);
      });
    }

    document.addEventListener('pointermove', (e) => {
      if (!dragState) return;
      const container = document.getElementById('via-points');
      const rows = Array.from(container.querySelectorAll('.route-row'));
      const overRow = rows.find(r => {
        if (r === dragState.rowEl) return false;
        const rect = r.getBoundingClientRect();
        return e.clientY >= rect.top && e.clientY <= rect.bottom;
      });
      rows.forEach(r => r.classList.remove('drag-over'));
      if (overRow) {
        const rect = overRow.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        container.insertBefore(dragState.rowEl, before ? overRow : overRow.nextSibling);
      }
    });

    document.addEventListener('pointerup', (e) => {
      if (!dragState) return;
      dragState.rowEl.classList.remove('dragging');

      const container = document.getElementById('via-points');
      const newOrder = Array.from(container.querySelectorAll('.route-row'))
        .map(r => routePoints.vias[parseInt(r.dataset.viaIndex, 10)]);
      routePoints.vias = newOrder;
      dragState = null;
      renderViaInputs();
      updateMarkers();
    });

    function renderViaInputs() {
      const container = document.getElementById('via-points');
      container.innerHTML = '';

      routePoints.vias.forEach((v, index) => {
        const row = document.createElement('div');
        row.className = 'route-row';
        const coordsStr = v ? `${v.lat.toFixed(5)}, ${v.lng.toFixed(5)}` : '';

        row.dataset.viaIndex = index;
        row.innerHTML = `
          <span class="drag-handle" title="Glisser pour réordonner">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
          </span>
          <span class="route-dot route-dot-via" aria-hidden="true">${index + 1}</span>
          <div class="input-group">
            <div class="input-row">
              <div class="input-with-clear">
                <input type="text" id="via-input-${index}" placeholder="Étape N°${index + 1}" value="${coordsStr}" oninput="toggleClearBtn('via-input-${index}', 'via-clear-${index}')">
                <button type="button" class="btn-clear-text" id="via-clear-${index}" onmousedown="handleClearClick(event, ${index}, 'via-input-${index}', 'via-clear-${index}')">✕</button>
              </div>
              <button class="icon-btn icon-btn-ghost icon-btn-sm" onclick="removeVia(${index})" title="Supprimer l'étape" aria-label="Supprimer l'étape">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
              </button>
            </div>
            <div id="via-suggestions-${index}" class="suggestions"></div>
          </div>
        `;
        container.appendChild(row);
        initViaDrag(row);

        toggleClearBtn(`via-input-${index}`, `via-clear-${index}`);

        setupAutocomplete(document.getElementById(`via-input-${index}`), document.getElementById(`via-suggestions-${index}`), (coords, name) => {
          routePoints.vias[index] = coords;
          document.getElementById(`via-input-${index}`).value = name;
          toggleClearBtn(`via-input-${index}`, `via-clear-${index}`);
          updateMarkers();
          map.setView(coords, 14);
          if (sheetState === 'high') setSheetState('mid');
        });
      });
    }

    function removeVia(index) {
      routePoints.vias.splice(index, 1);
      renderViaInputs();
      updateMarkers();
    }

    function reverseFullRoute() {
      const tempStart = routePoints.start;
      const startVal = document.getElementById('start-input').value;

      routePoints.start = routePoints.end;
      document.getElementById('start-input').value = document.getElementById('end-input').value;

      routePoints.end = tempStart;
      document.getElementById('end-input').value = startVal;

      routePoints.vias.reverse();

      toggleClearBtn('start-input', 'start-clear');
      toggleClearBtn('end-input', 'end-clear');
      renderViaInputs();
      updateMarkers();
    }

    function createPinIcon(label, color) {
      const svg = `
        <div class="pin-marker">
          <svg viewBox="0 0 384 512">
            <path fill="${color}" stroke="#ffffff" stroke-width="20" d="M172.268 501.67C26.97 291.03 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.03-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0z"/>
          </svg>
          <div class="pin-label">${label}</div>
        </div>
      `;
      return L.divIcon({
        className: 'custom-pin-icon',
        html: svg,
        iconSize: [32, 42],
        iconAnchor: [16, 42],
        popupAnchor: [0, -38]
      });
    }

    function updateMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      if (routePoints.start) {
        const m = L.marker(routePoints.start, { icon: createPinIcon('D', '#2ecc71'), draggable: true }).addTo(map).bindPopup("Départ");
        m.on('dragend', function(e) {
          const latlng = e.target.getLatLng();
          const coordsStr = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
          setPoint('start', latlng, coordsStr);
        });
        markers.push(m);
      }

      routePoints.vias.forEach((v, i) => {
        if (v) {
          const m = L.marker(v, { icon: createPinIcon(i + 1, '#e67e22'), draggable: true }).addTo(map).bindPopup(`Étape N°${i + 1}`);
          m.on('dragend', function(e) {
            const latlng = e.target.getLatLng();
            routePoints.vias[i] = latlng;
            const input = document.getElementById(`via-input-${i}`);
            if (input) {
              input.value = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
              toggleClearBtn(`via-input-${i}`, `via-clear-${i}`);
            }
          });
          markers.push(m);
        }
      });

      if (routePoints.end) {
        const m = L.marker(routePoints.end, { icon: createPinIcon('A', '#e74c3c'), draggable: true }).addTo(map).bindPopup("Arrivée");
        m.on('dragend', function(e) {
          const latlng = e.target.getLatLng();
          const coordsStr = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
          setPoint('end', latlng, coordsStr);
        });
        markers.push(m);
      }
    }

    function setupAutocomplete(inputEl, suggestionsEl, onSelect) {
      let timer;
      inputEl.addEventListener('input', () => {
        clearTimeout(timer);
        const query = inputEl.value.trim();
        if (query.length < 3) { suggestionsEl.innerHTML = ''; return; }

        timer = setTimeout(() => {
          const center = map.getCenter();
          const currentZoom = map.getZoom();

          let url = "";
          if (currentGeocoder === 'ban') {
            url = `https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(query)}&lat=${center.lat}&lon=${center.lng}&limit=5`;
          } else {
            url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=-5.2,41.3,9.6,51.1&lat=${center.lat}&lon=${center.lng}&zoom=${currentZoom}&lang=fr&limit=5`;
          }

          fetch(url)
            .then(res => res.json())
            .then(data => {
              suggestionsEl.innerHTML = '';
              if (!data.features || data.features.length === 0) return;

              data.features.forEach(feature => {
                const props = feature.properties;
                const div = document.createElement('div');
                div.className = 'suggestion-item';

                let mainName = "";
                let city = "";
                let postcode = "";
                let lat, lng;

                if (currentGeocoder === 'ban') {
                  mainName = props.name || props.label;
                  city = props.city || '';
                  postcode = props.postcode ? `(${props.postcode})` : '';
                  [lng, lat] = feature.geometry.coordinates;
                } else {
                  mainName = props.name || props.street || '';
                  if (props.street && props.name && props.name !== props.street) {
                    mainName += ` (${props.street})`;
                  }
                  city = props.city || props.town || props.village || '';
                  postcode = props.postcode ? `(${props.postcode})` : '';
                  [lng, lat] = feature.geometry.coordinates;
                }

                div.innerHTML = `<strong>${mainName}</strong> <small style="color:#666; margin-left:5px;">${city} ${postcode}</small>`;

                div.onclick = (e) => {
                  e.stopPropagation();
                  const fullLabel = [props.name || props.street || props.label, city].filter(Boolean).join(', ');
                  
                  onSelect(L.latLng(lat, lng), fullLabel);
                  suggestionsEl.innerHTML = '';
                  inputEl.blur();
                };
                suggestionsEl.appendChild(div);
              });
            })
            .catch(() => {});
        }, 300);
      });
    }

    setupAutocomplete(document.getElementById('start-input'), document.getElementById('start-suggestions'), (coords, name) => {
      setPoint('start', coords, name);
      toggleClearBtn('start-input', 'start-clear');
      map.setView(coords, 14);
    });

    setupAutocomplete(document.getElementById('end-input'), document.getElementById('end-suggestions'), (coords, name) => {
      setPoint('end', coords, name);
      toggleClearBtn('end-input', 'end-clear');
      map.setView(coords, 14);
    });

    // Arrondit à ~2 chiffres significatifs (ex: 24.10 -> 24, 4.42 -> 4.4, 0.85 -> 0.85)
    // cohérent avec le total péage arrondi à l'entier supérieur : c'est une estimation, pas un montant exact.
    function formatSig2(n) {
      if (n === 0) return '0';
      return Number(n.toPrecision(2)).toString();
    }

    function formatDuration(totalSeconds) {
      const totalMinutes = Math.round(totalSeconds / 60);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return hours > 0 ? `${hours} h ${minutes > 0 ? minutes + ' min' : ''}`.trim() : `${minutes} min`;
    }

    async function calculateRoute() {
      if (!routePoints.end) {
        alert("Veuillez sélectionner au moins une arrivée.");
        return;
      }

      if (!routePoints.start) {
        const loadingEl = document.getElementById('loading');
        loadingEl.textContent = 'Localisation de votre position...';
        loadingEl.style.display = 'block';
        try {
          await resolveStartFromCurrentLocation();
        } catch (err) {
          loadingEl.style.display = 'none';
          loadingEl.textContent = "Calcul de l'itinéraire en cours...";
          alert(err.message);
          return;
        }
        loadingEl.textContent = "Calcul de l'itinéraire en cours...";
      }

      ensureTollDataLoaded(); // en parallèle : dispo pour le calcul du coût péage même sans afficher la couche

      document.getElementById('loading').style.display = 'block';
      document.getElementById('route-summary').style.display = 'none';

      const locations = [
        { lat: routePoints.start.lat, lon: routePoints.start.lng, type: "break" },
        ...routePoints.vias.filter(v => v !== null).map(v => ({ lat: v.lat, lon: v.lng, type: "through" })),
        { lat: routePoints.end.lat, lon: routePoints.end.lng, type: "break" }
      ];

      const autoOptions = {};
      const speedVal = document.getElementById('speed-limit-select').value;
      if (speedVal !== 'none') autoOptions.top_speed = parseInt(speedVal, 10);
      if (autoroutesPref === 'eviter') {
        autoOptions.use_highways = 0.0;
      } else if (autoroutesPref === 'favoriser') {
        autoOptions.use_highways = 1.0;
        autoOptions.use_living_streets = 0.0;
      }
      if (document.getElementById('avoid-tolls-check').checked) {
        autoOptions.use_tolls = 0.0;
        autoOptions.toll_booth_penalty = 43200;
      }

      const payload = {
        locations: locations,
        costing: "auto",
        costing_options: { auto: autoOptions },
        directions_options: { language: "fr-FR" }
      };

      try {
        const response = await fetch(`https://api.stadiamaps.com/route/v1?api_key=${STADIA_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok || !data.trip) throw new Error(data.status_message || "Impossible de calculer l'itinéraire.");

        rawValhallaResponse = data;
        processValhallaResponse(data);
      } catch (error) {
        alert(`Erreur : ${error.message}`);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function processValhallaResponse(data) {
      routeSummary = data.trip.summary;
      routeLegs = data.trip.legs;
      decodedRouteCoords = [];

      routeLegs.forEach(leg => {
        decodedRouteCoords = decodedRouteCoords.concat(decodePolyline(leg.shape, 6));
      });

      if (routeLayer) map.removeLayer(routeLayer);
      routeLayer = L.polyline(decodedRouteCoords, { color: '#2980b9', weight: 6, opacity: routeOpacity }).addTo(map);

      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
      displayInstructions();
    }

    function displayInstructions() {
      const summaryDiv = document.getElementById('route-summary');
      const statsDiv = document.getElementById('route-stats');
      const listDiv = document.getElementById('instructions-list');

      const peage = calculerCoutPeage(decodedRouteCoords);
      const evitementActif = document.getElementById('avoid-tolls-check').checked;
      const peageValue = peage.indexIndisponible
        ? 'N/D'
        : (evitementActif ? 'Sans péage' : (peage.total > 0.01 ? `${Math.ceil(peage.total)} €` : 'Gratuit'));

      statsDiv.innerHTML = `
        <div class="stats-row">
          <div class="stat-block">
            <div class="stat-label">Distance</div>
            <div class="stat-value">${routeSummary.length.toFixed(1)} km</div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Durée</div>
            <div class="stat-value">${formatDuration(routeSummary.time)}</div>
          </div>
          <div class="stat-block stat-toll">
            <div class="stat-label">Péage</div>
            <div class="stat-value">${peageValue}</div>
          </div>
        </div>
      `;

      const detailEl = document.getElementById('route-peage-detail');
      if (peage.detail.length > 0) {
        const noteResiduel = evitementActif
          ? '⚠️ Résiduel malgré "Éviter les péages" (probablement en flux libre, non détectable par Valhalla) : '
          : '';
        const detailStr = peage.detail
          .map(d => {
            const coutParKm = d.km > 0 ? d.cout / d.km : 0;
            return `${d.numero === '?' ? 'segment non identifié' : d.numero}: ${d.km.toFixed(1)} km à péage (${coutParKm.toFixed(2)} €/km) → ${formatSig2(d.cout)} €`;
          })
          .join(' · ');
        detailEl.textContent = noteResiduel + detailStr;
        detailEl.style.display = 'block';
      } else {
        detailEl.textContent = '';
        detailEl.style.display = 'none';
      }

      listDiv.innerHTML = '';

      let cumulatedKm = 0;
      routeLegs.forEach((leg) => {
        leg.maneuvers.forEach((step) => {
          const item = document.createElement('div');
          item.className = 'step-item';
          const distMeters = Math.round(step.length * 1000);
          const distStr = distMeters >= 1000 ? `${(distMeters / 1000).toFixed(1)} km` : `${distMeters} m`;
          item.innerHTML = `
            <span class="step-dot"></span>
            <span class="step-text">${step.instruction}</span>
            <span class="step-dist">${distStr}</span>
          `;
          listDiv.appendChild(item);
          cumulatedKm += step.length;
        });
      });

      summaryDiv.style.display = 'block';

      // Barre résumée compacte : passe du prompt "Où allez-vous ?" au résultat du trajet
      const summaryText = document.getElementById('summaryText');
      summaryText.innerHTML = `${routeSummary.length.toFixed(1)} km · ${formatDuration(routeSummary.time)}` +
        (!evitementActif && peage.total > 0.01 ? ` · <span style="color:var(--accent)">${Math.ceil(peage.total)} €</span>` : '');

      // Le résultat prime : on repasse en position milieu (résultats + carte visibles) et on amène les résultats en vue
      if (sheetState === 'low' || sheetState === 'high') setSheetState('mid');
      setTimeout(() => summaryDiv.scrollIntoView({ block: 'start', behavior: 'smooth' }), 150);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.trip && data.trip.locations) {
            rawValhallaResponse = data;
            const locs = data.trip.locations;
            
            const startLoc = locs[0];
            const endLoc = locs[locs.length - 1];

            setPoint('start', L.latLng(startLoc.lat, startLoc.lon), `${startLoc.lat.toFixed(5)}, ${startLoc.lon.toFixed(5)}`);
            setPoint('end', L.latLng(endLoc.lat, endLoc.lon), `${endLoc.lat.toFixed(5)}, ${endLoc.lon.toFixed(5)}`);
            
            routePoints.vias = locs.slice(1, -1).map(l => L.latLng(l.lat, l.lon));
            renderViaInputs();
            processValhallaResponse(data);
          } else {
            throw new Error("Format non supporté.");
          }
        } catch (err) {
          alert(`Erreur d'importation : ${err.message}`);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function exportGPX() {
      if (!decodedRouteCoords || decodedRouteCoords.length === 0) return;
      let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="GeoRouter"><trk><name>Itinéraire</name><trkseg>\n`;
      decodedRouteCoords.forEach(c => gpx += `  <trkpt lat="${c[0]}" lon="${c[1]}"></trkpt>\n`);
      gpx += `</trkseg></trk></gpx>`;

      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'itineraire.gpx';
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportJSON() {
      if (!rawValhallaResponse) return;
      const blob = new Blob([JSON.stringify(rawValhallaResponse, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'itineraire.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    // --- PONT DE COMMUNICATION VERS ROADBOOK VE (via localStorage) ---
    const HANDOFF_KEY = 'current_route_data';

    function sendToRoadbook() {
      if (!rawValhallaResponse) {
        alert("Veuillez d'abord calculer un itinéraire avant de l'envoyer vers Roadbook VE.");
        return;
      }
      try {
        const payload = {
          type: 'json',
          filename: 'itineraire.json',
          content: JSON.stringify(rawValhallaResponse),
          source: 'georouter',
          ts: Date.now()
        };
        localStorage.setItem(HANDOFF_KEY, JSON.stringify(payload));
        window.location.href = './roadbook.html';
      } catch (err) {
        alert("Impossible de transmettre l'itinéraire (stockage local plein ou indisponible) : " + err.message);
      }
    }

    function decodePolyline(str, precision) {
      let index = 0, lat = 0, lng = 0, coordinates = [], shift = 0, result = 0, byte = null;
      let factor = Math.pow(10, precision || 5);
      while (index < str.length) {
        byte = null; shift = 0; result = 0;
        do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
        let latitude = ((result & 1) ? ~(result >> 1) : (result >> 1));
        lat += latitude; shift = 0; result = 0;
        do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
        let longitude = ((result & 1) ? ~(result >> 1) : (result >> 1));
        lng += longitude;
        coordinates.push([lat / factor, lng / factor]);
      }
      return coordinates;
    }
  </script>
