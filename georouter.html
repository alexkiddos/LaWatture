<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <title>GeoRouter - Valhalla (Stadia Maps)</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Turf.js pour le matching géométrique tracé <-> tronçons payants (calcul du péage) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc; --text: #2c3e50; --muted: #999; --border: #e0e0e0;
      --card-bg: #ffffff; --input-bg: #ffffff; --input-border: #ccc;
      --options-bg: #f8f9fa; --options-border: #e9ecef;
      --hover-bg: #e8f4fc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212; --text: #e5e7eb; --muted: #9ca3af; --border: #333333;
        --card-bg: #18181b; --input-bg: #18181b; --input-border: #3f3f46;
        --options-bg: #1e293b; --options-border: #334155;
        --hover-bg: #1e3a4f;
      }
    }

    * { box-sizing: border-box; }
    
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
    }
    
    #map {
      height: 50vh;
      height: 50svh;
      width: 100%;
      z-index: 1;
      position: relative;
    }

    .panel {
      height: 50vh;
      height: 50svh;
      width: 100%;
      z-index: 2;
      background: var(--card-bg);
      color: var(--text);
      padding: 12px;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    h2 { margin: 0 0 2px 0; font-size: 1.05rem; color: var(--text); }
    
    .input-group { position: relative; display: flex; flex-direction: column; gap: 4px; }
    .input-row { display: flex; gap: 6px; align-items: center; }
    
    .input-with-clear {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      font-size: 0.9rem;
      background-color: var(--input-bg);
      color: var(--text);
    }

    .input-with-clear input {
      padding-right: 30px;
    }

    .btn-clear-text {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 50%;
      display: none;
      line-height: 1;
      touch-action: manipulation;
    }
    .btn-clear-text:active { background-color: var(--options-bg); color: var(--text); }

    .btn-remove-step {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
      border-radius: 6px;
      padding: 7px 9px;
      cursor: pointer;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .btn-remove-step:active { background-color: #e53935; color: white; }

    .options-row {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--options-bg);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--options-border);
      justify-content: space-between;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      color: var(--text);
    }

    .btn-toggle-api {
      background: var(--options-bg);
      border: 1px solid var(--options-border);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .btn-toggle-api:active {
      background: var(--hover-bg);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 1001;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      -webkit-overflow-scrolling: touch;
    }
    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      -webkit-tap-highlight-color: rgba(52, 152, 219, 0.2);
      user-select: none;
    }
    .suggestion-item:active { background: var(--hover-bg); }

    .btn-grid {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      transition: background 0.2s;
      flex: 1;
      text-align: center;
    }
    .btn-primary { background: #3498db; color: white; }
    .btn-primary:hover { background: #2980b9; }
    .btn-success { background: #2ecc71; color: white; }
    .btn-success:hover { background: #27ae60; }
    .btn-info { background: #8e44ad; color: white; }
    .btn-info:hover { background: #732d91; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--input-border); }
    .btn-secondary:hover, .btn-secondary:active { background: var(--hover-bg); }
    .btn-secondary:disabled { opacity: 0.4; cursor: default; }
    .btn-warning { background: #f39c12; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn-icon { padding: 8px; flex: initial; width: 38px; display: inline-flex; align-items: center; justify-content: center; }

    .instructions {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .step-item { font-size: 0.8rem; padding: 5px 0; border-bottom: 1px dashed var(--border); color: var(--text); }
    #loading { display: none; color: #e67e22; font-weight: bold; font-size: 0.85rem; text-align: center; }

    .pin-marker {
      position: relative;
      width: 32px;
      height: 42px;
    }
    .pin-marker svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.4));
    }
    .pin-label {
      position: absolute;
      top: 7px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 13px;
      pointer-events: none;
    }

    .leaflet-control-opacity {
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 8px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      font-size: 0.75rem;
      font-weight: bold;
      color: #333;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px !important;
    }
    .leaflet-control-opacity input[type="range"] {
      width: 85px;
      cursor: pointer;
    }

    .btn-fit-bounds {
      background-color: #fff;
      width: 30px;
      height: 30px;
      position: relative;
      cursor: pointer;
      display: block;
      text-decoration: none;
    }
    .btn-fit-bounds svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #444;
      display: block;
    }
    .btn-fit-bounds:hover { background-color: #f4f4f4; }
    .btn-fit-bounds:hover svg { color: #000; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="panel" id="ui-panel">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <h2>GeoRouter (Valhalla)</h2>
      <a href="./index.html" class="btn btn-secondary btn-icon" title="Retour à l'accueil" style="text-decoration:none; flex-shrink:0;">🏠</a>
    </div>

    <div id="points-container">
      <!-- DÉPART -->
      <div class="input-group">
        <div class="input-row">
          <div class="input-with-clear">
            <input type="text" id="start-input" placeholder="Départ (clic carte ou recherche)" oninput="toggleClearBtn('start-input', 'start-clear')" />
            <button type="button" class="btn-clear-text" id="start-clear" onmousedown="handleClearClick(event, 'start', 'start-input', 'start-clear')">✕</button>
          </div>
          <button class="btn btn-secondary btn-icon" onclick="useCurrentLocation()" title="Ma position actuelle">📍</button>
        </div>
        <div id="start-suggestions" class="suggestions"></div>
      </div>

      <!-- VIA POINTS (DYNAMIQUES) -->
      <div id="via-points"></div>

      <!-- ARRIVÉE -->
      <div class="input-group" style="margin-top:4px;">
        <div class="input-row">
          <div class="input-with-clear">
            <input type="text" id="end-input" placeholder="Arrivée (clic carte ou recherche)" oninput="toggleClearBtn('end-input', 'end-clear')" />
            <button type="button" class="btn-clear-text" id="end-clear" onmousedown="handleClearClick(event, 'end', 'end-input', 'end-clear')">✕</button>
          </div>
        </div>
        <div id="end-suggestions" class="suggestions"></div>
      </div>
    </div>

    <!-- Options Réseau & Recherche Ultra-Compactes -->
    <div class="options-row">
      <div class="option-item">
        <span>API:</span>
        <button type="button" id="api-toggle-btn" class="btn-toggle-api" onclick="toggleApiEngine()">Photon</button>
      </div>

      <div class="option-item">
        <span>Vmax:</span>
        <select id="speed-limit-select" style="padding: 2px 4px; font-size: 0.78rem; width: auto;">
          <option value="none">Libre</option>
          <option value="120">120</option>
          <option value="110">110</option>
          <option value="100">100</option>
          <option value="90">90</option>
        </select>
      </div>

      <div class="option-item">
        <label class="checkbox-label">
          <input type="checkbox" id="avoid-tolls-check" />
          Sans péage
        </label>
      </div>
    </div>

    <div class="btn-grid">
      <button class="btn btn-secondary" onclick="addViaPoint()">+ Étape</button>
      <button class="btn btn-warning" onclick="reverseFullRoute()" title="Inverser tout">🔄 Inverser</button>
      <button class="btn btn-info" onclick="document.getElementById('import-file').click()">📂 Importer</button>
      <button class="btn btn-danger" onclick="location.reload()" title="Remettre à zéro l'itinéraire">🔄 RAZ</button>
      <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importJSON(event)" />
    </div>

    <button class="btn btn-primary" onclick="calculateRoute()">Calculer l'itinéraire</button>
    <div id="loading">Calcul de l'itinéraire en cours...</div>

    <div id="route-summary" style="display:none;">
      <hr style="margin: 8px 0; border: 0; border-top: 1px solid #ccc;" />
      <div id="route-stats" style="font-weight: bold; margin-bottom: 6px; font-size: 0.9rem;"></div>
      
      <div class="btn-grid" style="margin-bottom: 8px;">
        <button class="btn btn-success" onclick="exportGPX()">Télécharger GPX</button>
        <button class="btn btn-info" onclick="exportJSON()">Télécharger JSON</button>
      </div>

      <button class="btn btn-primary" style="background:#16a34a; width:100%; margin-bottom:4px;" onclick="sendToRoadbook()">🚀 Envoyer vers Roadbook VE</button>
      
      <div class="instructions" id="instructions-list"></div>
    </div>
  </div>

  <script>
    const STADIA_API_KEY = "bfd69906-9c31-4162-bfcc-f5fc463c4116";

    let currentGeocoder = 'photon';
    let ignoreNextMapClick = false;

    /* --- COÛT PÉAGE : source unique = la surcouche BD Carto elle-même ---
       Le fichier autoroutes_payantes_surcouche.geojson (sortie de
       generate_surcouche_geojson.py) est chargé tel quel par Leaflet, sans
       conversion topojson intermédiaire. Il ne contient QUE les tronçons
       payants, chacun avec un 'cout_troncon_eur' déjà figé - pas de tarif
       au km à appliquer côté app. Pas de fichier séparé à maintenir : la
       surcouche affichée sur la carte EST la source du calcul. */
    const TOLERANCE_MATCH_METRES = 40;    // distance max tracé <-> tronçon BD Carto pour considérer un "match"
    let tollIndex = null; // rempli par buildTollIndex() une fois la surcouche chargée

    /* Grille spatiale grossière pour ne comparer un point du tracé qu'aux
       tronçons payants réellement proches (évite de tester les ~10 000+
       tronçons de la surcouche à chaque point du tracé). */
    const GRID_CELL_DEG = 0.05; // ~5 km

    function cellKey(lng, lat) {
      return `${Math.floor(lng / GRID_CELL_DEG)}_${Math.floor(lat / GRID_CELL_DEG)}`;
    }

    function buildTollIndex(geoData) {
      const lines = [];
      const grid = new Map();

      function ajouterLigne(coords, cout, numero, idxOriginal) {
        if (!coords || coords.length < 2) return;
        let minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
        coords.forEach(([lng, lat]) => {
          if (lng < minLng) minLng = lng;
          if (lng > maxLng) maxLng = lng;
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
        });

        // idTroncon identifie le tronçon D'ORIGINE (une feature peut être
        // scindée en plusieurs lignes si MultiLineString) - sert à ne
        // compter son coût qu'UNE SEULE FOIS même si le tracé la traverse
        // sur plusieurs points/segments successifs.
        const idx = lines.length;
        lines.push({ coords, cout, numero, idTroncon: idxOriginal, turfLine: turf.lineString(coords) });

        const cx0 = Math.floor(minLng / GRID_CELL_DEG), cx1 = Math.floor(maxLng / GRID_CELL_DEG);
        const cy0 = Math.floor(minLat / GRID_CELL_DEG), cy1 = Math.floor(maxLat / GRID_CELL_DEG);
        for (let cx = cx0; cx <= cx1; cx++) {
          for (let cy = cy0; cy <= cy1; cy++) {
            const key = `${cx}_${cy}`;
            if (!grid.has(key)) grid.set(key, []);
            grid.get(key).push(idx);
          }
        }
      }

      geoData.features.forEach((feature, idxOriginal) => {
        const props = feature.properties || {};
        const cout = (props.cout_troncon_eur != null) ? props.cout_troncon_eur : 0;
        const numero = props.numero || props.autoroute || '?';
        const geom = feature.geometry;
        if (!geom) return;

        if (geom.type === 'LineString') {
          ajouterLigne(geom.coordinates, cout, numero, idxOriginal);
        } else if (geom.type === 'MultiLineString') {
          // MultiLineString : le coût du tronçon est réparti au prorata de
          // la longueur de chaque sous-ligne (rare en BD Carto, sécurité).
          const longueurs = geom.coordinates.map(c => turf.length(turf.lineString(c), { units: 'kilometers' }));
          const totalKm = longueurs.reduce((a, b) => a + b, 0) || 1;
          geom.coordinates.forEach((c, i) => {
            ajouterLigne(c, cout * (longueurs[i] / totalKm), numero, idxOriginal);
          });
        }
      });

      console.log(`✓ Index péage construit : ${lines.length} tronçons`);
      return { lines, grid };
    }

    /* Renvoie le tronçon payant le plus proche d'un point (lat, lng), ou
       null si aucun tronçon n'est présent dans son voisinage indexé. */
    function tollLeProchePoint(lat, lng) {
      if (!tollIndex || tollIndex.lines.length === 0) return null;

      const cx = Math.floor(lng / GRID_CELL_DEG);
      const cy = Math.floor(lat / GRID_CELL_DEG);
      const candidats = new Set();
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const key = `${cx + dx}_${cy + dy}`;
          const bucket = tollIndex.grid.get(key);
          if (bucket) bucket.forEach(i => candidats.add(i));
        }
      }
      if (candidats.size === 0) return null;

      const pt = turf.point([lng, lat]);
      let meilleur = null, meilleureDist = Infinity;
      candidats.forEach(idx => {
        const ligne = tollIndex.lines[idx];
        const d = turf.pointToLineDistance(pt, ligne.turfLine, { units: 'meters' });
        if (d < meilleureDist) { meilleureDist = d; meilleur = ligne; }
      });

      if (meilleureDist > TOLERANCE_MATCH_METRES) return null;
      return meilleur;
    }

    
    /* --- CALCUL DU COÛT PÉAGE PAR MATCHING GÉOMÉTRIQUE ---
       Pour chaque segment du tracé Valhalla, on cherche le tronçon payant le
       plus proche dans la surcouche BD Carto. S'il est à moins de
       TOLERANCE_MATCH_METRES, ce tronçon est marqué "traversé". Aucun coût
       n'est calculé ici : chaque tronçon BD Carto porte déjà son propre
       cout_troncon_eur (figé lors de la génération du geojson) - on se
       contente de sommer les coûts des tronçons DISTINCTS traversés
       (idTroncon dédupliqué, pour ne jamais compter deux fois un même
       tronçon revisité par plusieurs points successifs du tracé). Aucun
       match trouvé = segment gratuit (BD Carto fait foi). */
    function calculerCoutPeage(routeCoords) {
      if (!tollIndex) return { total: 0, detail: [], indexIndisponible: true };

      const tronconsTraverses = new Map(); // idTroncon -> { numero, cout }

      for (let i = 0; i < routeCoords.length - 1; i++) {
        const [lat1, lng1] = routeCoords[i];
        const [lat2, lng2] = routeCoords[i + 1];
        const midLat = (lat1 + lat2) / 2, midLng = (lng1 + lng2) / 2;

        const troncon = tollLeProchePoint(midLat, midLng);
        if (!troncon) continue;

        if (!tronconsTraverses.has(troncon.idTroncon)) {
          tronconsTraverses.set(troncon.idTroncon, { numero: troncon.numero, cout: troncon.cout });
        }
      }

      let total = 0;
      const parAutoroute = {}; // { "A6": { cout: 4.4, nbTroncons: 3 } }
      tronconsTraverses.forEach(({ numero, cout }) => {
        total += cout;
        if (!parAutoroute[numero]) parAutoroute[numero] = { cout: 0, nbTroncons: 0 };
        parAutoroute[numero].cout += cout;
        parAutoroute[numero].nbTroncons += 1;
      });

      const detail = Object.entries(parAutoroute)
        .map(([numero, v]) => ({ numero, cout: v.cout, nbTroncons: v.nbTroncons }))
        .sort((a, b) => b.cout - a.cout);

      return { total, detail };
    }

    function toggleApiEngine() {
      const btn = document.getElementById('api-toggle-btn');
      if (currentGeocoder === 'photon') {
        currentGeocoder = 'ban';
        btn.textContent = 'BAN';
      } else {
        currentGeocoder = 'photon';
        btn.textContent = 'Photon';
      }
    }

    const map = L.map('map', { minZoom: 2, maxZoom: 18 });
    const franceBounds = L.latLngBounds([41.3, -5.2], [51.1, 9.6]);
    map.fitBounds(franceBounds, { padding: [10, 10] });

    const osmDeLayer = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
      minZoom: 2,
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    /* --- CREATION DU PANE POUR PÉAGES --- */
    map.createPane('tollPane');
    map.getPane('tollPane').style.zIndex = 350;

    /* --- SURCOUCHE TRONÇONS PAYANTS (GEOJSON, rendu Canvas) ---
       Rendu en Canvas plutôt que SVG (défaut Leaflet) : nettement plus
       rapide avec plusieurs milliers de tracés (un seul <canvas>, pas un
       <path> DOM par tronçon). */
    const tollLayer = L.geoJSON(null, {
      pane: 'tollPane',
      renderer: L.canvas({ pane: 'tollPane' }),
      style: {
        color: '#e74c3c',
        weight: 5,
        opacity: 0.9
      }
    });

    fetch('./autoroutes_payantes_surcouche.geojson')
      .then(res => {
        if (!res.ok) throw new Error("Fichier GeoJSON introuvable");
        return res.json();
      })
      .then(geoData => {
        tollLayer.clearLayers();
        tollLayer.addData(geoData);
        tollLayer.addTo(map);

        tollIndex = buildTollIndex(geoData);

        if (tollLayer.getBounds().isValid()) {
          map.fitBounds(tollLayer.getBounds(), { padding: [20, 20] });
        }
      })
      .catch(err => console.warn("Surcouche péages non chargée :", err));

    /* --- CONTRÔLE DES CALQUES & ÉCHELLE --- */
    const baseLayers = { "OpenStreetMap.de": osmDeLayer };
    const overlayLayers = {
      "Routes payantes (Péages)": tollLayer
    };

    const layerControl = L.control.layers(baseLayers, overlayLayers, { 
      position: 'topright', 
      collapsed: true 
    }).addTo(map);

    const layerContainer = layerControl.getContainer();

    L.DomEvent.disableClickPropagation(layerContainer);
    L.DomEvent.disableScrollPropagation(layerContainer);

    layerContainer.addEventListener('pointerdown', (e) => {
      if (!layerContainer.classList.contains('leaflet-control-layers-expanded')) {
        ignoreNextMapClick = true;
      }
    });

    L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);

    /* --- BOUTON DE RECADRAGE AUTOMATIQUE --- */
    const FitBoundsControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function(map) {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        const button = L.DomUtil.create('a', 'btn-fit-bounds', container);
        
        button.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
          </svg>
        `;
        button.href = '#';
        button.title = "Recadrer sur l'itinéraire ou les marqueurs";

        L.DomEvent.disableClickPropagation(container);

        button.onclick = function(e) {
          e.preventDefault();
          fitMapToContent();
        };

        return container;
      }
    });
    map.addControl(new FitBoundsControl());

    function fitMapToContent() {
      if (routeLayer && routeLayer.getBounds().isValid()) {
        map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
        return;
      }

      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        if (group.getBounds().isValid()) {
          map.fitBounds(group.getBounds(), { padding: [50, 50], maxZoom: 15 });
          return;
        }
      }

      map.fitBounds(franceBounds, { padding: [10, 10] });
    }

    let routeOpacity = 0.85;
    const opacityControl = L.control({ position: 'bottomleft' });
    opacityControl.onAdd = function() {
      const div = L.DomUtil.create('div', 'leaflet-control-opacity');
      div.innerHTML = `
        <span>Trace:</span>
        <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="${routeOpacity}">
      `;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    opacityControl.addTo(map);

    document.getElementById('opacity-slider').addEventListener('input', (e) => {
      routeOpacity = parseFloat(e.target.value);
      if (routeLayer) routeLayer.setStyle({ opacity: routeOpacity });
    });

    let routePoints = { start: null, end: null, vias: [] };
    let markers = [];
    let routeLayer = null;
    let decodedRouteCoords = [];
    let routeSummary = null;
    let routeLegs = [];
    let rawValhallaResponse = null;

    function closeAllSuggestions() {
      document.querySelectorAll('.suggestions').forEach(el => el.innerHTML = '');
      if (document.activeElement && document.activeElement.tagName === 'INPUT') {
        document.activeElement.blur();
      }
    }

    map.on('movestart dragstart', closeAllSuggestions);
    document.getElementById('ui-panel').addEventListener('scroll', closeAllSuggestions, { passive: true });

    map.on('click', function(e) {
      closeAllSuggestions();

      if (layerContainer.classList.contains('leaflet-control-layers-expanded')) {
        layerControl.collapse();
        ignoreNextMapClick = false;
        return;
      }

      if (ignoreNextMapClick) {
        ignoreNextMapClick = false;
        return;
      }

      const latlng = e.latlng;
      const coordsString = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;

      if (!routePoints.start) {
        setPoint('start', latlng, coordsString);
      } else if (!routePoints.end) {
        setPoint('end', latlng, coordsString);
      } else {
        addViaPoint(latlng);
      }
    });

    function setPoint(type, latlng, label) {
      routePoints[type] = latlng;
      if (type === 'start') {
        document.getElementById('start-input').value = label;
        toggleClearBtn('start-input', 'start-clear');
      }
      if (type === 'end') {
        document.getElementById('end-input').value = label;
        toggleClearBtn('end-input', 'end-clear');
      }
      updateMarkers();
    }

    function toggleClearBtn(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (input && btn) {
        btn.style.display = input.value.length > 0 ? 'block' : 'none';
      }
    }

    function handleClearClick(e, type, inputId, btnId) {
      e.preventDefault();
      
      const input = document.getElementById(inputId);
      if (input) {
        input.value = '';
        input.blur();
      }
      
      toggleClearBtn(inputId, btnId);
      closeAllSuggestions();
      
      if (type === 'start') {
        routePoints.start = null;
      } else if (type === 'end') {
        routePoints.end = null;
      } else if (typeof type === 'number') {
        routePoints.vias[type] = null;
      }
      
      updateMarkers();
    }

    function useCurrentLocation() {
      if (!navigator.geolocation) {
        alert("La géolocalisation n'est pas supportée par votre navigateur.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const latlng = L.latLng(position.coords.latitude, position.coords.longitude);
          const coordsString = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
          setPoint('start', latlng, coordsString);
          map.setView(latlng, 14);
        },
        (error) => alert(`Erreur de géolocalisation : ${error.message}`),
        { enableHighAccuracy: true }
      );
    }

    function addViaPoint(latlng = null) {
      routePoints.vias.push(latlng);
      renderViaInputs();
      updateMarkers();
    }

    function renderViaInputs() {
      const container = document.getElementById('via-points');
      container.innerHTML = '';

      routePoints.vias.forEach((v, index) => {
        const div = document.createElement('div');
        div.className = 'input-group';
        div.style.marginTop = '4px';
        const coordsStr = v ? `${v.lat.toFixed(5)}, ${v.lng.toFixed(5)}` : '';

        div.innerHTML = `
          <div class="input-row">
            <div class="input-with-clear">
              <input type="text" id="via-input-${index}" placeholder="Étape N°${index + 1}" value="${coordsStr}" oninput="toggleClearBtn('via-input-${index}', 'via-clear-${index}')">
              <button type="button" class="btn-clear-text" id="via-clear-${index}" onmousedown="handleClearClick(event, ${index}, 'via-input-${index}', 'via-clear-${index}')">✕</button>
            </div>
            <button class="btn btn-secondary btn-icon" onclick="moveVia(${index}, -1)" ${index === 0 ? 'disabled' : ''}>⬆️</button>
            <button class="btn btn-secondary btn-icon" onclick="moveVia(${index}, 1)" ${index === routePoints.vias.length - 1 ? 'disabled' : ''}>⬇️</button>
            <button class="btn-remove-step" onclick="removeVia(${index})" title="Supprimer">🗑️</button>
          </div>
          <div id="via-suggestions-${index}" class="suggestions"></div>
        `;
        container.appendChild(div);

        toggleClearBtn(`via-input-${index}`, `via-clear-${index}`);

        setupAutocomplete(document.getElementById(`via-input-${index}`), document.getElementById(`via-suggestions-${index}`), (coords, name) => {
          routePoints.vias[index] = coords;
          document.getElementById(`via-input-${index}`).value = name;
          toggleClearBtn(`via-input-${index}`, `via-clear-${index}`);
          updateMarkers();
        });
      });
    }

    function moveVia(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= routePoints.vias.length) return;
      const temp = routePoints.vias[index];
      routePoints.vias[index] = routePoints.vias[newIndex];
      routePoints.vias[newIndex] = temp;
      renderViaInputs();
      updateMarkers();
    }

    function removeVia(index) {
      routePoints.vias.splice(index, 1);
      renderViaInputs();
      updateMarkers();
    }

    function reverseFullRoute() {
      const tempStart = routePoints.start;
      const startVal = document.getElementById('start-input').value;

      routePoints.start = routePoints.end;
      document.getElementById('start-input').value = document.getElementById('end-input').value;

      routePoints.end = tempStart;
      document.getElementById('end-input').value = startVal;

      routePoints.vias.reverse();

      toggleClearBtn('start-input', 'start-clear');
      toggleClearBtn('end-input', 'end-clear');
      renderViaInputs();
      updateMarkers();
    }

    function createPinIcon(label, color) {
      const svg = `
        <div class="pin-marker">
          <svg viewBox="0 0 384 512">
            <path fill="${color}" stroke="#ffffff" stroke-width="20" d="M172.268 501.67C26.97 291.03 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.03-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0z"/>
          </svg>
          <div class="pin-label">${label}</div>
        </div>
      `;
      return L.divIcon({
        className: 'custom-pin-icon',
        html: svg,
        iconSize: [32, 42],
        iconAnchor: [16, 42],
        popupAnchor: [0, -38]
      });
    }

    function updateMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      if (routePoints.start) {
        const m = L.marker(routePoints.start, { icon: createPinIcon('D', '#2ecc71'), draggable: true }).addTo(map).bindPopup("Départ");
        m.on('dragend', function(e) {
          const latlng = e.target.getLatLng();
          const coordsStr = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
          setPoint('start', latlng, coordsStr);
        });
        markers.push(m);
      }

      routePoints.vias.forEach((v, i) => {
        if (v) {
          const m = L.marker(v, { icon: createPinIcon(i + 1, '#e67e22'), draggable: true }).addTo(map).bindPopup(`Étape N°${i + 1}`);
          m.on('dragend', function(e) {
            const latlng = e.target.getLatLng();
            routePoints.vias[i] = latlng;
            const input = document.getElementById(`via-input-${i}`);
            if (input) {
              input.value = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
              toggleClearBtn(`via-input-${i}`, `via-clear-${i}`);
            }
          });
          markers.push(m);
        }
      });

      if (routePoints.end) {
        const m = L.marker(routePoints.end, { icon: createPinIcon('A', '#e74c3c'), draggable: true }).addTo(map).bindPopup("Arrivée");
        m.on('dragend', function(e) {
          const latlng = e.target.getLatLng();
          const coordsStr = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
          setPoint('end', latlng, coordsStr);
        });
        markers.push(m);
      }
    }

    function setupAutocomplete(inputEl, suggestionsEl, onSelect) {
      let timer;
      inputEl.addEventListener('input', () => {
        clearTimeout(timer);
        const query = inputEl.value.trim();
        if (query.length < 3) { suggestionsEl.innerHTML = ''; return; }

        timer = setTimeout(() => {
          const center = map.getCenter();
          const currentZoom = map.getZoom();

          let url = "";
          if (currentGeocoder === 'ban') {
            url = `https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(query)}&lat=${center.lat}&lon=${center.lng}&limit=5`;
          } else {
            url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bbox=-5.2,41.3,9.6,51.1&lat=${center.lat}&lon=${center.lng}&zoom=${currentZoom}&lang=fr&limit=5`;
          }

          fetch(url)
            .then(res => res.json())
            .then(data => {
              suggestionsEl.innerHTML = '';
              if (!data.features || data.features.length === 0) return;

              data.features.forEach(feature => {
                const props = feature.properties;
                const div = document.createElement('div');
                div.className = 'suggestion-item';

                let mainName = "";
                let city = "";
                let postcode = "";
                let lat, lng;

                if (currentGeocoder === 'ban') {
                  mainName = props.name || props.label;
                  city = props.city || '';
                  postcode = props.postcode ? `(${props.postcode})` : '';
                  [lng, lat] = feature.geometry.coordinates;
                } else {
                  mainName = props.name || props.street || '';
                  if (props.street && props.name && props.name !== props.street) {
                    mainName += ` (${props.street})`;
                  }
                  city = props.city || props.town || props.village || '';
                  postcode = props.postcode ? `(${props.postcode})` : '';
                  [lng, lat] = feature.geometry.coordinates;
                }

                div.innerHTML = `<strong>${mainName}</strong> <small style="color:#666; margin-left:5px;">${city} ${postcode}</small>`;

                div.onclick = (e) => {
                  e.stopPropagation();
                  const fullLabel = [props.name || props.street || props.label, city].filter(Boolean).join(', ');
                  
                  onSelect(L.latLng(lat, lng), fullLabel);
                  suggestionsEl.innerHTML = '';
                  inputEl.blur();
                };
                suggestionsEl.appendChild(div);
              });
            })
            .catch(() => {});
        }, 300);
      });
    }

    setupAutocomplete(document.getElementById('start-input'), document.getElementById('start-suggestions'), (coords, name) => {
      setPoint('start', coords, name);
      toggleClearBtn('start-input', 'start-clear');
    });

    setupAutocomplete(document.getElementById('end-input'), document.getElementById('end-suggestions'), (coords, name) => {
      setPoint('end', coords, name);
      toggleClearBtn('end-input', 'end-clear');
    });

    function formatDuration(totalSeconds) {
      const totalMinutes = Math.round(totalSeconds / 60);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return hours > 0 ? `${hours} h ${minutes > 0 ? minutes + ' min' : ''}`.trim() : `${minutes} min`;
    }

    async function calculateRoute() {
      if (!routePoints.start || !routePoints.end) {
        alert("Veuillez sélectionner au moins un départ et une arrivée.");
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('route-summary').style.display = 'none';

      const locations = [
        { lat: routePoints.start.lat, lon: routePoints.start.lng, type: "break" },
        ...routePoints.vias.filter(v => v !== null).map(v => ({ lat: v.lat, lon: v.lng, type: "through" })),
        { lat: routePoints.end.lat, lon: routePoints.end.lng, type: "break" }
      ];

      const autoOptions = {};
      const speedVal = document.getElementById('speed-limit-select').value;
      if (speedVal !== 'none') autoOptions.top_speed = parseInt(speedVal, 10);
      if (document.getElementById('avoid-tolls-check').checked) {
        autoOptions.use_tolls = 0.0;
        autoOptions.toll_booth_penalty = 43200;
      }

      const payload = {
        locations: locations,
        costing: "auto",
        costing_options: { auto: autoOptions },
        directions_options: { language: "fr-FR" }
      };

      try {
        const response = await fetch(`https://api.stadiamaps.com/route/v1?api_key=${STADIA_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok || !data.trip) throw new Error(data.status_message || "Impossible de calculer l'itinéraire.");

        rawValhallaResponse = data;
        processValhallaResponse(data);
      } catch (error) {
        alert(`Erreur : ${error.message}`);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function processValhallaResponse(data) {
      routeSummary = data.trip.summary;
      routeLegs = data.trip.legs;
      decodedRouteCoords = [];

      routeLegs.forEach(leg => {
        decodedRouteCoords = decodedRouteCoords.concat(decodePolyline(leg.shape, 6));
      });

      if (routeLayer) map.removeLayer(routeLayer);
      routeLayer = L.polyline(decodedRouteCoords, { color: '#2980b9', weight: 6, opacity: routeOpacity }).addTo(map);

      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
      displayInstructions();
    }

    function displayInstructions() {
      const summaryDiv = document.getElementById('route-summary');
      const statsDiv = document.getElementById('route-stats');
      const listDiv = document.getElementById('instructions-list');

      const peage = calculerCoutPeage(decodedRouteCoords);
      const peageStr = peage.indexIndisponible
        ? ' | Péage : indisponible (surcouche non chargée)'
        : (peage.total > 0.01 ? ` | Péage : ~${peage.total.toFixed(2)} €` : ' | Péage : sans péage');
      statsDiv.textContent = `Distance : ${routeSummary.length.toFixed(2)} km | Temps : ~${formatDuration(routeSummary.time)}${peageStr}`;

      const oldDetail = document.getElementById('route-peage-detail');
      if (oldDetail) oldDetail.remove();

      if (peage.detail.length > 0) {
        const detailStr = peage.detail
          .map(d => `${d.numero === '?' ? 'segment non identifié' : d.numero}: ${d.nbTroncons} tronçon${d.nbTroncons > 1 ? 's' : ''} → ${d.cout.toFixed(2)} €`)
          .join(' · ');
        const detailDiv = document.createElement('div');
        detailDiv.id = 'route-peage-detail';
        detailDiv.style.cssText = 'font-size:0.75rem; color:var(--muted); margin-bottom:6px;';
        detailDiv.textContent = detailStr;
        statsDiv.insertAdjacentElement('afterend', detailDiv);
      }

      listDiv.innerHTML = '';

      let cumulatedKm = 0;
      routeLegs.forEach((leg) => {
        leg.maneuvers.forEach((step) => {
          const item = document.createElement('div');
          item.className = 'step-item';
          const distMeters = Math.round(step.length * 1000);
          const distStr = distMeters >= 1000 ? `${(distMeters / 1000).toFixed(1)} km` : `${distMeters} m`;
          item.textContent = `[Km ${cumulatedKm.toFixed(1)}] ${step.instruction} (${distStr})`;
          listDiv.appendChild(item);
          cumulatedKm += step.length;
        });
      });

      summaryDiv.style.display = 'block';
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.trip && data.trip.locations) {
            rawValhallaResponse = data;
            const locs = data.trip.locations;
            
            const startLoc = locs[0];
            const endLoc = locs[locs.length - 1];

            setPoint('start', L.latLng(startLoc.lat, startLoc.lon), `${startLoc.lat.toFixed(5)}, ${startLoc.lon.toFixed(5)}`);
            setPoint('end', L.latLng(endLoc.lat, endLoc.lon), `${endLoc.lat.toFixed(5)}, ${endLoc.lon.toFixed(5)}`);
            
            routePoints.vias = locs.slice(1, -1).map(l => L.latLng(l.lat, l.lon));
            renderViaInputs();
            processValhallaResponse(data);
          } else {
            throw new Error("Format non supporté.");
          }
        } catch (err) {
          alert(`Erreur d'importation : ${err.message}`);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function exportGPX() {
      if (!decodedRouteCoords || decodedRouteCoords.length === 0) return;
      let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="GeoRouter"><trk><name>Itinéraire</name><trkseg>\n`;
      decodedRouteCoords.forEach(c => gpx += `  <trkpt lat="${c[0]}" lon="${c[1]}"></trkpt>\n`);
      gpx += `</trkseg></trk></gpx>`;

      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'itineraire.gpx';
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportJSON() {
      if (!rawValhallaResponse) return;
      const blob = new Blob([JSON.stringify(rawValhallaResponse, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'itineraire.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    // --- PONT DE COMMUNICATION VERS ROADBOOK VE (via localStorage) ---
    const HANDOFF_KEY = 'current_route_data';

    function sendToRoadbook() {
      if (!rawValhallaResponse) {
        alert("Veuillez d'abord calculer un itinéraire avant de l'envoyer vers Roadbook VE.");
        return;
      }
      try {
        const payload = {
          type: 'json',
          filename: 'itineraire.json',
          content: JSON.stringify(rawValhallaResponse),
          source: 'georouter',
          ts: Date.now()
        };
        localStorage.setItem(HANDOFF_KEY, JSON.stringify(payload));
        window.location.href = './roadbook.html';
      } catch (err) {
        alert("Impossible de transmettre l'itinéraire (stockage local plein ou indisponible) : " + err.message);
      }
    }

    function decodePolyline(str, precision) {
      let index = 0, lat = 0, lng = 0, coordinates = [], shift = 0, result = 0, byte = null;
      let factor = Math.pow(10, precision || 5);
      while (index < str.length) {
        byte = null; shift = 0; result = 0;
        do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
        let latitude = ((result & 1) ? ~(result >> 1) : (result >> 1));
        lat += latitude; shift = 0; result = 0;
        do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
        let longitude = ((result & 1) ? ~(result >> 1) : (result >> 1));
        lng += longitude;
        coordinates.push([lat / factor, lng / factor]);
      }
      return coordinates;
    }
  </script>
