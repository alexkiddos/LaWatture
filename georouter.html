<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0B0E" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <title>GeoRouter - Valhalla (Stadia Maps)</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Turf.js pour le matching géométrique tracé <-> tronçons payants (calcul du péage) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

  <!-- Polices de l'interface (zone basse uniquement — la carte garde ses styles Leaflet natifs) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFFFFF; --text: #111114; --muted: #6B6B72; --border: #EBEBEE;
      --card-bg: #FAFAFB; --input-bg: #FAFAFB; --input-border: #EBEBEE;
      --options-bg: #FAFAFB; --options-border: #EBEBEE;
      --hover-bg: #E8F1FD;
      --panel-2: #E9EAED; --line-strong: #C3C4CB;
      --accent: #0B72E7; --on-accent: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0B0E; --text: #F2F2F5; --muted: #8B8B93; --border: #232329;
        --card-bg: #141418; --input-bg: #141418; --input-border: #232329;
        --options-bg: #141418; --options-border: #232329;
        --hover-bg: #1B2A3D;
        --panel-2: #232329; --line-strong: #4A4A54;
        --accent: #4FA3FF; --on-accent: #0B0B0E;
      }
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    #map {
      position: relative;
      width: 100%;
      flex: 0 0 auto;
      z-index: 1;
      min-height: 40px; /* filet de sécurité avant que le JS ne fixe la hauteur exacte */
    }

    /* --- BOTTOM SHEET : 3 hauteurs (peek / half / full), glissable --- */
    /* Occupe le reste de l'écran sous la carte (pas de superposition) */
    .sheet {
      position: relative; width: 100%; flex: 0 0 auto; z-index: 20;
      background: var(--card-bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      border-radius: 0;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.28s cubic-bezier(.4,0,.2,1);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet.dragging { transition: none; }

    .sheet-handle-zone {
      display: flex; align-items: center; justify-content: center;
      height: 34px; flex-shrink: 0; cursor: grab; touch-action: none;
    }
    .sheet-handle { width: 38px; height: 4px; border-radius: 2px; background: var(--muted); }

    /* Zone tampon invisible juste au-dessus du sheet, déborde dans la carte
       pour élargir la cible de préhension (évite les taps ratés sur la carte). */
    .sheet-drag-buffer {
      position: fixed; left: 0; right: 0; height: 22px; z-index: 19;
      cursor: grab; touch-action: none;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.03));
    }

    .sheet-summary {
      display: flex; align-items: center; gap: 10px; padding: 0 16px 12px; flex-shrink: 0; cursor: pointer;
    }
    .summary-text {
      flex: 1; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.98rem;
      color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .summary-text .muted { color: var(--muted); font-weight: 500; }
    .summary-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .sheet-pinned { flex-shrink: 0; padding: 0 16px 12px; }

    .sheet-body {
      flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 8px;
    }

    .settings-panel { padding: 2px 0 4px; }
    .settings-panel[hidden] { display: none; }


    h2 {
      margin: 0 0 2px 0; font-size: 1.1rem; color: var(--text);
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.01em;
    }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line-strong);
      background: var(--panel-2); color: var(--text); display: inline-flex; align-items: center;
      justify-content: center; cursor: pointer; text-decoration: none; flex-shrink: 0;
      transition: filter 0.15s, color 0.15s;
    }
    .icon-btn svg { width: 17px; height: 17px; }
    .icon-btn:hover { color: var(--accent); filter: brightness(0.96); }
    .icon-btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
    .icon-btn.active { color: var(--accent); background: var(--hover-bg); }
    .icon-btn-ghost { background: transparent; border-color: transparent; }
    .icon-btn-ghost:hover { background: var(--hover-bg); filter: none; }
    .icon-btn-sm { width: 34px; height: 34px; border-radius: 9px; }
    .icon-btn-sm svg { width: 15px; height: 15px; }

    /* --- carte de trajet : pastilles départ/arrivée façon appli de nav --- */
    .route-card { display: flex; flex-direction: column; gap: 6px; }
    .route-row { display: flex; align-items: flex-start; gap: 8px; }
    .route-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 14px;
      border: 2px solid var(--accent); background: var(--card-bg);
    }
    .route-dot-end { background: var(--accent); border-color: var(--accent); }
    .route-dot-via {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 9px;
      background: var(--options-bg); border: 1px solid var(--options-border); color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 700; font-family: 'Space Grotesk', sans-serif;
    }
    .route-row > .input-group { flex: 1; min-width: 0; }
    
    .input-group { position: relative; display: flex; flex-direction: column; gap: 4px; }
    .input-row { display: flex; gap: 6px; align-items: center; }
    
    .input-with-clear {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    input[type="text"], select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      font-size: 0.9rem;
      background-color: var(--input-bg);
      color: var(--text);
    }

    .input-with-clear input {
      padding-right: 30px;
    }

    .btn-clear-text {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 50%;
      display: none;
      line-height: 1;
      touch-action: manipulation;
    }
    .btn-clear-text:active { background-color: var(--options-bg); color: var(--text); }

    .btn-remove-step {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
      border-radius: 6px;
      padding: 7px 9px;
      cursor: pointer;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .btn-remove-step:active { background-color: #e53935; color: white; }

    /* --- segmented control : moteur de recherche / vitesse max --- */
    .segmented {
      display: flex; gap: 3px; background: var(--card-bg); border: 1px solid var(--line-strong);
      border-radius: 10px; padding: 3px;
    }
    .segmented-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .segmented-btn {
      flex: 1; border: none; background: transparent; color: var(--muted);
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.78rem;
      padding: 7px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .segmented-btn.active { background: var(--accent); color: var(--on-accent); }

    /* --- ligne d'option avec interrupteur (façon "options d'itinéraire" des apps de nav) --- */
    .option-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; cursor: pointer; user-select: none;
      background: var(--card-bg); border: 1px solid var(--line-strong); border-radius: 10px;
    }
    .option-row-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text); font-weight: 500; }
    .option-row-label svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }

    .switch { position: relative; display: inline-block; width: 40px; height: 24px; flex-shrink: 0; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch-track {
      position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background 0.15s;
    }
    .switch-thumb {
      position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform 0.15s;
    }
    .switch input:checked ~ .switch-track { background: var(--accent); }
    .switch input:checked ~ .switch-track .switch-thumb { transform: translateX(16px); }
    .switch input:focus-visible ~ .switch-track { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* --- réordonnancement des étapes par glisser-déposer --- */
    .drag-handle {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      color: var(--muted); cursor: grab; touch-action: none; flex-shrink: 0; border-radius: 9px;
      margin-top: 3px;
    }
    .drag-handle:hover, .drag-handle:active { color: var(--accent); background: var(--hover-bg); }
    .drag-handle svg { width: 16px; height: 16px; pointer-events: none; }
    .route-row.dragging { opacity: 0.5; }
    .route-row.drag-over { box-shadow: 0 -2px 0 var(--accent); }

    .suggestions:not(:empty) {
      margin-top: 4px;
      background: var(--card-bg);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      max-height: 180px;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.10);
      -webkit-overflow-scrolling: touch;
    }
    .suggestions:empty { display: none; }
    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text);
      border-bottom: 1px solid var(--line-strong);
      -webkit-tap-highlight-color: rgba(52, 152, 219, 0.2);
      user-select: none;
    }
    .suggestion-item:active { background: var(--hover-bg); }

    .btn-grid {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      font-family: 'Inter', sans-serif;
      transition: filter 0.15s, background 0.2s;
      flex: 1;
      text-align: center;
    }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-secondary:hover, .btn-secondary:active { color: var(--accent); filter: brightness(0.96); }
    .btn-secondary:disabled { opacity: 0.4; cursor: default; }
    .btn-outline { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-strong); }
    .btn-outline:hover { color: var(--accent); filter: brightness(0.96); }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn-icon { padding: 8px; flex: initial; width: 38px; display: inline-flex; align-items: center; justify-content: center; }
    .btn-svg { width: 15px; height: 15px; flex-shrink: 0; }
    .btn-pill { border-radius: 999px !important; padding: 12px !important; font-size: 0.9rem !important; }
    .btn-fixed { height: 50px; border-radius: 12px !important; padding: 0 !important; font-size: 0.92rem !important; flex: none; width: 100%; }
    .btn-send { background: #16a34a; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 4px; }
    #route-peage-detail { font-size: 0.72rem; color: var(--muted); margin: 6px 0 4px; display: none; }

    /* --- Étiquettes des points sur la carte : bouton supprimer --- */
    .pt-popup { display: flex; flex-direction: column; gap: 8px; min-width: 140px; }
    .pt-popup b { font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; }
    .pt-popup-del {
      border: none; border-radius: 8px; background: #fee2e2; color: #dc2626;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.8rem;
      padding: 9px 10px; cursor: pointer; width: 100%;
    }
    .pt-popup-del:active { background: #fecaca; }

    .log-panel {
      display: none;
      position: fixed; inset: 0; z-index: 2000;
      background: #0d1117; color: #8ee08e;
      flex-direction: column;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
    .log-panel.show { display: flex; }
    .log-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top));
      background: #161b22; color: #e6edf3; font-size: 0.82rem; font-weight: 600;
      flex-shrink: 0;
    }
    .log-panel-btn {
      background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px;
      padding: 5px 10px; font-size: 0.72rem; cursor: pointer; font-family: inherit;
    }
    .log-panel-content {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 10px 14px 30px; font-size: 0.72rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
      user-select: text; -webkit-user-select: text;
    }
    .log-line { border-bottom: 1px dashed #21262d; padding: 3px 0; }
    .log-line .log-time { color: #6e7681; }
    .log-line .log-cat { color: #58a6ff; font-weight: 700; }
    .log-line.log-err .log-cat { color: #f85149; }
    .log-line.log-err { color: #ffa198; }
    .btn-send:hover { filter: brightness(1.05); }

    .summary-divider { height: 1px; background: var(--border); margin: 10px 0 12px; }

    .stats-row { display: flex; gap: 8px; margin-bottom: 4px; }
    .stat-block { flex: 1; background: var(--card-bg); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; }
    .stat-block .stat-label { font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .stat-block .stat-value { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--text); margin-top: 1px; }
    .stat-block.stat-toll .stat-value { color: var(--accent); }

    .instructions {
      margin-top: 10px;
      padding-top: 4px;
    }
    .step-item {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 0.8rem; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--text);
    }
    .step-item .step-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; }
    .step-item .step-text { flex: 1; line-height: 1.4; }
    .step-item .step-dist { font-family: 'Space Grotesk', sans-serif; font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
    #loading { display: none; color: var(--accent); font-weight: bold; font-size: 0.85rem; text-align: center; }

    .pin-marker {
      position: relative;
      width: 32px;
      height: 42px;
    }
    .pin-marker svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.4));
    }
    .pin-label {
      position: absolute;
      top: 7px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 13px;
      pointer-events: none;
    }

    .btn-opacity-slider {
      background-color: #fff;
      width: 30px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .btn-opacity-slider input[type="range"] {
      width: 76px;
      height: 30px;
      margin: 0;
      transform: rotate(-90deg);
      cursor: pointer;
      accent-color: #2980b9;
    }

    .btn-fit-bounds {
      background-color: #fff;
      width: 30px;
      height: 30px;
      position: relative;
      cursor: pointer;
      display: block;
      text-decoration: none;
    }
    .btn-fit-bounds svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #444;
      display: block;
    }
    .btn-fit-bounds:hover { background-color: #f4f4f4; }
    .btn-fit-bounds:hover svg { color: #000; }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="sheet-drag-buffer" id="sheetDragBuffer" aria-hidden="true"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-handle-zone" id="sheetHandle">
      <span class="sheet-handle" aria-hidden="true"></span>
    </div>

    <div class="sheet-summary" id="sheetSummary">
      <div class="summary-text" id="summaryText">Où souhaitez-vous aller ?</div>
      <div class="summary-actions">
        <button type="button" class="icon-btn" id="settingsBtn" title="Réglages" aria-label="Réglages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <a href="./index.html" class="icon-btn" title="Retour à l'accueil" aria-label="Retour à l'accueil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        </a>
      </div>
    </div>

    <!-- Zone épinglée : toujours visible, même en position basse -->
    <div class="sheet-pinned" id="sheetPinned">
      <button class="btn btn-primary btn-fixed" onclick="calculateRoute()">Calculer l'itinéraire</button>
      <div id="loading">Calcul de l'itinéraire en cours...</div>
    </div>

    <div class="sheet-body" id="sheetBody">

    <div class="route-card" id="points-container">
      <!-- DÉPART -->
      <div class="route-row">
        <span class="route-dot route-dot-start" aria-hidden="true"></span>
        <div class="input-group">
          <div class="input-row">
            <div class="input-with-clear">
              <input type="text" id="start-input" placeholder="Départ (clic carte ou recherche)" oninput="toggleClearBtn('start-input', 'start-clear')" />
              <button type="button" class="btn-clear-text" id="start-clear" onmousedown="handleClearClick(event, 'start', 'start-input', 'start-clear')">✕</button>
            </div>
            <button class="icon-btn icon-btn-ghost" onclick="useCurrentLocation()" title="Ma position actuelle" aria-label="Ma position actuelle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            </button>
          </div>
          <div id="start-suggestions" class="suggestions"></div>
        </div>
      </div>

      <!-- VIA POINTS (DYNAMIQUES) -->
      <div id="via-points"></div>

      <!-- ARRIVÉE -->
      <div class="route-row">
        <span class="route-dot route-dot-end" aria-hidden="true"></span>
        <div class="input-group">
          <div class="input-row">
            <div class="input-with-clear">
              <input type="text" id="end-input" placeholder="Arrivée (clic carte ou recherche)" oninput="toggleClearBtn('end-input', 'end-clear')" />
              <button type="button" class="btn-clear-text" id="end-clear" onmousedown="handleClearClick(event, 'end', 'end-input', 'end-clear')">✕</button>
            </div>
            <button class="icon-btn icon-btn-ghost" onclick="reverseFullRoute()" title="Inverser le trajet" aria-label="Inverser le trajet">
